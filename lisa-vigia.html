/* ===== src/js/components/graficoAprendizaje.js ===== */
(() => {
  const { crear, crearSVG, vaciar, paleta } = REGISTRO;
/* =========================================================================
   LISA vigIA — Curva de aprendizaje del modelo.
   Traza cómo subió la precisión mientras caían los falsos positivos, con el
   ahorro mensual como cimiento al fondo.

   El reparto de peso visual es deliberado: la precisión manda —trazo grueso
   y área rellena—, los falsos positivos acompañan en un trazo fino, y las
   columnas del ahorro se mantienen tenues para sostener la lectura sin
   competir. Las series se interpolan como curvas suaves porque describen
   un aprendizaje continuo, no saltos discretos.
   ========================================================================= */
const ANCHO = 860;
const ALTO = 400;
const MARGEN = { arriba: 52, derecha: 32, abajo: 58, izquierda: 52 };

const ANCHO_TRAMA = ANCHO - MARGEN.izquierda - MARGEN.derecha;
const ALTO_TRAMA = ALTO - MARGEN.arriba - MARGEN.abajo;

/* Identificadores únicos por instancia: el gráfico puede dibujarse más de
   una vez y los degradados no deben colisionar entre sí. */
let contador = 0;

/* Rótulo corto para los montos, con la coma decimal de la convención
   local: 15400000 se lee como "$15,4M" y 620000 como "$620K". */
function montoCorto(monto) {
  if (monto === 0) {
    return "$0";
  }

  if (monto >= 1000000) {
    const millones = monto / 1000000;
    const texto = Number.isInteger(millones) ? String(millones) : millones.toFixed(1);
    return `$${texto.replace(".", ",")}M`;
  }

  return `$${Math.round(monto / 1000)}K`;
}

/**
 * Traza una curva suave que pasa por todos los puntos.
 * Usa splines cardinales: cada tramo toma su curvatura de los puntos
 * vecinos, de modo que la línea fluye sin inventar máximos que no están
 * en los datos.
 * @param {{x: number, y: number}[]} puntos
 * @param {number} [tension] 0 es una recta; valores altos curvan más.
 * @returns {string} Definición para el atributo d de un path.
 */
function curvaSuave(puntos, tension = 0.18) {
  if (puntos.length < 2) {
    return "";
  }

  let d = `M ${puntos[0].x} ${puntos[0].y}`;

  for (let i = 0; i < puntos.length - 1; i += 1) {
    const anterior = puntos[i - 1] ?? puntos[i];
    const actual = puntos[i];
    const siguiente = puntos[i + 1];
    const posterior = puntos[i + 2] ?? siguiente;

    const control1 = {
      x: actual.x + (siguiente.x - anterior.x) * tension,
      y: actual.y + (siguiente.y - anterior.y) * tension,
    };
    const control2 = {
      x: siguiente.x - (posterior.x - actual.x) * tension,
      y: siguiente.y - (posterior.y - actual.y) * tension,
    };

    d += ` C ${control1.x} ${control1.y}, ${control2.x} ${control2.y}, ${siguiente.x} ${siguiente.y}`;
  }

  return d;
}

/**
 * Dibuja la evolución del modelo a lo largo del período.
 * @param {object} opciones
 * @param {object[]} opciones.historial Meses con precisión y falsos positivos.
 * @param {object[]} opciones.hitos Capacidades incorporadas al modelo.
 * @returns {HTMLElement}
 */function crearGraficoAprendizaje({ historial, hitos }) {
  const COLOR = paleta();
  const contenedor = crear("div", { clase: "grafico" });

  contador += 1;
  const idArea = `areaPrecision${contador}`;
  const idBarra = `degradadoBarra${contador}`;
  const idBrillo = `brilloLinea${contador}`;

  const svg = crearSVG("svg", {
    clase: "grafico__lienzo",
    atributos: {
      viewBox: `0 0 ${ANCHO} ${ALTO}`,
      role: "img",
      "aria-label":
        "Evolución del modelo a lo largo de diez meses: la precisión sube del 20 % al 72 % con retrocesos intermedios, mientras los falsos positivos caen del 44 % al 17 % y el ahorro mensual pasa de 2,1 a 20,1 millones de pesos.",
    },
  });

  /* ------------------------------------------------------------------ */
  /* Definiciones: degradados y filtros                                  */
  /* ------------------------------------------------------------------ */

  const defs = crearSVG("defs");

  /* Área bajo la curva de precisión: se desvanece hacia abajo. */
  defs.appendChild(
    crearSVG("linearGradient", {
      atributos: { id: idArea, x1: "0", y1: "0", x2: "0", y2: "1" },
      hijos: [
        crearSVG("stop", {
          atributos: { offset: "0%", "stop-color": COLOR.precision, "stop-opacity": "0.28" },
        }),
        crearSVG("stop", {
          atributos: { offset: "55%", "stop-color": COLOR.precision, "stop-opacity": "0.09" },
        }),
        crearSVG("stop", {
          atributos: { offset: "100%", "stop-color": COLOR.precision, "stop-opacity": "0" },
        }),
      ],
    })
  );

  /* Las columnas se aclaran hacia su base, de modo que se apoyen en el eje
     en lugar de cortarse contra él. */
  defs.appendChild(
    crearSVG("linearGradient", {
      atributos: { id: idBarra, x1: "0", y1: "0", x2: "0", y2: "1" },
      hijos: [
        crearSVG("stop", {
          atributos: { offset: "0%", "stop-color": COLOR.acento, "stop-opacity": "0.26" },
        }),
        crearSVG("stop", {
          atributos: { offset: "100%", "stop-color": COLOR.acento, "stop-opacity": "0.05" },
        }),
      ],
    })
  );

  /* Halo tenue bajo la línea principal, para despegarla del fondo. */
  const filtro = crearSVG("filter", {
    atributos: { id: idBrillo, x: "-20%", y: "-40%", width: "140%", height: "180%" },
  });
  filtro.appendChild(
    crearSVG("feDropShadow", {
      atributos: {
        dx: "0",
        dy: "2",
        stdDeviation: "4",
        "flood-color": COLOR.precision,
        "flood-opacity": "0.28",
      },
    })
  );
  defs.appendChild(filtro);

  svg.appendChild(defs);

  const trama = crearSVG("g", {
    atributos: { transform: `translate(${MARGEN.izquierda}, ${MARGEN.arriba})` },
  });

  const paso = ANCHO_TRAMA / (historial.length - 1);
  const escalaX = (indice) => paso * indice;
  const escalaY = (porcentaje) => ALTO_TRAMA - (porcentaje / 100) * ALTO_TRAMA;

  /* --- Escala del ahorro mensual ------------------------------------- */

  /* El techo deja holgura sobre la barra más alta para que ninguna llegue
     al borde superior de la trama. */
  const ahorroMaximo = Math.max(...historial.map((mes) => mes.montoBloqueado));
  const techoAhorro = ahorroMaximo * 1.75;
  const escalaAhorro = (monto) => ALTO_TRAMA - (monto / techoAhorro) * ALTO_TRAMA;

  /* ------------------------------------------------------------------ */
  /* Rejilla                                                             */
  /* ------------------------------------------------------------------ */

  [0, 25, 50, 75, 100].forEach((valor) => {
    const y = escalaY(valor);
    const esBase = valor === 0;

    trama.appendChild(
      crearSVG("line", {
        atributos: {
          x1: 0,
          y1: y,
          x2: ANCHO_TRAMA,
          y2: y,
          stroke: COLOR.rejilla,
          "stroke-width": esBase ? 1.5 : 1,
          /* Solo la línea de base es continua; el resto se insinúa. */
          "stroke-dasharray": esBase ? "none" : "2 6",
          opacity: esBase ? 1 : 0.7,
        },
      })
    );

    trama.appendChild(
      crearSVG("text", {
        texto: `${valor}%`,
        atributos: {
          x: -14,
          y: y + 4,
          fill: COLOR.textoTenue,
          "font-size": 10.5,
          "font-family": "monospace",
          "text-anchor": "end",
        },
      })
    );
  });

  /* ------------------------------------------------------------------ */
  /* Columnas de ahorro, al fondo                                        */
  /* ------------------------------------------------------------------ */

  const anchoBarra = Math.min(paso * 0.34, 30);
  const radioBarra = anchoBarra / 2;

  /* Altura libre que hace falta sobre la columna para alojar su rótulo. */
  const HOLGURA_ROTULO = 20;

  historial.forEach((mes, indice) => {
    const centro = escalaX(indice);
    const x = centro - anchoBarra / 2;
    const y = escalaAhorro(mes.montoBloqueado);
    const alto = ALTO_TRAMA - y;
    const esFinal = indice === historial.length - 1;

    /* Si alguna curva pasa por la franja donde iría el rótulo, este baja al
       interior de la columna en lugar de superponerse al trazo. */
    const yPrecision = escalaY(mes.precision);
    const yFalsos = escalaY(mes.falsosPositivos);
    const invade = (yLinea) => yLinea > y - HOLGURA_ROTULO && yLinea < y + 6;
    const rotuloDentro = alto > 34 && (invade(yPrecision) || invade(yFalsos));

    /* La columna se dibuja como un rectángulo de cabeza redondeada: el
       radio superior la suaviza y la base queda a ras del eje. */
    const radio = Math.min(radioBarra, alto);
    const d = [
      `M ${x} ${ALTO_TRAMA}`,
      `L ${x} ${y + radio}`,
      `Q ${x} ${y} ${x + radio} ${y}`,
      `L ${x + anchoBarra - radio} ${y}`,
      `Q ${x + anchoBarra} ${y} ${x + anchoBarra} ${y + radio}`,
      `L ${x + anchoBarra} ${ALTO_TRAMA}`,
      "Z",
    ].join(" ");

    trama.appendChild(
      crearSVG("path", {
        atributos: {
          d,
          fill: `url(#${idBarra})`,
          opacity: esFinal ? 1 : 0.72,
        },
      })
    );

    /* El rótulo va sobre la columna salvo que una curva ocupe ese espacio,
       en cuyo caso baja al interior, donde el fondo tenue lo admite. */
    trama.appendChild(
      crearSVG("text", {
        texto: montoCorto(mes.montoBloqueado),
        atributos: {
          x: centro,
          y: rotuloDentro ? y + 17 : y - 9,
          fill: COLOR.acento,
          "font-size": esFinal ? 11 : 10,
          "font-weight": esFinal ? "700" : "600",
          "font-family": "monospace",
          "text-anchor": "middle",
          opacity: esFinal ? 1 : 0.85,
        },
      })
    );
  });

  /* ------------------------------------------------------------------ */
  /* Series                                                              */
  /* ------------------------------------------------------------------ */

  const puntosPrecision = historial.map((mes, indice) => ({
    x: escalaX(indice),
    y: escalaY(mes.precision),
  }));

  const puntosFalsos = historial.map((mes, indice) => ({
    x: escalaX(indice),
    y: escalaY(mes.falsosPositivos),

    punto.addEventListener("mouseleave", ocultarTooltip);

    const zona = crearSVG("rect", {

            "font-size": 15,

            "font-family": "monospace",
            "text-anchor": esFinal ? "end" : "start",

          x,

    crear("p", {
      clase: "grafico__ayuda",
      texto:
        "Cada columna indica el monto retenido ese mes: a medida que el modelo gana precisión, detiene más dinero. Los meses en negrita marcan la entrada de una capacidad nueva.",
    })

  contenedor.appendChild(svg);

  contenedor.appendChild(
    crear("div", {
      clase: "grafico__leyenda",
      hijos: [

        crearItemLeyenda(COLOR.critico, "Falsos positivos"),
        crearItemLeyenda(COLOR.acento, "Ahorro del mes", "barra"),
        crearItemLeyenda(COLOR.acento, "Mes con capacidad nueva", "guia"),
      ],
    })
  );

  contenedor.appendChild(tooltip);
  return contenedor;
}

/**
 * Construye un elemento de la leyenda.
 * @param {string} color
 * @param {string} texto
 * @param {"punto"|"barra"|"guia"} [forma] Cada muestra imita la forma con
 *   que su serie aparece en el gráfico: punto, columna o guía vertical.
 */
function crearItemLeyenda(color, texto, forma = "punto") {
  const modificador = forma === "punto" ? null : `grafico__muestra--${forma}`;
  const muestra = crear("span", { clase: ["grafico__muestra", modificador] });

  if (forma === "guia") {
    muestra.style.borderColor = color;
  } else {
    muestra.style.backgroundColor = color;
  }

  if (forma === "barra") {
    muestra.style.opacity = "0.3";
  }

  return crear("span", {
    clase: "grafico__leyenda-item",
    hijos: [muestra, crear("span", { texto })],
  });

/* ===== src/js/components/graficoAprendizajeVertical.js ===== */
(() => {
  const { crear, crearSVG, vaciar, paleta } = REGISTRO;
/* =========================================================================
   LISA vigIA — Curva de aprendizaje, disposición vertical.

   Variante para pantallas estrechas. El eje del tiempo baja por la
   izquierda y cada mes ocupa una franja horizontal propia, de modo que
   dispone de todo el ancho para su rótulo. Las barras del ahorro crecen
   hacia la derecha y las series de porcentaje se leen como dos columnas
   de puntos unidas por su trazo.

   No es el gráfico de escritorio encogido: comprimir aquella composición
   apretaría los elementos hasta solaparlos. Es una lectura distinta de los
   mismos datos, pensada para el formato en que se ve.
   ========================================================================= */


const ANCHO = 420;
/* Alto reservado a cada mes: da sitio al rótulo y a la barra. */
const ALTO_FILA = 52;
/* El margen derecho aloja el monto rotulado al final de cada barra. */
const MARGEN = { arriba: 56, derecha: 52, abajo: 28, izquierda: 46 };

/* Reparto horizontal: la franja de porcentajes a la izquierda y la del
   ahorro a la derecha, separadas para que no se pisen. */
const ANCHO_PORCENTAJE = 120;
const SEPARACION = 20;

let contador = 0;

/* Rótulo corto para los montos, con la coma decimal local. */
function montoCorto(monto) {
  if (monto === 0) {
    return "$0";
  }

  if (monto >= 1000000) {
    const millones = monto / 1000000;
    const texto = Number.isInteger(millones) ? String(millones) : millones.toFixed(1);
    return `$${texto.replace(".", ",")}M`;
  }

  return `$${Math.round(monto / 1000)}K`;
}

/**
 * Traza una curva suave vertical que pasa por todos los puntos.
 * @param {{x: number, y: number}[]} puntos
 * @param {number} [tension]
 * @returns {string}
 */
function curvaSuave(puntos, tension = 0.2) {
  if (puntos.length < 2) {
    return "";
  }

  let d = `M ${puntos[0].x} ${puntos[0].y}`;

  for (let i = 0; i < puntos.length - 1; i += 1) {
    const anterior = puntos[i - 1] ?? puntos[i];
    const actual = puntos[i];
    const siguiente = puntos[i + 1];
    const posterior = puntos[i + 2] ?? siguiente;

    const control1 = {
      x: actual.x + (siguiente.x - anterior.x) * tension,
      y: actual.y + (siguiente.y - anterior.y) * tension,
    };
    const control2 = {
      x: siguiente.x - (posterior.x - actual.x) * tension,
      y: siguiente.y - (posterior.y - actual.y) * tension,
    };

    d += ` C ${control1.x} ${control1.y}, ${control2.x} ${control2.y}, ${siguiente.x} ${siguiente.y}`;
  }

  return d;
}

/**
 * Dibuja la evolución del modelo en disposición vertical.
 * @param {object} opciones
 * @param {object[]} opciones.historial
 * @param {object[]} opciones.hitos
 * @returns {HTMLElement}
 */
function crearGraficoAprendizajeVertical({ historial, hitos }) {
  const COLOR = paleta();
  const contenedor = crear("div", { clase: ["grafico", "grafico--vertical"] });

  contador += 1;
  const idBarra = `barraVertical${contador}`;
  const idArea = `areaVertical${contador}`;

  const alto = MARGEN.arriba + historial.length * ALTO_FILA + MARGEN.abajo;

  const svg = crearSVG("svg", {
    clase: "grafico__lienzo",
    atributos: {
      viewBox: `0 0 ${ANCHO} ${alto}`,
      role: "img",
      "aria-label":
        "Evolución del modelo a lo largo de diez meses: la precisión sube del 20 % al 72 % con retrocesos intermedios, mientras los falsos positivos caen del 44 % al 17 % y el ahorro mensual pasa de 2,1 a 20,1 millones de pesos.",
    },
  });

  /* ------------------------------------------------------------------ */
  /* Definiciones                                                        */
  /* ------------------------------------------------------------------ */

  const defs = crearSVG("defs");

  /* Las barras se desvanecen hacia su extremo derecho. */
  defs.appendChild(
    crearSVG("linearGradient", {
      atributos: { id: idBarra, x1: "0", y1: "0", x2: "1", y2: "0" },
      hijos: [
        crearSVG("stop", {
          atributos: { offset: "0%", "stop-color": COLOR.acento, "stop-opacity": "0.32" },
        }),
        crearSVG("stop", {
          atributos: { offset: "100%", "stop-color": COLOR.acento, "stop-opacity": "0.1" },
        }),
      ],
    })
  );

  defs.appendChild(
    crearSVG("linearGradient", {
      atributos: { id: idArea, x1: "0", y1: "0", x2: "1", y2: "0" },
      hijos: [
        crearSVG("stop", {
          atributos: { offset: "0%", "stop-color": COLOR.precision, "stop-opacity": "0.22" },
        }),
        crearSVG("stop", {
          atributos: { offset: "100%", "stop-color": COLOR.precision, "stop-opacity": "0.02" },

    })

  const trama = crearSVG("g", {
    atributos: { transform: `translate(${MARGEN.izquierda}, ${MARGEN.arriba})` },

  /* ------------------------------------------------------------------ */

  const mesesConHito = new Map(hitos.map((hito) => [hito.abreviatura, hito]));
  const altoTrama = historial.length * ALTO_FILA;

  /* Guías verticales de la escala de porcentaje. */
  [0, 50, 100].forEach((valor) => {
    const x = escalaPorcentaje(valor);

    trama.appendChild(

        atributos: {

        },
      })

  historial.forEach((mes, indice) => {

    /* Banda tenue que agrupa la fila del mes con capacidad nueva. */
    if (hito) {

    }

      crearSVG("text", {

  function mostrarTooltip(mes, evento) {

    tooltip.appendChild(crear("p", { clase: "tooltip__titulo", texto: mes.mes }));

    [
      ["Precisión", `${mes.precision}%`],

      ["Ahorro del mes", montoCorto(mes.montoBloqueado)],

      ["Casos escapados", String(mes.escapados)],
    ].forEach(([clave, valor]) => {

    trama.appendChild(
      crearSVG("circle", {

      );
    }

    /* Franja completa sensible al puntero. */
    const zona = crearSVG("rect", {
      clase: "punto-dato",
      atributos: {
        x: -MARGEN.izquierda,
        y: y - ALTO_FILA / 2,
        width: ANCHO,
        height: ALTO_FILA,
        fill: "transparent",
      },
    });

    zona.addEventListener("mousemove", (evento) => mostrarTooltip(mes, evento));
    zona.addEventListener("mouseleave", ocultarTooltip);
    trama.appendChild(zona);
  });

  svg.appendChild(trama);

  contenedor.appendChild(
    crear("p", {
      clase: "grafico__titulo",
      texto: "Precisión del modelo y ahorro mensual",

  );

  contenedor.appendChild(tooltip);
  return contenedor;

/* Cifra destacada del titular. Las métricas que evolucionan llevan su valor

  const pie = nota
    ? crear("p", { clase: "titular__pie", texto: nota })
    : crear("p", {
        clase: [
          "titular__variacion",
          /* En métricas invertidas, bajar es mejorar. */
          mejora < 0 === invertido
            ? "titular__variacion--buena"
            : "titular__variacion--mala",
        ],
        hijos: [
          icono("tendencia", { tamano: 14 }),
          crear("span", { texto: `${desde} en diciembre` }),

  return crear("div", {
    clase: "titular__cifra",
    hijos: [
      crear("p", { clase: "etiqueta-campo", texto: etiqueta }),
      crear("p", { clase: "titular__valor", texto: valor }),
      pie,
    ],
  });
}

(() => {
  const { reemplazar, alCambiarTema, iniciarTema, esPantallaEstrecha, obtenerCaso, crearArmazon, mostrarAviso, crearVistaDashboard, crearVistaRegistro, crearVistaReporte, crearVistaRed, crearVistaForense, crearVistaArchivo } = REGISTRO;
/* =========================================================================
   LISA vigIA — Punto de entrada.
   Monta el armazón, resuelve la navegación entre vistas y mantiene el
   estado mínimo del prototipo (sección activa y caso en revisión).
   ========================================================================= */
/* Estado del prototipo. */
const estado = {
  seccion: "panel",
  idCaso: null,
  busqueda: "",
};

/* Referencias creadas al montar el armazón. */
let armazon = null;

/** Navega a una sección de la barra lateral. */
function navegar(seccion) {
  estado.seccion = seccion;
  estado.idCaso = null;
  dibujar();
}

/** Abre el reporte de un caso concreto. */
function abrirCaso(id) {
  const caso = obtenerCaso(id);

  if (!caso) {
    mostrarAviso({
      tipo: "alerta",
      titulo: "Caso no encontrado",
      texto: `No existe un expediente con el identificador ${id}.`,
    });
    return;
  }

  estado.seccion = "casos";
  estado.idCaso = id;
  dibujar();
}

/** Vuelve al panel inicial desde cualquier vista. */
function volverAlPanel() {
  navegar("panel");
}

/** Aplica la búsqueda de la cabecera sobre el registro de casos. */
function buscar(texto) {
  if (texto === "") {
    mostrarAviso({ titulo: "Búsqueda", texto: "Escriba un nombre, RUT o número de caso." });
    return;
  }

  estado.busqueda = texto;
  estado.seccion = "casos";
  estado.idCaso = null;
  dibujar();
}

/** Construye la vista que corresponde al estado actual. */
function resolverVista() {
  if (estado.idCaso) {
    return crearVistaReporte({
      caso: obtenerCaso(estado.idCaso),
      alVolver: volverAlPanel,
      alAbrirCaso: abrirCaso,
    });
  }

  if (estado.seccion === "casos") {
    return crearVistaRegistro({ alAbrirCaso: abrirCaso, busqueda: estado.busqueda });
  }

  if (estado.seccion === "red") {
    return crearVistaRed({ alAbrirCaso: abrirCaso });
  }

  if (estado.seccion === "forense") {
    return crearVistaForense({ alAbrirCaso: abrirCaso });
  }

  if (estado.seccion === "archivo") {
    return crearVistaArchivo({ alAbrirCaso: abrirCaso });
  }

  return crearVistaDashboard({ alAbrirCaso: abrirCaso });
}

/**
 * Vuelca la vista activa en el contenedor principal.
 * @param {boolean} [conservarPosicion] Mantiene el desplazamiento actual,
 *   para redibujados que no responden a una navegación del usuario.
 */
function dibujar(conservarPosicion = false) {
  const desplazamiento = window.scrollY;

  reemplazar(armazon.contenedorVista, resolverVista());
  armazon.marcarSeccion(estado.seccion);

  /* Una navegación empieza desde el inicio; un redibujado, donde estaba. */
  window.scrollTo({ top: conservarPosicion ? desplazamiento : 0, behavior: "auto" });
}

/** Arranca la aplicación. */
function iniciar() {
  iniciarTema();

  armazon = crearArmazon({ alNavegar: navegar, alBuscar: buscar });

  document.body.appendChild(armazon.app);
  document.body.appendChild(armazon.velo);

  dibujar();

  /* Los gráficos llevan sus colores en atributos del SVG, de modo que no
     los alcanza el cambio de variables: la vista se redibuja al alternar. */
  alCambiarTema(() => {
    if (armazon) {
      dibujar();
    }
  });

  vigilarAncho();
}

/**
 * Redibuja la vista cuando la ventana cruza el umbral de pantalla estrecha.
 * Los gráficos eligen su disposición al construirse, así que un cambio de
 * tamaño no los alcanza por sí solo. Solo se reconstruye al cruzar el
 * umbral, no en cada píxel del arrastre.
 */
function vigilarAncho() {
  let eraEstrecha = esPantallaEstrecha();
  let temporizador = null;

  window.addEventListener("resize", () => {
    const esEstrecha = esPantallaEstrecha();

    if (esEstrecha === eraEstrecha) {
      return;
    }

    eraEstrecha = esEstrecha;
    window.clearTimeout(temporizador);

    /* Se espera a que el arrastre se detenga antes de reconstruir. */
    temporizador = window.setTimeout(() => dibujar(true), 180);
  });
}

iniciar();

})();
};

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", arrancar);
} else {
  arrancar();
}
</script>
