<title>LISA vigIA</title>

<style>
/* ===== src/css/base.css ===== */
/* =========================================================================
   LISA vigIA — Fundaciones: reset, tokens de diseño y tipografía base.
   El font-size raíz es 62.5% para que 1rem = 10px y las medidas del
   maquetado se lean directamente en decenas de píxel.
   ========================================================================= */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  /* --- Superficies -------------------------------------------------- */
  --color-fondo: #0a0a0c;
  --color-superficie: #121215;
  --color-superficie-alta: #17171c;
  --color-superficie-suave: #1c1c22;
  --color-panel-datos: #1a2130;

  /* --- Bordes y separadores ----------------------------------------- */
  --color-borde: #26262e;
  --color-borde-suave: #1e1e24;
  --color-borde-acento: #3a3a46;

  /* --- Texto --------------------------------------------------------- */
  --color-texto: #f2f2f5;
  --color-texto-medio: #a0a0ae;
  --color-texto-tenue: #6e6e7c;

  /* --- Semáforo de riesgo -------------------------------------------- */
  --color-critico: #f2857f;
  --color-critico-fuerte: #e5484d;
  --color-critico-fondo: rgba(242, 133, 127, 0.12);
  --color-medio: #e5b567;
  --color-medio-fondo: rgba(229, 181, 103, 0.12);
  --color-bajo: #6ea8d8;
  --color-bajo-fondo: rgba(110, 168, 216, 0.12);
  --color-ok: #5fc9a0;

  /* --- Marca LISA ----------------------------------------------------- */
  --color-marca-turquesa: #3aa9b8;
  --color-marca-azul: #2f8fc7;
  --color-marca-violeta: #4a3a99;
  --color-accion: #c3cbf0;

  /* --- Tipografía ------------------------------------------------------ */
  --fuente-base: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --fuente-mono: "Cascadia Mono", "Consolas", "SF Mono", "Menlo", monospace;

  /* --- Ritmo espacial --------------------------------------------------- */
  --espacio-xs: 0.4rem;
  --espacio-sm: 0.8rem;
  --espacio-md: 1.6rem;
  --espacio-lg: 2.4rem;
  --espacio-xl: 3.2rem;

  --radio-sm: 0.4rem;
  --radio-md: 0.8rem;
  --radio-lg: 1.2rem;

  --ancho-sidebar: 26rem;
  --alto-topbar: 7rem;

  --sombra-panel: 0 0.2rem 1.6rem rgba(0, 0, 0, 0.45);
  --transicion: 160ms ease;
}

html {
  font-size: 62.5%; /* 1rem = 10px */
}

body {
  min-height: 100vh;
  background-color: var(--color-fondo);
  color: var(--color-texto);
  font-family: var(--fuente-base);
  font-size: 1.4rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* Ningún contenido ancho debe desplazar la página en horizontal: los
     bloques que lo necesitan gestionan su propio scroll interno. */
  overflow-x: hidden;
}

h1,
h2,
h3,
h4 {
  line-height: 1.2;
  font-weight: 600;
}

ul,
ol {
  list-style: none;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
  display: block;
}

table {
  border-collapse: collapse;
  width: 100%;
}

:focus-visible {
  outline: 0.2rem solid var(--color-accion);
  outline-offset: 0.2rem;
}

/* Texto reservado a lectores de pantalla. */
.solo-lectores {
  position: absolute;
  width: 0.1rem;
  height: 0.1rem;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Utilidades tipográficas de uso transversal. */
.dato-mono {
  font-family: var(--fuente-mono);
  font-variant-numeric: tabular-nums;
}

.etiqueta-campo {
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-texto-tenue);
}


/* ===== src/css/layout.css ===== */
/* =========================================================================
   LISA vigIA — Armazón de la aplicación: barra lateral, cabecera superior
   y contenedor de vistas. Grid de dos columnas que colapsa en móvil.
   ========================================================================= */

.app {
  display: grid;
  grid-template-columns: var(--ancho-sidebar) 1fr;
  min-height: 100vh;
}

/* ------------------------------------------------------------------ */
/* Barra lateral                                                       */
/* ------------------------------------------------------------------ */

.sidebar {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-lg);
  padding: var(--espacio-lg) var(--espacio-md);
  background-color: var(--color-fondo);
  border-right: 0.1rem solid var(--color-borde-suave);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar__marca {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
}

/* El PNG del logotipo trae un amplio margen transparente: se recorta con
   un contenedor de menor alto y un escalado que aprovecha ese espacio. */
.sidebar__logo {
  width: 5.6rem;
  height: 3.6rem;
  object-fit: cover;
  object-position: center;
  transform: scale(1.9);
  flex-shrink: 0;
}

.sidebar__marca {
  overflow: hidden;
}

.sidebar__nombre {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.sidebar__nombre span {
  background: linear-gradient(
    90deg,
    var(--color-marca-turquesa),
    var(--color-marca-violeta)
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.sidebar__estado {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
  font-size: 1.2rem;
  color: var(--color-texto-medio);
}

.sidebar__punto {
  width: 0.7rem;
  height: 0.7rem;
  border-radius: 50%;
  background-color: var(--color-critico);
  box-shadow: 0 0 0.8rem var(--color-critico);
}

.sidebar__accion {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--espacio-sm);
  width: 100%;
  padding: 1.2rem;
  background-color: var(--color-accion);
  color: #14141a;
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  border-radius: var(--radio-md);
  transition: filter var(--transicion);
}

.sidebar__accion:hover {
  filter: brightness(1.08);
}

.sidebar__nav {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-xs);
}

.sidebar__enlace {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  width: 100%;
  padding: 1.2rem var(--espacio-md);
  font-size: 1.4rem;
  color: var(--color-texto-medio);
  border-radius: var(--radio-md);
  text-align: left;
  transition: background-color var(--transicion), color var(--transicion);
}

.sidebar__enlace:hover {
  background-color: var(--color-superficie-alta);
  color: var(--color-texto);
}

.sidebar__enlace[aria-current="page"] {
  background-color: var(--color-superficie-suave);
  color: var(--color-texto);
  font-weight: 600;
}

.sidebar__enlace .icono {
  flex-shrink: 0;
  color: currentColor;
}

.sidebar__pie {
  margin-top: auto;
  padding-top: var(--espacio-md);
  border-top: 0.1rem solid var(--color-borde-suave);
  display: flex;
  flex-direction: column;
  gap: var(--espacio-xs);
}

/* ------------------------------------------------------------------ */
/* Cabecera superior                                                   */
/* ------------------------------------------------------------------ */

.principal {
  display: flex;
  flex-direction: column;
  min-width: 0; /* permite que las tablas internas hagan scroll */
}

.topbar {
  display: flex;
  align-items: center;
  gap: var(--espacio-lg);
  height: var(--alto-topbar);
  padding: 0 var(--espacio-lg);
  border-bottom: 0.1rem solid var(--color-borde-suave);
  background-color: var(--color-fondo);
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar__titulo {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  white-space: nowrap;
  min-width: 0;
}

.topbar__buscador {
  position: relative;
  flex: 1;
  max-width: 52rem;
}

.topbar__buscador .icono {
  position: absolute;
  left: 1.4rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-texto-tenue);
  pointer-events: none;
}

.topbar__input {
  width: 100%;
  padding: 1.1rem 1.4rem 1.1rem 4.4rem;
  font-family: inherit;
  font-size: 1.4rem;
  color: var(--color-texto);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-md);
  transition: border-color var(--transicion);
}

.topbar__input::placeholder {
  color: var(--color-texto-tenue);
}

.topbar__input:focus {
  outline: none;
  border-color: var(--color-borde-acento);
}

.topbar__acciones {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  margin-left: auto;
  flex-shrink: 0;
}

.topbar__boton {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 3.8rem;
  height: 3.8rem;
  color: var(--color-texto-medio);
  border-radius: 50%;
  transition: background-color var(--transicion), color var(--transicion);
}

.topbar__boton:hover {
  background-color: var(--color-superficie-alta);
  color: var(--color-texto);
}

.topbar__notificacion {
  position: absolute;
  top: 0.6rem;
  right: 0.8rem;
  width: 0.8rem;
  height: 0.8rem;
  border-radius: 50%;
  background-color: var(--color-critico-fuerte);
  border: 0.2rem solid var(--color-fondo);
}

.topbar__avatar {
  width: 3.8rem;
  height: 3.8rem;
  border-radius: 50%;
  background: linear-gradient(
    135deg,
    var(--color-marca-turquesa),
    var(--color-marca-violeta)
  );
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  font-weight: 700;
  color: #fff;
}

/* ------------------------------------------------------------------ */
/* Contenedor de vistas                                                */
/* ------------------------------------------------------------------ */

.vista {
  flex: 1;
  padding: var(--espacio-xl) var(--espacio-lg);
  display: flex;
  flex-direction: column;
  gap: var(--espacio-lg);
}

.vista__cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--espacio-md);
  flex-wrap: wrap;
}

.vista__titulo {
  font-size: 3.6rem;
  letter-spacing: -0.02em;
}

.vista__subtitulo {
  margin-top: var(--espacio-xs);
  font-size: 1.5rem;
  color: var(--color-texto-medio);
}

.vista__meta {
  text-align: right;
  font-size: 1.2rem;
}

.vista__meta-titulo {
  font-weight: 700;
  color: var(--color-texto-medio);
  letter-spacing: 0.04em;
}

.vista__meta-estado {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--espacio-xs);
  margin-top: var(--espacio-xs);
  font-family: var(--fuente-mono);
  color: var(--color-texto);
  letter-spacing: 0.06em;
}

.vista__meta-punto {
  width: 0.6rem;
  height: 0.6rem;
  border-radius: 50%;
  background-color: var(--color-ok);
  animation: latido 2s ease-in-out infinite;
}

@keyframes latido {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}

/* ------------------------------------------------------------------ */
/* Botón de menú (solo móvil)                                          */
/* ------------------------------------------------------------------ */

.menu-movil {
  display: none;
  align-items: center;
  justify-content: center;
  width: 4rem;
  height: 4rem;
  color: var(--color-texto);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-md);
}

.sidebar__cerrar {
  display: none;
  position: absolute;
  top: var(--espacio-md);
  right: var(--espacio-md);
  width: 3.6rem;
  height: 3.6rem;
  align-items: center;
  justify-content: center;
  color: var(--color-texto-medio);
  border-radius: 50%;
}

/* ------------------------------------------------------------------ */
/* Adaptación a pantallas menores                                      */
/* ------------------------------------------------------------------ */

@media (max-width: 1100px) {
  .vista__titulo {
    font-size: 2.8rem;
  }
}

@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 60;
    width: min(30rem, 85vw);
    transform: translateX(-100%);
    transition: transform var(--transicion);
    box-shadow: var(--sombra-panel);
  }

  .sidebar.esta-abierta {
    transform: translateX(0);
  }

  .sidebar__cerrar {
    display: flex;
  }

  .menu-movil {
    display: flex;
  }

  .topbar {
    gap: var(--espacio-md);
    padding: 0 var(--espacio-md);
  }

  .topbar__titulo {
    font-size: 1.3rem;
  }

  .vista {
    padding: var(--espacio-lg) var(--espacio-md);
  }
}

@media (max-width: 620px) {
  .topbar__buscador {
    display: none;
  }

  /* La cabecera conserva solo las notificaciones y el avatar: el resto de
     accesos permanece disponible desde el menú lateral. */
  .topbar__boton:not(:first-child) {
    display: none;
  }

  .topbar {
    gap: var(--espacio-sm);
    padding: 0 var(--espacio-sm);
  }

  .topbar__titulo {
    font-size: 1.1rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar__acciones {
    gap: var(--espacio-xs);
  }
}

/* Velo que oscurece el contenido cuando el menú móvil está abierto. */
.velo-menu {
  position: fixed;
  inset: 0;
  z-index: 50;
  background-color: rgba(0, 0, 0, 0.6);
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--transicion), visibility var(--transicion);
}

.velo-menu.esta-visible {
  opacity: 1;
  visibility: visible;
}


/* ===== src/css/componentes.css ===== */
/* =========================================================================
   LISA vigIA — Componentes reutilizables: paneles, indicadores KPI,
   semáforos de riesgo, tablas de casos, distintivos y botones.
   ========================================================================= */

/* ------------------------------------------------------------------ */
/* Panel genérico                                                      */
/* ------------------------------------------------------------------ */

.panel {
  background-color: var(--color-superficie);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  overflow: hidden;
  min-width: 0;
}

.panel__cabecera {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  padding: var(--espacio-md) var(--espacio-lg);
  border-bottom: 0.1rem solid var(--color-borde-suave);
}

.panel__titulo {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  font-size: 1.9rem;
  font-weight: 600;
}

.panel__cuerpo {
  padding: var(--espacio-lg);
}

/* ------------------------------------------------------------------ */
/* Distintivos                                                         */
/* ------------------------------------------------------------------ */

.distintivo {
  display: inline-flex;
  align-items: center;
  gap: var(--espacio-xs);
  padding: 0.6rem 1.2rem;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-radius: var(--radio-sm);
  white-space: nowrap;
}

.distintivo--critico {
  background-color: var(--color-critico-fuerte);
  color: #fff;
}

.distintivo--critico-suave {
  background-color: var(--color-critico-fondo);
  color: var(--color-critico);
  border: 0.1rem solid var(--color-critico);
}

.distintivo--neutro {
  background-color: var(--color-superficie-suave);
  color: var(--color-texto-medio);
}

.distintivo--medio {
  background-color: var(--color-medio-fondo);
  color: var(--color-medio);
  border: 0.1rem solid var(--color-medio);
}

.distintivo--ok {
  background-color: rgba(95, 201, 160, 0.12);
  color: var(--color-ok);
  border: 0.1rem solid var(--color-ok);
}

/* ------------------------------------------------------------------ */
/* Botones                                                             */
/* ------------------------------------------------------------------ */

.boton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--espacio-sm);
  padding: 1.2rem 2rem;
  font-size: 1.4rem;
  font-weight: 600;
  border-radius: var(--radio-md);
  border: 0.1rem solid transparent;
  transition: background-color var(--transicion), border-color var(--transicion),
    filter var(--transicion);
}

.boton--primario {
  background-color: var(--color-accion);
  color: #14141a;
}

.boton--primario:hover {
  filter: brightness(1.08);
}

.boton--peligro {
  background-color: var(--color-critico-fuerte);
  color: #fff;
}

.boton--peligro:hover {
  filter: brightness(1.08);
}

.boton--exito {
  background-color: rgba(95, 201, 160, 0.14);
  color: var(--color-ok);
  border-color: var(--color-ok);
}

.boton--exito:hover {
  background-color: rgba(95, 201, 160, 0.24);
}

.boton--fantasma {
  background-color: transparent;
  color: var(--color-texto-medio);
  border-color: var(--color-borde);
}

.boton--fantasma:hover {
  background-color: var(--color-superficie-alta);
  color: var(--color-texto);
}

.boton[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ------------------------------------------------------------------ */
/* Tarjetas de indicadores (KPI)                                       */
/* ------------------------------------------------------------------ */

/* Cinco indicadores en una sola línea: el monto en riesgo ocupa el doble,
   de modo que la fila se reparte en seis fracciones iguales. */
.indicadores {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--espacio-md);
  align-items: stretch;
}

@media (max-width: 1500px) {
  .indicadores {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width: 1000px) {
  .indicadores {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 620px) {
  .indicadores {
    grid-template-columns: 1fr;
  }
}

.kpi {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-sm);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
}

.kpi--alerta {
  border-color: rgba(242, 133, 127, 0.35);
}

.kpi--ancho {
  grid-column: span 2;
}

.kpi__cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--espacio-sm);
}

.kpi__titulo {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--color-texto-medio);
}

.kpi__icono {
  color: var(--color-texto-tenue);
  flex-shrink: 0;
}

.kpi__icono--alerta {
  color: var(--color-critico);
}

.kpi__valor {
  font-size: 4.2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
}

.kpi__valor--critico {
  color: var(--color-critico);
}

.kpi__valor--monto {
  font-size: 3.6rem;
  font-family: var(--fuente-mono);
}

.kpi__nota {
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.kpi__nota--alerta {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
  color: var(--color-critico);
}

/* Fila que combina porcentaje y barra de progreso. */
.kpi__medida {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
}

.kpi__porcentaje {
  font-size: 3.2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.barra {
  flex: 1;
  height: 0.6rem;
  background-color: var(--color-superficie-suave);
  border-radius: 999rem;
  overflow: hidden;
}

.barra__relleno {
  height: 100%;
  background-color: var(--color-critico);
  border-radius: 999rem;
  transition: width 600ms ease;
}

/* ------------------------------------------------------------------ */
/* Semáforo de riesgo                                                  */
/* ------------------------------------------------------------------ */

.semaforo {
  display: inline-flex;
  width: 1.8rem;
  height: 1.8rem;
  border-radius: 50%;
  border: 0.2rem solid currentColor;
}

.semaforo--alto {
  color: var(--color-critico);
  background-color: var(--color-critico-fondo);
}

.semaforo--medio {
  color: var(--color-medio);
  background-color: var(--color-medio-fondo);
}

.semaforo--bajo {
  color: var(--color-bajo);
  background-color: var(--color-bajo-fondo);
}

/* Versión grande usada en las cabeceras de sección del reporte. */
.semaforo--grande {
  width: 1.2rem;
  height: 1.2rem;
  border-width: 0;
  background-color: currentColor;
  box-shadow: 0 0 0.8rem currentColor;
}

/* ------------------------------------------------------------------ */
/* Tablas de casos                                                     */
/* ------------------------------------------------------------------ */

/* El scroll queda contenido aquí: min-width:0 impide que el ancho mínimo
   de la tabla empuje al panel y provoque scroll horizontal en la página. */
.tabla-envoltura {
  overflow-x: auto;
  min-width: 0;
  max-width: 100%;
}

.tabla-casos {
  min-width: 52rem;
}

/* La variante compacta cabe en la columna estrecha de casos leves. */
.tabla-casos--compacta {
  min-width: 34rem;
}

.tabla-casos--compacta thead th,
.tabla-casos--compacta td {
  padding-left: var(--espacio-md);
  padding-right: var(--espacio-md);
}

.tabla-casos thead th {
  padding: 1.2rem var(--espacio-lg);
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--color-texto-medio);
  text-align: left;
  background-color: var(--color-superficie-alta);
  border-bottom: 0.1rem solid var(--color-borde-suave);
  white-space: nowrap;
}

.tabla-casos th.col-centro,
.tabla-casos td.col-centro {
  text-align: center;
}

.tabla-casos th.col-derecha,
.tabla-casos td.col-derecha {
  text-align: right;
}

.tabla-casos tbody tr {
  border-bottom: 0.1rem solid var(--color-borde-suave);
  cursor: pointer;
  transition: background-color var(--transicion);
}

.tabla-casos tbody tr:hover,
.tabla-casos tbody tr:focus-visible {
  background-color: var(--color-superficie-alta);
}

.tabla-casos tbody tr.esta-destacada {
  background-color: rgba(242, 133, 127, 0.07);
}

.tabla-casos tbody tr.esta-destacada:hover {
  background-color: rgba(242, 133, 127, 0.12);
}

.tabla-casos td {
  padding: 1.4rem var(--espacio-lg);
  vertical-align: middle;
}

.celda-beneficiario__nombre {
  font-family: var(--fuente-mono);
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--color-texto);
}

.celda-beneficiario__rut {
  font-family: var(--fuente-mono);
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
  margin-top: 0.2rem;
}

.puntaje {
  font-family: var(--fuente-mono);
  font-size: 1.5rem;
  font-weight: 700;
}

.puntaje--alto {
  color: var(--color-critico);
}

.puntaje--medio {
  color: var(--color-medio);
}

.puntaje--bajo {
  color: var(--color-texto-medio);
}

/* Recuadro que enmarca el puntaje del caso más grave. */
.puntaje--marcado {
  display: inline-block;
  padding: 0.4rem 1rem;
  border: 0.1rem solid var(--color-critico-fuerte);
  border-radius: var(--radio-sm);
  background-color: var(--color-critico-fondo);
}

/* Cuadrícula que reparte las dos listas de casos del panel inicial.
   minmax(0,·) evita que el contenido ancho estire las columnas. */
.listados {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: var(--espacio-md);
  align-items: start;
}

@media (max-width: 1250px) {
  .listados {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 620px) {
  .kpi--ancho {
    grid-column: span 1;
  }
}

/* ------------------------------------------------------------------ */
/* Modales                                                             */
/* ------------------------------------------------------------------ */

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--espacio-md);
  background-color: rgba(4, 4, 6, 0.72);
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--transicion), visibility var(--transicion);
}

.modal.esta-visible {
  opacity: 1;
  visibility: visible;
}

.modal__caja {
  width: min(56rem, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background-color: var(--color-superficie);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-lg);
  box-shadow: var(--sombra-panel);
  transform: translateY(1.2rem);
  transition: transform var(--transicion);
}

.modal.esta-visible .modal__caja {
  transform: translateY(0);
}

.modal__cabecera {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  padding: var(--espacio-lg);
  border-bottom: 0.1rem solid var(--color-borde-suave);
}

.modal__titulo {
  font-size: 1.9rem;
}

.modal__cerrar {
  margin-left: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 3.4rem;
  height: 3.4rem;
  color: var(--color-texto-medio);
  border-radius: 50%;
}

.modal__cerrar:hover {
  background-color: var(--color-superficie-alta);
  color: var(--color-texto);
}

.modal__cuerpo {
  padding: var(--espacio-lg);
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
  font-size: 1.4rem;
  color: var(--color-texto-medio);
}

.modal__pie {
  display: flex;
  justify-content: flex-end;
  gap: var(--espacio-sm);
  padding: var(--espacio-lg);
  border-top: 0.1rem solid var(--color-borde-suave);
  flex-wrap: wrap;
}

/* Campos de formulario dentro de modales. */
.campo {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-xs);
}

.campo__control {
  width: 100%;
  padding: 1.1rem 1.4rem;
  font-family: inherit;
  font-size: 1.4rem;
  color: var(--color-texto);
  background-color: var(--color-fondo);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-md);
  resize: vertical;
}

.campo__control:focus {
  outline: none;
  border-color: var(--color-borde-acento);
}

.campo__error {
  font-size: 1.2rem;
  color: var(--color-critico);
  min-height: 1.6rem;
}

/* Resumen de adjuntos dentro del modal de correo. */
.adjunto {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  padding: 1.2rem;
  background-color: var(--color-fondo);
  border: 0.1rem dashed var(--color-borde);
  border-radius: var(--radio-md);
  font-family: var(--fuente-mono);
  font-size: 1.3rem;
  color: var(--color-texto);
}

/* ------------------------------------------------------------------ */
/* Avisos flotantes (sustituyen a alert)                               */
/* ------------------------------------------------------------------ */

.avisos {
  position: fixed;
  right: var(--espacio-lg);
  bottom: var(--espacio-lg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: var(--espacio-sm);
  max-width: min(38rem, calc(100vw - 3.2rem));
}

.aviso {
  display: flex;
  align-items: flex-start;
  gap: var(--espacio-sm);
  padding: var(--espacio-md);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde);
  border-left: 0.3rem solid var(--color-accion);
  border-radius: var(--radio-md);
  box-shadow: var(--sombra-panel);
  font-size: 1.3rem;
  animation: aviso-entra 200ms ease;
}

.aviso--exito {
  border-left-color: var(--color-ok);
}

.aviso--exito .aviso__icono {
  color: var(--color-ok);
}

.aviso--alerta {
  border-left-color: var(--color-critico);
}

.aviso--alerta .aviso__icono {
  color: var(--color-critico);
}

.aviso__icono {
  flex-shrink: 0;
  color: var(--color-accion);
  margin-top: 0.1rem;
}

.aviso__titulo {
  font-weight: 700;
  color: var(--color-texto);
}

.aviso__texto {
  color: var(--color-texto-medio);
  margin-top: 0.2rem;
}

@keyframes aviso-entra {
  from {
    opacity: 0;
    transform: translateY(1rem);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Estado vacío para listados sin resultados. */
.estado-vacio {
  padding: var(--espacio-xl);
  text-align: center;
  color: var(--color-texto-tenue);
  font-size: 1.4rem;
}


/* ===== src/css/reporte.css ===== */
/* =========================================================================
   LISA vigIA — Vista de reporte de caso: ficha del siniestro, secciones
   de evidencia, visor del documento y gráficos de patrones.
   ========================================================================= */

/* ------------------------------------------------------------------ */
/* Ficha superior del caso                                             */
/* ------------------------------------------------------------------ */

.ficha {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--espacio-lg);
  padding: var(--espacio-lg) var(--espacio-lg) var(--espacio-lg) var(--espacio-xl);
  background-color: var(--color-panel-datos);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-lg);
  overflow: hidden;
}

/* Franja lateral cuyo color refleja la criticidad del caso. */
.ficha::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 0.5rem;
  height: 100%;
  background-color: var(--color-critico);
}

.ficha--leve::before {
  background-color: var(--color-bajo);
}

.ficha__identidad {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
  flex-wrap: wrap;
}

.ficha__nombre {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  font-size: 3.2rem;
  letter-spacing: -0.02em;
}

.ficha__rut {
  padding: 0.6rem 1.2rem;
  font-family: var(--fuente-mono);
  font-size: 1.4rem;
  background-color: rgba(255, 255, 255, 0.06);
  border-radius: var(--radio-sm);
}

.ficha__siniestro {
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.ficha__siniestro strong {
  font-family: var(--fuente-mono);
  color: var(--color-texto);
  letter-spacing: 0.04em;
}

/* Cuadrícula de datos del siniestro. */
.ficha__datos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
  gap: var(--espacio-md);
  margin-top: var(--espacio-lg);
}

.ficha__dato-valor {
  margin-top: 0.4rem;
  font-size: 1.6rem;
  color: var(--color-texto);
}

.ficha__dato-valor--monto {
  font-family: var(--fuente-mono);
  font-size: 2.2rem;
  font-weight: 700;
}

.ficha__dato-secundario {
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
  margin-top: 0.2rem;
}

/* Sello circular de probabilidad de fraude. */
.sello {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--espacio-sm);
  align-self: start;
  min-width: 22rem;
  padding: var(--espacio-lg);
  border: 0.1rem solid var(--color-critico);
  border-radius: var(--radio-md);
  background-color: var(--color-critico-fondo);
  text-align: center;
}

.sello--leve {
  border-color: var(--color-bajo);
  background-color: var(--color-bajo-fondo);
}

.sello__circulo {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 7rem;
  height: 7rem;
  border-radius: 50%;
  background-color: var(--color-critico);
  color: #2a0d0d;
  font-family: var(--fuente-mono);
  font-size: 2rem;
  font-weight: 700;
  box-shadow: 0 0 2.4rem rgba(242, 133, 127, 0.4);
}

.sello--leve .sello__circulo {
  background-color: var(--color-bajo);
  color: #0b1a26;
  box-shadow: 0 0 2.4rem rgba(110, 168, 216, 0.35);
}

.sello__texto {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-critico);
}

.sello--leve .sello__texto {
  color: var(--color-bajo);
}

.sello__escala {
  font-size: 1.1rem;
  color: var(--color-texto-medio);
}

/* ------------------------------------------------------------------ */
/* Secciones de evidencia                                              */
/* ------------------------------------------------------------------ */

.seccion__cabecera {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  padding: var(--espacio-md) var(--espacio-lg);
  border-bottom: 0.1rem solid var(--color-borde-suave);
  background-color: var(--color-superficie-alta);
}

.seccion__titulo {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  font-size: 1.9rem;
}

.seccion__distintivo {
  margin-left: auto;
}

/* Documento a la izquierda, hallazgos a la derecha. */
.seccion__doble {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}

.seccion__columna {
  padding: var(--espacio-lg);
  min-width: 0;
}

.seccion__columna + .seccion__columna {
  border-left: 0.1rem solid var(--color-borde-suave);
}

@media (max-width: 1000px) {
  .seccion__doble {
    grid-template-columns: minmax(0, 1fr);
  }

  .seccion__columna + .seccion__columna {
    border-left: none;
    border-top: 0.1rem solid var(--color-borde-suave);
  }

  .ficha {
    grid-template-columns: minmax(0, 1fr);
  }

  .sello {
    min-width: 0;
  }
}

@media (max-width: 620px) {
  /* Las acciones de cierre pasan a ocupar el ancho completo, en columna. */
  .decision__acciones {
    width: 100%;
    flex-direction: column;
  }

  .decision__acciones .boton {
    width: 100%;
  }

  .ficha {
    padding: var(--espacio-md) var(--espacio-md) var(--espacio-md) var(--espacio-lg);
  }

  .ficha__nombre {
    font-size: 2.4rem;
  }

  .ficha__identidad {
    gap: var(--espacio-sm);
  }

  .seccion__columna {
    padding: var(--espacio-md);
  }

  .seccion__cabecera {
    flex-wrap: wrap;
    padding: var(--espacio-md);
  }

  .seccion__distintivo {
    margin-left: 0;
  }
}

/* ------------------------------------------------------------------ */
/* Visor del documento con marcas de anomalía                          */
/* ------------------------------------------------------------------ */

.documento {
  position: relative;
  background-color: #ffffff;
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-md);
  overflow: hidden;
  line-height: 0;
}

.documento__imagen {
  width: 100%;
  height: auto;
  display: block;
}

/* Capa transparente que aloja las marcas sobre la imagen. */
.documento__capa {
  position: absolute;
  inset: 0;
}

.documento__marca {
  position: absolute;
  border: 0.2rem solid var(--color-critico-fuerte);
  border-radius: 0.3rem;
  cursor: help;
  padding: 0;
  transition: box-shadow var(--transicion), transform var(--transicion);
  animation: marca-late 2.8s ease-in-out infinite;
}

.documento__marca:hover,
.documento__marca:focus-visible {
  animation: none;
  transform: scale(1.03);
  box-shadow: 0 0 0 0.3rem rgba(229, 72, 77, 0.25);
  z-index: 2;
}

.documento__marca--metadato:hover,
.documento__marca--metadato:focus-visible {
  box-shadow: 0 0 0 0.3rem rgba(124, 108, 224, 0.25);
}

@keyframes marca-late {
  0%,
  100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.35);
  }
}

/* Rótulo flotante sobre cada zona marcada. */
.documento__etiqueta {
  position: absolute;
  top: -1.9rem;
  left: -0.2rem;
  padding: 0.2rem 0.6rem;
  font-size: 1rem;
  font-weight: 700;
  font-family: var(--fuente-mono);
  line-height: 1.5;
  color: #fff;
  border-radius: 0.3rem;
  white-space: nowrap;
}

/* La etiqueta de la primera marca cae hacia dentro para no salirse. */
.documento__marca:first-child .documento__etiqueta {
  top: auto;
  bottom: -1.9rem;
}

.documento__pie {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
  margin-top: var(--espacio-sm);
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
  flex-wrap: wrap;
  line-height: 1.5;
}

.documento__origen {
  margin-left: auto;
  font-family: var(--fuente-mono);
}

/* Texto que describe la marca activa. */
.documento__detalle {
  margin-top: var(--espacio-sm);
  padding: 1.2rem;
  min-height: 6.4rem;
  font-size: 1.25rem;
  color: var(--color-texto-tenue);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
  transition: color var(--transicion), border-color var(--transicion);
}

.documento__detalle.esta-activo {
  color: var(--color-texto);
  border-color: rgba(242, 133, 127, 0.4);
}

.documento__leyenda {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
}

.documento__muestra {
  width: 1.2rem;
  height: 0.8rem;
  border-radius: 0.2rem;
  border: 0.1rem solid var(--color-critico);
  background-color: var(--color-critico-fondo);
}

.documento__muestra--meta {
  border-color: #7c6ce0;
  background-color: rgba(124, 108, 224, 0.18);
}

/* ------------------------------------------------------------------ */
/* Hallazgos                                                           */
/* ------------------------------------------------------------------ */

.hallazgos {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
}

.hallazgos__grupo-titulo {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--color-texto);
  margin-bottom: var(--espacio-sm);
}

.hallazgo {
  display: flex;
  align-items: flex-start;
  gap: 1.2rem;
  padding: 1.4rem;
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
  font-size: 1.35rem;
  color: var(--color-texto-medio);
}

.hallazgo + .hallazgo {
  margin-top: var(--espacio-sm);
}

.hallazgo--critico {
  border-color: rgba(242, 133, 127, 0.3);
}

.hallazgo__icono {
  flex-shrink: 0;
  color: var(--color-critico);
  margin-top: 0.2rem;
}

.hallazgo__icono--medio {
  color: var(--color-medio);
}

.hallazgo__icono--ok {
  color: var(--color-ok);
}

.hallazgo__titulo {
  font-weight: 700;
  color: var(--color-texto);
  margin-bottom: 0.2rem;
}

.hallazgo strong {
  color: var(--color-texto);
}

/* Bloque de metadatos con aspecto de consola. */
.metadatos {
  padding: 1.6rem;
  background-color: var(--color-fondo);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
  font-family: var(--fuente-mono);
  font-size: 1.3rem;
  line-height: 1.9;
  /* Las rutas y marcas de tiempo largas se parten en vez de desbordar. */
  overflow-wrap: anywhere;
}

.metadatos__linea {
  color: var(--color-texto-medio);
}

.metadatos__clave {
  color: var(--color-texto-tenue);
}

.metadatos__separador {
  height: 0.1rem;
  background-color: var(--color-borde-suave);
  margin: var(--espacio-sm) 0;
}

.metadatos__alerta {
  color: var(--color-critico);
}

/* ------------------------------------------------------------------ */
/* Gráficos                                                            */
/* ------------------------------------------------------------------ */

.grafico {
  position: relative;
  margin-top: var(--espacio-md);
  background-color: var(--color-fondo);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
  padding: var(--espacio-md);
  min-width: 0;
  overflow: hidden;
}

.grafico__lienzo {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}

/* En pantallas estrechas el lienzo conserva un ancho mínimo legible y el
   desplazamiento se resuelve dentro del propio gráfico. */
@media (max-width: 760px) {
  .grafico {
    overflow-x: auto;
  }

  .grafico__lienzo {
    min-width: 60rem;
  }
}

.grafico__titulo {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--color-texto);
  margin-bottom: var(--espacio-xs);
}

.grafico__ayuda {
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
  margin-bottom: var(--espacio-md);
}

.grafico__leyenda {
  display: flex;
  flex-wrap: wrap;
  gap: var(--espacio-md);
  margin-top: var(--espacio-md);
  font-size: 1.2rem;
  color: var(--color-texto-medio);
}

.grafico__leyenda-item {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
}

.grafico__muestra {
  width: 1rem;
  height: 1rem;
  border-radius: 50%;
}

/* Elementos interactivos dentro de los SVG. */
.punto-dato {
  cursor: pointer;
  transition: r 120ms ease, opacity 120ms ease;
}

.punto-dato:hover {
  opacity: 0.85;
}

.nodo-red {
  cursor: pointer;
}

.nodo-red:hover .nodo-red__circulo {
  stroke-width: 3;
}

/* Globo informativo compartido por ambos gráficos. */
.tooltip {
  position: absolute;
  z-index: 20;
  min-width: 22rem;
  padding: 1.2rem;
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-acento);
  border-radius: var(--radio-md);
  box-shadow: var(--sombra-panel);
  font-size: 1.2rem;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 120ms ease, visibility 120ms ease;
}

.tooltip.esta-visible {
  opacity: 1;
  visibility: visible;
}

.tooltip__titulo {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--color-texto);
  margin-bottom: var(--espacio-xs);
  padding-bottom: var(--espacio-xs);
  border-bottom: 0.1rem solid var(--color-borde-suave);
}

.tooltip__fila {
  display: flex;
  justify-content: space-between;
  gap: var(--espacio-md);
  line-height: 1.8;
}

.tooltip__clave {
  color: var(--color-texto-tenue);
}

.tooltip__valor {
  font-family: var(--fuente-mono);
  color: var(--color-texto);
  text-align: right;
}

/* ------------------------------------------------------------------ */
/* Casos relacionados                                                  */
/* ------------------------------------------------------------------ */

.relacionados {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-sm);
  margin-top: var(--espacio-md);
}

.relacionado {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
  width: 100%;
  padding: 1.2rem 1.6rem;
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
  text-align: left;
  transition: border-color var(--transicion), background-color var(--transicion);
}

.relacionado:hover {
  border-color: var(--color-borde-acento);
  background-color: var(--color-superficie-suave);
}

.relacionado__datos {
  flex: 1;
  min-width: 0;
}

/* El nombre ocupa su propia línea para no pegarse al RUT que le sigue. */
.relacionado__nombre {
  display: block;
  font-family: var(--fuente-mono);
  font-size: 1.35rem;
  font-weight: 600;
  color: var(--color-texto);
}

.relacionado__meta {
  display: block;
}

.relacionado__meta {
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
  margin-top: 0.2rem;
}

.relacionado__monto {
  font-family: var(--fuente-mono);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--color-critico);
  white-space: nowrap;
}

/* ------------------------------------------------------------------ */
/* Barra de decisión del analista                                      */
/* ------------------------------------------------------------------ */

.decision {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  flex-wrap: wrap;
}

.decision__texto {
  flex: 1;
  min-width: min(24rem, 100%);
}

.decision__titulo {
  font-size: 1.6rem;
  font-weight: 600;
  color: var(--color-texto);
}

.decision__ayuda {
  font-size: 1.3rem;
  color: var(--color-texto-medio);
  margin-top: 0.2rem;
}

.decision__acciones {
  display: flex;
  gap: var(--espacio-sm);
  flex-wrap: wrap;
}

/* Resultado mostrado una vez tomada la decisión. */
.resuelto {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  padding: var(--espacio-md);
  border-radius: var(--radio-md);
  font-size: 1.4rem;
}

.resuelto--fraude {
  background-color: var(--color-critico-fondo);
  border: 0.1rem solid var(--color-critico);
  color: var(--color-critico);
}

.resuelto--liquidacion {
  background-color: rgba(95, 201, 160, 0.1);
  border: 0.1rem solid var(--color-ok);
  color: var(--color-ok);
}

/* Enlace de regreso al panel. */
.volver {
  display: inline-flex;
  align-items: center;
  gap: var(--espacio-xs);
  font-size: 1.3rem;
  color: var(--color-texto-medio);
  transition: color var(--transicion);
}

.volver:hover {
  color: var(--color-texto);
}


/* ===== src/css/secciones.css ===== */
/* =========================================================================
   LISA vigIA — Estilos de las secciones de análisis: fichas de prestador,
   verificadores forenses y patrones de fraude archivados.
   ========================================================================= */

/* ------------------------------------------------------------------ */
/* Utilidades compartidas                                              */
/* ------------------------------------------------------------------ */

.texto-tenue {
  color: var(--color-texto-tenue);
  font-size: 1.3rem;
}

/* Etiqueta que resume un hallazgo del peritaje. */
.marca-hallazgo {
  display: inline-block;
  padding: 0.3rem 0.8rem;
  font-size: 1.1rem;
  font-family: var(--fuente-mono);
  color: var(--color-texto-medio);
  background-color: var(--color-superficie-suave);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-sm);
  white-space: nowrap;
}

.marcas-hallazgo {
  display: flex;
  flex-wrap: wrap;
  gap: var(--espacio-xs);
}

/* ------------------------------------------------------------------ */
/* Fichas de prestador (Análisis de red)                               */
/* ------------------------------------------------------------------ */

.prestadores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(38rem, 1fr));
  gap: var(--espacio-md);
  align-items: start;
}

.prestador {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  min-width: 0;
}

.prestador--critico {
  border-color: rgba(242, 133, 127, 0.35);
  background-color: rgba(242, 133, 127, 0.04);
}

.prestador__cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--espacio-md);
  flex-wrap: wrap;
}

.prestador__nombre {
  font-size: 1.8rem;
  font-weight: 600;
}

.prestador__meta {
  margin-top: 0.2rem;
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
}

.prestador__metricas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: var(--espacio-md);
  padding: var(--espacio-md) 0;
  border-top: 0.1rem solid var(--color-borde-suave);
  border-bottom: 0.1rem solid var(--color-borde-suave);
}

.prestador__metrica {
  margin-top: 0.4rem;
  font-family: var(--fuente-mono);
  font-size: 1.7rem;
  font-weight: 700;
  color: var(--color-texto);
}

.prestador__nota {
  font-size: 1.35rem;
  color: var(--color-texto-medio);
}

/* ------------------------------------------------------------------ */
/* Verificadores (Herramientas forenses)                               */
/* ------------------------------------------------------------------ */

.verificadores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(28rem, 1fr));
  gap: var(--espacio-md);
}

.verificador {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  min-width: 0;
}

.verificador__cabecera {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
}

.verificador__icono {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 4.4rem;
  height: 4.4rem;
  flex-shrink: 0;
  color: var(--color-accion);
  background-color: rgba(195, 203, 240, 0.1);
  border-radius: var(--radio-md);
}

.verificador__nombre {
  font-size: 1.6rem;
  font-weight: 600;
}

.verificador__estado {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
  margin-top: 0.2rem;
  font-size: 1.2rem;
  color: var(--color-ok);
}

.verificador__punto {
  width: 0.6rem;
  height: 0.6rem;
  border-radius: 50%;
  background-color: var(--color-ok);
  animation: latido 2s ease-in-out infinite;
}

.verificador__descripcion {
  flex: 1;
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.verificador__pie {
  display: flex;
  gap: var(--espacio-xl);
  padding-top: var(--espacio-md);
  border-top: 0.1rem solid var(--color-borde-suave);
}

.verificador__cifra {
  margin-top: 0.4rem;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--color-texto);
}

/* ------------------------------------------------------------------ */
/* Patrones aprendidos (Inteligencia archivada)                        */
/* ------------------------------------------------------------------ */

.patrones {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(32rem, 1fr));
  gap: var(--espacio-md);
}

.patron {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-sm);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  min-width: 0;
}

.patron__cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--espacio-sm);
  flex-wrap: wrap;
}

.patron__nombre {
  font-size: 1.6rem;
  font-weight: 600;
}

.patron__tendencia {
  display: inline-flex;
  align-items: center;
  gap: var(--espacio-xs);
  font-size: 1.15rem;
  font-family: var(--fuente-mono);
}

.patron__tendencia--sube {
  color: var(--color-critico);
}

.patron__tendencia--baja {
  color: var(--color-ok);
}

/* La flecha apunta hacia abajo cuando la tendencia decrece. */
.patron__tendencia--baja .icono {
  transform: scaleY(-1);
}

.patron__descripcion {
  flex: 1;
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.patron__medida {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--espacio-md);
  padding-top: var(--espacio-md);
  border-top: 0.1rem solid var(--color-borde-suave);
  flex-wrap: wrap;
}

.patron__cifra .puntaje {
  font-size: 2.4rem;
}

.patron__peso {
  flex: 1;
  min-width: 16rem;
}

.patron__porcentaje {
  font-family: var(--fuente-mono);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--color-texto);
}

/* Texto introductorio de un panel. */
.panel__intro {
  max-width: 78ch;
  margin-bottom: var(--espacio-lg);
  font-size: 1.35rem;
  color: var(--color-texto-medio);
}

/* ------------------------------------------------------------------ */
/* Titular de la evolución del modelo                                  */
/* ------------------------------------------------------------------ */

.titular {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: var(--espacio-xl);
  align-items: center;
  padding: var(--espacio-xl);
  background:
    radial-gradient(
      120% 140% at 0% 0%,
      rgba(95, 201, 160, 0.12),
      transparent 60%
    ),
    var(--color-superficie);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
}

.titular__frase {
  margin-top: var(--espacio-md);
  font-size: 3rem;
  line-height: 1.25;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.titular__frase strong {
  color: var(--color-ok);
}

.titular__nota {
  max-width: 60ch;
  margin-top: var(--espacio-md);
  font-size: 1.4rem;
  color: var(--color-texto-medio);
}

.titular__cifras {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--espacio-md);
}

.titular__cifra {
  padding: var(--espacio-md);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
}

.titular__valor {
  margin-top: 0.4rem;
  font-family: var(--fuente-mono);
  font-size: 2.8rem;
  font-weight: 700;
  line-height: 1;
  color: var(--color-texto);
}

.titular__variacion {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
  margin-top: var(--espacio-xs);
  font-size: 1.15rem;
}

.titular__variacion--buena {
  color: var(--color-ok);
}

.titular__variacion--mala {
  color: var(--color-critico);
}

/* La flecha se invierte cuando la métrica desciende. */
.titular__variacion--buena .icono {
  transform: scaleY(-1);
}

/* ------------------------------------------------------------------ */
/* Línea de tiempo de hitos                                            */
/* ------------------------------------------------------------------ */

.hitos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
  gap: var(--espacio-lg);
  counter-reset: hito;
}

.hito {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--espacio-sm);
  padding-top: var(--espacio-lg);
}

/* Riel horizontal que une los hitos consecutivos. */
.hito::before {
  content: "";
  position: absolute;
  top: 1.4rem;
  left: 0;
  width: 100%;
  height: 0.2rem;
  background-color: var(--color-borde);
}

.hito:last-child::before {
  width: 1.4rem;
}

.hito__marca {
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.8rem;
  height: 2.8rem;
  font-family: var(--fuente-mono);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--color-fondo);
  background-color: var(--color-accion);
  border: 0.3rem solid var(--color-superficie);
  border-radius: 50%;
}

/* El último hito marca el estado actual del modelo. */
.hito:last-child .hito__marca {
  background-color: var(--color-ok);
}

.hito__mes {
  font-size: 1.15rem;
  font-family: var(--fuente-mono);
  color: var(--color-texto-tenue);
}

.hito__titulo {
  font-size: 1.5rem;
  font-weight: 600;
}

.hito__descripcion {
  flex: 1;
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.hito__precision strong {
  font-family: var(--fuente-mono);
  font-size: 1.4rem;
  color: var(--color-ok);
}

/* ------------------------------------------------------------------ */
/* Casos recuperados                                                   */
/* ------------------------------------------------------------------ */

.recuperados {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(26rem, 1fr));
  gap: var(--espacio-md);
}

.recuperado {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  min-width: 0;
}

.recuperado__nombre {
  font-family: var(--fuente-mono);
  font-size: 1.45rem;
  font-weight: 600;
}

.recuperado__meta {
  margin-top: 0.2rem;
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
}

.recuperado__salto {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--espacio-md);
  padding: var(--espacio-md);
  background-color: var(--color-fondo);
  border-radius: var(--radio-md);
}

.recuperado__salto .puntaje {
  font-size: 2.6rem;
}

/* El puntaje original se muestra tachado: ya no es el vigente. */
.recuperado__antes {
  text-decoration: line-through;
  opacity: 0.6;
}

.recuperado__flecha {
  color: var(--color-texto-tenue);
}

.recuperado__pie {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--espacio-sm);
  flex-wrap: wrap;
}

.recuperado__monto {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--color-critico);
}

/* ------------------------------------------------------------------ */
/* Reincidentes                                                        */
/* ------------------------------------------------------------------ */

.reincidentes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(30rem, 1fr));
  gap: var(--espacio-md);
}

.reincidente {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
  padding: var(--espacio-lg);
  background-color: rgba(242, 133, 127, 0.05);
  border: 0.1rem solid rgba(242, 133, 127, 0.28);
  border-radius: var(--radio-lg);
  min-width: 0;
}

.reincidente__cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--espacio-sm);
  flex-wrap: wrap;
}

.reincidente__nombre {
  font-size: 1.6rem;
  font-weight: 600;
}

.reincidente__meta {
  margin-top: 0.2rem;
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
}

/* Dos lados enfrentados: lo confirmado frente a lo que sigue abierto. */
.reincidente__balance {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--espacio-md);
  padding: var(--espacio-md) 0;
  border-top: 0.1rem solid var(--color-borde-suave);
  border-bottom: 0.1rem solid var(--color-borde-suave);
}

.reincidente__lado + .reincidente__lado {
  padding-left: var(--espacio-md);
  border-left: 0.1rem solid var(--color-borde-suave);
}

.reincidente__cifra {
  margin-top: 0.4rem;
  font-family: var(--fuente-mono);
  font-size: 3rem;
  font-weight: 700;
  line-height: 1;
}

.reincidente__cifra--historica {
  color: var(--color-texto-medio);
}

.reincidente__cifra--activa {
  color: var(--color-critico);
}

.reincidente__monto {
  margin-top: 0.2rem;
  font-family: var(--fuente-mono);
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
}

.reincidente__nota {
  flex: 1;
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.reincidente__accion {
  align-self: flex-start;
}

/* ------------------------------------------------------------------ */
/* Señales anticipadas                                                 */
/* ------------------------------------------------------------------ */

.senales {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(28rem, 1fr));
  gap: var(--espacio-md);
}

.senal {
  padding: var(--espacio-lg);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-left: 0.3rem solid var(--color-medio);
  border-radius: var(--radio-md);
  min-width: 0;
}

.senal--alto {
  border-left-color: var(--color-critico);
}

.senal--alto .senal__icono {
  color: var(--color-critico);
}

.senal__cabecera {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  margin-bottom: var(--espacio-sm);
}

.senal__icono {
  flex-shrink: 0;
  color: var(--color-medio);
}

.senal__titulo {
  flex: 1;
  font-size: 1.45rem;
  font-weight: 600;
}

.senal__variacion {
  font-family: var(--fuente-mono);
  font-size: 1.3rem;
  font-weight: 700;
}

.senal__detalle {
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

/* ------------------------------------------------------------------ */
/* Adaptación a pantallas menores                                      */
/* ------------------------------------------------------------------ */

@media (max-width: 1100px) {
  .titular {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--espacio-lg);
  }

  .titular__frase {
    font-size: 2.4rem;
  }
}

@media (max-width: 620px) {
  .prestadores,
  .verificadores,
  .patrones,
  .recuperados,
  .reincidentes,
  .senales,
  .hitos {
    grid-template-columns: minmax(0, 1fr);
  }

  .prestador,
  .verificador,
  .patron,
  .recuperado,
  .reincidente,
  .senal {
    padding: var(--espacio-md);
  }

  .verificador__pie {
    gap: var(--espacio-lg);
  }

  .titular {
    padding: var(--espacio-lg);
  }

  .titular__cifras {
    grid-template-columns: minmax(0, 1fr);
  }

  /* En una sola columna el riel de los hitos pasa a ser vertical. */
  .hito::before {
    top: 2.8rem;
    left: 1.3rem;
    width: 0.2rem;
    height: calc(100% - 2.8rem);
  }

  .hito:last-child::before {
    height: 0;
  }

  .hito {
    padding-top: 0;
    padding-left: 4.4rem;
    min-height: 2.8rem;
  }
}


/* ===== src/css/impresion.css ===== */
/* =========================================================================
   LISA vigIA — Hoja de impresión. Convierte el reporte en pantalla en un
   documento apto para "Guardar como PDF" desde el diálogo del navegador:
   fondo claro, sin navegación y sin cortes a mitad de sección.
   ========================================================================= */

@media print {
  @page {
    size: A4;
    margin: 14mm;
  }

  :root {
    --color-fondo: #ffffff;
    --color-superficie: #ffffff;
    --color-superficie-alta: #f5f5f7;
    --color-superficie-suave: #eeeef2;
    --color-panel-datos: #f5f7fa;
    --color-borde: #c8c8d0;
    --color-borde-suave: #dcdce2;
    --color-borde-acento: #a8a8b4;
    --color-texto: #101014;
    --color-texto-medio: #3c3c46;
    --color-texto-tenue: #62626e;
    --color-critico: #c0272d;
    --color-critico-fuerte: #c0272d;
    --color-critico-fondo: #fdeaea;
    --color-medio: #8a6100;
    --color-medio-fondo: #fdf3e0;
    --color-bajo: #1f5f8f;
    --color-bajo-fondo: #e8f1f8;
    --color-ok: #1c6b4e;
  }

  body {
    background-color: #fff;
    color: #101014;
    font-size: 1.15rem;
  }

  /* Fuerza el pintado de fondos y bordes de color en la impresión. */
  * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Cromo de la aplicación que no pertenece al documento impreso. */
  .sidebar,
  .topbar,
  .menu-movil,
  .velo-menu,
  .avisos,
  .modal,
  .decision,
  .volver,
  .grafico__ayuda,
  .no-imprimir {
    display: none !important;
  }

  .app {
    display: block;
  }

  .vista {
    padding: 0;
    gap: 1.6rem;
  }

  /* Encabezado propio del documento impreso. */
  .encabezado-impresion {
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    gap: 1.6rem;
    padding-bottom: 1.2rem;
    margin-bottom: 1.6rem;
    border-bottom: 0.2rem solid #101014;
  }

  .encabezado-impresion__marca {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 1.8rem;
    font-weight: 700;
  }

  .encabezado-impresion__logo {
    width: 3.2rem;
    height: 3.2rem;
    object-fit: contain;
  }

  .encabezado-impresion__meta {
    text-align: right;
    font-size: 1.1rem;
    color: #3c3c46;
    font-family: var(--fuente-mono);
  }

  /* Evita que una sección quede partida entre dos páginas. */
  .panel,
  .ficha,
  .grafico,
  .hallazgo,
  .relacionado {
    break-inside: avoid;
    page-break-inside: avoid;
    box-shadow: none;
  }

  .panel + .panel {
    margin-top: 1.6rem;
  }

  .seccion__doble {
    grid-template-columns: 1fr 1fr;
  }

  .ficha {
    grid-template-columns: 1fr auto;
  }

  /* Los listados del panel inicial se imprimen apilados. */
  .listados {
    grid-template-columns: 1fr;
  }

  .tabla-envoltura {
    overflow: visible;
  }

  .tabla-casos {
    min-width: 0;
  }

  /* Los gráficos conservan tamaño legible en papel. */
  .grafico__lienzo {
    max-height: 24rem;
  }

  .tooltip {
    display: none !important;
  }

  a {
    text-decoration: none;
  }
}

/* Fuera de impresión el encabezado del documento permanece oculto. */
.encabezado-impresion {
  display: none;
}

/* Toda imagen creada con una ruta conocida recibe su versión incrustada. */
const crearElementoOriginal = document.createElement.bind(document);
document.createElement = (etiqueta, opciones) => {
  const elemento = crearElementoOriginal(etiqueta, opciones);

  if (etiqueta.toLowerCase() === "img") {
    const asignarSrc = Object.getOwnPropertyDescriptor(
      HTMLImageElement.prototype,
      "src"
    );

    Object.defineProperty(elemento, "src", {
      get() {
        return asignarSrc.get.call(this);
      },
      set(valor) {
        asignarSrc.set.call(this, RECURSOS[valor] ?? valor);
      },
      configurable: true,
    });
  }

  return elemento;
};

/* setAttribute("src", …) sigue la misma sustitución. */
const ponerAtributoOriginal = Element.prototype.setAttribute;
Element.prototype.setAttribute = function (nombre, valor) {
  if (nombre === "src" && RECURSOS[valor]) {
    return ponerAtributoOriginal.call(this, nombre, RECURSOS[valor]);
  }
  return ponerAtributoOriginal.call(this, nombre, valor);
};

/* =========================================================================
   LISA vigIA — Utilidades de construcción de DOM.
   Todo el contenido se crea con createElement/appendChild: en el proyecto
   no se usa innerHTML en ningún punto.
   ========================================================================= */

const ESPACIO_SVG = "http://www.w3.org/2000/svg";

/**
 * Crea un elemento HTML aplicando clases, atributos, texto e hijos.
 * @param {string} etiqueta Nombre de la etiqueta a crear.
 * @param {object} [opciones]
 * @param {string|string[]} [opciones.clase] Clase o listado de clases.
 * @param {string} [opciones.texto] Contenido textual del elemento.
 * @param {object} [opciones.atributos] Pares atributo/valor.
 * @param {object} [opciones.datos] Pares que se vuelcan en dataset.
 * @param {Node[]} [opciones.hijos] Nodos que se anexan en orden.
 * @param {object} [opciones.eventos] Pares evento/manejador.
 * @returns {HTMLElement}
 */
function crear(etiqueta, opciones = {}) {
  const elemento = document.createElement(etiqueta);
  aplicarOpciones(elemento, opciones);
  return elemento;
}

/**
 * Equivalente a `crear` para elementos SVG, que exigen espacio de nombres.
 * @param {string} etiqueta
 * @param {object} [opciones]
 * @returns {SVGElement}
 */
function crearSVG(etiqueta, opciones = {}) {
  const elemento = document.createElementNS(ESPACIO_SVG, etiqueta);
  aplicarOpciones(elemento, opciones, true);
  return elemento;
}

/* Vuelca las opciones comunes sobre un elemento ya creado. */
function aplicarOpciones(elemento, opciones, esSVG = false) {
  const { clase, texto, atributos, datos, hijos, eventos } = opciones;

  if (clase) {
    const clases = Array.isArray(clase) ? clase : [clase];
    const limpias = clases.filter(Boolean);

    if (esSVG) {
      /* classList es de solo lectura en SVG antiguos: se usa el atributo. */
      elemento.setAttribute("class", limpias.join(" "));
    } else {
      elemento.classList.add(...limpias);
    }
  }

  if (texto !== undefined && texto !== null) {
    elemento.textContent = String(texto);
  }

  if (atributos) {
    Object.entries(atributos).forEach(([nombre, valor]) => {
      if (valor !== undefined && valor !== null && valor !== false) {
        elemento.setAttribute(nombre, String(valor));
      }
    });
  }

  if (datos) {
    Object.entries(datos).forEach(([nombre, valor]) => {
      elemento.dataset[nombre] = String(valor);
    });
  }

  if (hijos) {
    hijos.filter(Boolean).forEach((hijo) => elemento.appendChild(hijo));
  }

  if (eventos) {
    Object.entries(eventos).forEach(([nombre, manejador]) => {
      elemento.addEventListener(nombre, manejador);
    });
  }
}

/**
 * Vacía un contenedor sin recurrir a innerHTML.
 * @param {HTMLElement} contenedor
 */
function vaciar(contenedor) {
  while (contenedor.firstChild) {
    contenedor.removeChild(contenedor.firstChild);
  }
}

/**
 * Reemplaza el contenido de un contenedor por los nodos indicados.
 * @param {HTMLElement} contenedor
 * @param {...Node} nodos
 */
function reemplazar(contenedor, ...nodos) {
  vaciar(contenedor);
  nodos.filter(Boolean).forEach((nodo) => contenedor.appendChild(nodo));
}

/**
 * Crea un fragmento con varios nodos para insertarlos de una sola vez.
 * @param {Node[]} nodos
 * @returns {DocumentFragment}
 */
function fragmento(nodos) {
  const contenedor = document.createDocumentFragment();
  nodos.filter(Boolean).forEach((nodo) => contenedor.appendChild(nodo));
  return contenedor;
}

  Object.assign(REGISTRO, { crear, crearSVG, vaciar, reemplazar, fragmento });

/**
 * Construye un icono SVG por su nombre.
 * @param {string} nombre Clave dentro del catálogo de trazos.
 * @param {object} [opciones]
 * @param {number} [opciones.tamano] Lado del icono en píxeles.
 * @param {string} [opciones.clase] Clase adicional para el SVG.
 * @returns {SVGElement}
 */
function icono(nombre, opciones = {}) {
  const { tamano = 20, clase } = opciones;
  const definicion = TRAZOS[nombre] ?? TRAZOS.aviso;

  const svg = crearSVG("svg", {
    clase: ["icono", clase],
    atributos: {
      width: tamano,
      height: tamano,
      viewBox: "0 0 24 24",
      fill: "none",
      stroke: "currentColor",
      "stroke-width": 1.7,
      "stroke-linecap": "round",
      "stroke-linejoin": "round",
      "aria-hidden": "true",
      focusable: "false",
    },
  });

  definicion.forEach(({ forma, atributos }) => {
    svg.appendChild(crearSVG(forma, { atributos }));
  });

  return svg;
}

  Object.assign(REGISTRO, { icono });
})();

(() => {
  const { crear, icono } = REGISTRO;
/* =========================================================================
   LISA vigIA — Avisos flotantes.
   Sustituyen por completo a alert(): el feedback siempre ocurre en el DOM
   y con el mismo lenguaje visual del resto de la interfaz.
   ========================================================================= */


const DURACION = 4200;

/* Contenedor único, creado la primera vez que se emite un aviso. */
let contenedor = null;

function obtenerContenedor() {
  if (!contenedor) {
    contenedor = crear("div", {
      clase: "avisos",
      atributos: { role: "status", "aria-live": "polite" },
    });
    document.body.appendChild(contenedor);
  }
  return contenedor;
}

/**
 * Muestra un aviso temporal en la esquina inferior derecha.
 * @param {object} opciones
 * @param {string} opciones.titulo Encabezado breve del aviso.
 * @param {string} [opciones.texto] Detalle complementario.
 * @param {"info"|"exito"|"alerta"} [opciones.tipo] Estilo del aviso.
 */
function mostrarAviso({ titulo, texto = "", tipo = "info" }) {
  const nombreIcono = tipo === "exito" ? "visto" : tipo === "alerta" ? "alerta" : "aviso";

  const cuerpo = crear("div", {
    hijos: [
      crear("p", { clase: "aviso__titulo", texto: titulo }),
      texto ? crear("p", { clase: "aviso__texto", texto }) : null,
    ],
  });

  const aviso = crear("div", {
    clase: ["aviso", tipo !== "info" ? `aviso--${tipo}` : null],
    hijos: [icono(nombreIcono, { tamano: 18, clase: "aviso__icono" }), cuerpo],
  });

  obtenerContenedor().appendChild(aviso);

  window.setTimeout(() => {
    aviso.remove();
  }, DURACION);
}

  Object.assign(REGISTRO, { mostrarAviso });
})();

(() => {
/* =========================================================================
   LISA vigIA — Formato de cifras y fechas en convención chilena.
   ========================================================================= */

const formateadorMoneda = new Intl.NumberFormat("es-CL", {
  style: "currency",
  currency: "CLP",
  maximumFractionDigits: 0,
});

const formateadorNumero = new Intl.NumberFormat("es-CL", {
  maximumFractionDigits: 0,
});

/**
 * Formatea un monto como moneda chilena, por ejemplo "$905.000".
 * @param {number} monto
 * @returns {string}
 */
function comoMoneda(monto) {
  return formateadorMoneda.format(monto);
}

/**
 * Formatea un entero con separador de miles.
 * @param {number} valor
 * @returns {string}
 */
function comoNumero(valor) {
  return formateadorNumero.format(Math.round(valor));
}

/**
 * Formatea un porcentaje entero, por ejemplo "65%".
 * @param {number} valor
 * @returns {string}
 */
function comoPorcentaje(valor) {
  return `${Math.round(valor)}%`;
}

/**
 * Devuelve la fecha y hora actual en formato legible para el reporte.
 * @returns {string}
 */
function marcaDeTiempo() {
  const ahora = new Date();
  const fecha = ahora.toLocaleDateString("es-CL", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
  });
  /* Se fuerza el reloj de 24 horas: evita el sufijo "a. m." abreviado,
     que arrastra puntos y complica la lectura junto a la fecha. */
  const hora = ahora.toLocaleTimeString("es-CL", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false,
  });
  return `${fecha} · ${hora} h`;
}

/**
 * Comprueba que una dirección de correo tenga una forma válida.
 * @param {string} valor
 * @returns {boolean}
 */
function esCorreoValido(valor) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(valor.trim());
}

  Object.assign(REGISTRO, { comoMoneda, comoNumero, comoPorcentaje, marcaDeTiempo, esCorreoValido });
})();

(() => {

/* =========================================================================
   LISA vigIA — Tabla de casos con semáforo de riesgo.
   La usan tanto el listado de casos críticos como el de casos leves; la
   diferencia está en el detalle de las cabeceras y en el resaltado.

/* Traducción de cada nivel a un texto para lectores de pantalla. */
const TEXTO_NIVEL = {
  [NIVEL.ALTO]: "riesgo alto",
  [NIVEL.MEDIO]: "riesgo medio",
  [NIVEL.BAJO]: "riesgo bajo",
};

/**
 * Construye el círculo del semáforo para un criterio.
 * @param {string} nivel Uno de los valores de NIVEL.
 * @param {string} criterio Nombre del criterio evaluado.
 * @returns {HTMLElement}
 */
function crearSemaforo(nivel, criterio) {
  return crear("span", {
    clase: ["semaforo", `semaforo--${nivel}`],
    atributos: {
      role: "img",
      "aria-label": `${criterio}: ${TEXTO_NIVEL[nivel]}`,
      title: `${criterio}: ${TEXTO_NIVEL[nivel]}`,
    },
  });
}

/* Clasifica el puntaje para darle color al número final. */
function clasePuntaje(puntaje) {
  if (puntaje >= 70) {
    return "puntaje--alto";
  }
  if (puntaje >= 40) {
    return "puntaje--medio";
  }
  return "puntaje--bajo";
}

/**

function crearTablaCasos({ casos, compacta = false, idDestacado, alAbrirCaso }) {
  const columnas = compacta

    return crear("th", {
      texto: titulo,
      clase: esUltima ? "col-derecha" : esCentro ? "col-centro" : null,
      atributos: { scope: "col" },

  const cuerpo = crear("tbody");

  casos.forEach((caso) => {

/**
 * Anima un valor numérico desde cero hasta su cifra final.
 * @param {HTMLElement} elemento Nodo cuyo texto se actualiza.
 * @param {number} valorFinal
 * @param {Function} formatear Convierte el número en texto.
 */
function animarValor(elemento, valorFinal, formatear) {
  /* Se respeta la preferencia del sistema de reducir el movimiento. */
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    elemento.textContent = formatear(valorFinal);
    return;
  }

  const duracion = 900;
  const inicio = performance.now();

  const paso = (ahora) => {
    const avance = Math.min((ahora - inicio) / duracion, 1);
    /* Curva de salida suave para que el contador desacelere al final. */
    const suavizado = 1 - (1 - avance) ** 3;

    elemento.textContent = formatear(valorFinal * suavizado);

    if (avance < 1) {
      window.requestAnimationFrame(paso);
    }
  };

  window.requestAnimationFrame(paso);
}

const FILTROS = [

  { id: "leve", etiqueta: "Leves" },

 * Construye la vista del registro completo de casos.

 * @returns {HTMLElement}
 */
function crearVistaRegistro({ alAbrirCaso, busqueda = "" }) {
  let filtroActivo = "todos";
  let textoBusqueda = busqueda;

  const contenedorTabla = crear("div");
  const resumen = crear("p", { clase: "vista__subtitulo" });

    const filtrados = casos.filter((caso) => {
      const coincideFiltro = filtroActivo === "todos" || caso.criticidad === filtroActivo;

      const coincideTexto =
        termino === "" ||
        caso.beneficiario.toLowerCase().includes(termino) ||
        caso.rut.toLowerCase().includes(termino) ||
        caso.numeroSiniestro.includes(termino);

      return coincideFiltro && coincideTexto;
    });

    resumen.textContent =
      termino === ""
        ? `${filtrados.length} casos en la cartera.`
        : `${filtrados.length} casos coinciden con "${textoBusqueda}".`;

      reemplazar(
        contenedorTabla,
        crear("div", {
          clase: "estado-vacio",
          texto: "No se encontraron casos con los criterios indicados.",
        })
      );
      return;
    }

    reemplazar(
      contenedorTabla,
      crearTablaCasos({ casos: filtrados, alAbrirCaso })
    );

      atributos: { type: "button" },
      texto: filtro.etiqueta,
      datos: { filtro: filtro.id },
    })
  );

  /* Un único manejador controla el estado visual de los tres botones. */
  botonesFiltro.forEach((boton) => {
    boton.addEventListener("click", () => {
      filtroActivo = boton.dataset.filtro;

      botonesFiltro.forEach((otro) => {
        const esActivo = otro.dataset.filtro === filtroActivo;
        otro.classList.toggle("boton--primario", esActivo);
        otro.classList.toggle("boton--fantasma", !esActivo);
      });

      actualizar();
    });

    clase: "campo__control",
    atributos: {

      value: textoBusqueda,
      placeholder: "Filtrar por nombre, RUT o N° de siniestro…",

    clase: "panel__cabecera",
    hijos: [

        clase: "panel__titulo",
        hijos: [icono("carpeta", { tamano: 22 }), crear("span", { texto: "Cartera completa" })],

        atributos: { style: "margin-left:auto;display:flex;gap:0.8rem;flex-wrap:wrap" },

  const panel = crear("section", {
    clase: "panel",
    hijos: [

        atributos: { style: "padding:1.6rem 2.4rem 0" },

      }),
