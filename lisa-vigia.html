/* =========================================================================
   LISA vigIA — Avisos flotantes.
   Sustituyen por completo a alert(): el feedback siempre ocurre en el DOM
   y con el mismo lenguaje visual del resto de la interfaz.
   ========================================================================= */


const DURACION = 4200;

/* Contenedor único, creado la primera vez que se emite un aviso. */
let contenedor = null;

function obtenerContenedor() {
  if (!contenedor) {
    contenedor = crear("div", {
      clase: "avisos",
      atributos: { role: "status", "aria-live": "polite" },
    });
    document.body.appendChild(contenedor);
  }
  return contenedor;
}

/**
 * Muestra un aviso temporal en la esquina inferior derecha.
 * @param {object} opciones
 * @param {string} opciones.titulo Encabezado breve del aviso.
 * @param {string} [opciones.texto] Detalle complementario.
 * @param {"info"|"exito"|"alerta"} [opciones.tipo] Estilo del aviso.
 */
function mostrarAviso({ titulo, texto = "", tipo = "info" }) {
  const nombreIcono = tipo === "exito" ? "visto" : tipo === "alerta" ? "alerta" : "aviso";

  const cuerpo = crear("div", {
    hijos: [
      crear("p", { clase: "aviso__titulo", texto: titulo }),
      texto ? crear("p", { clase: "aviso__texto", texto }) : null,
    ],
  });

  const aviso = crear("div", {
    clase: ["aviso", tipo !== "info" ? `aviso--${tipo}` : null],
    hijos: [icono(nombreIcono, { tamano: 18, clase: "aviso__icono" }), cuerpo],
  });

  obtenerContenedor().appendChild(aviso);

  window.setTimeout(() => {
    aviso.remove();
  }, DURACION);
}

  Object.assign(REGISTRO, { mostrarAviso });
})();

    hijos: [icono("menu", { tamano: 20 })],
  });

  const entradaBusqueda = crear("input", {
    clase: "topbar__input",
    atributos: {
      type: "search",
      name: "busqueda",
      placeholder: "Buscar beneficiario, RUT o N° de caso…",
      "aria-label": "Buscar en la cartera de siniestros",
    },
  });

  const formularioBusqueda = crear("form", {
    clase: "topbar__buscador",
    atributos: { role: "search" },
    hijos: [icono("lupa", { tamano: 18 }), entradaBusqueda],
    eventos: {
      submit: (evento) => {
        evento.preventDefault();
        alBuscar(entradaBusqueda.value.trim());
      },
    },
  });

  /* Botones decorativos de la cabecera, con feedback en el DOM. */
  const crearBotonTopbar = (nombreIcono, etiqueta, conNotificacion = false) =>
    crear("button", {
      clase: "topbar__boton",
      atributos: { type: "button", "aria-label": etiqueta },
      hijos: [
        icono(nombreIcono, { tamano: 20 }),
        conNotificacion ? crear("span", { clase: "topbar__notificacion" }) : null,
      ],
      eventos: {
        click: () =>
          mostrarAviso({ titulo: etiqueta, texto: "Sección no habilitada en el prototipo." }),
      },
    });

  /* Interruptor entre el modo nocturno y el diurno. El icono anticipa el
     tema al que se cambiará, no el que está activo. */
  const botonTema = crear("button", {
    clase: ["topbar__boton", "topbar__boton--tema"],
    atributos: { type: "button" },
  });

  const pintarBotonTema = () => {
    const claro = esTemaClaro();
    const destino = claro ? "modo nocturno" : "modo diurno";

    reemplazar(botonTema, icono(claro ? "luna" : "sol", { tamano: 20 }));
    botonTema.setAttribute("aria-label", `Cambiar a ${destino}`);
    botonTema.setAttribute("title", `Cambiar a ${destino}`);
  };

  botonTema.addEventListener("click", () => {
    const tema = alternarTema();
    pintarBotonTema();

    mostrarAviso({
      titulo: tema === "claro" ? "Modo diurno" : "Modo nocturno",
      texto: "La preferencia se recordará en este navegador.",
    });
  });

  pintarBotonTema();

  const topbar = crear("header", {
    clase: "topbar",
    hijos: [
      botonMenu,
      crear("p", { clase: "topbar__titulo", texto: "LISA vigIA · ANALÍTICA DE FRAUDE" }),
      formularioBusqueda,
      crear("div", {
        clase: "topbar__acciones",
        hijos: [
          botonTema,
          crearBotonTopbar("campana", "Notificaciones", true),
          crearBotonTopbar("ayuda", "Ayuda"),
          crearBotonTopbar("ajustes", "Configuración"),
          crear("div", {
            clase: "topbar__avatar",
            atributos: { title: "Analista de siniestros", "aria-label": "Analista de siniestros" },
            texto: "AS",
          }),
        ],
      }),
    ],
  });

  /* ---------------------------------------------------------------- */
  /* Menú móvil                                                        */
  /* ---------------------------------------------------------------- */

  const velo = crear("div", { clase: "velo-menu", atributos: { "aria-hidden": "true" } });

  const cerrarMenu = () => {
    sidebar.classList.remove("esta-abierta");
    velo.classList.remove("esta-visible");
    botonMenu.setAttribute("aria-expanded", "false");
  };

  botonMenu.addEventListener("click", () => {
    sidebar.classList.add("esta-abierta");
    velo.classList.add("esta-visible");
    botonMenu.setAttribute("aria-expanded", "true");
  });

  botonCerrarMenu.addEventListener("click", cerrarMenu);
  velo.addEventListener("click", cerrarMenu);

  /* Al elegir una sección el menú se repliega en pantallas pequeñas. */
  enlaces.forEach((enlace) => enlace.addEventListener("click", cerrarMenu));

  /* ---------------------------------------------------------------- */
  /* Composición                                                       */
  /* ---------------------------------------------------------------- */

  const contenedorVista = crear("main", { atributos: { id: "contenido" } });

  const principal = crear("div", {
    clase: "principal",
    hijos: [topbar, contenedorVista],
  });

  const app = crear("div", { clase: "app", hijos: [sidebar, principal] });

  return {
    app,
    velo,
    contenedorVista,
    entradaBusqueda,
    /* Marca visualmente la sección activa en la navegación. */
    marcarSeccion(id) {
      enlaces.forEach((enlace) => {
        if (enlace.dataset.seccion === id) {
          enlace.setAttribute("aria-current", "page");
        } else {
          enlace.removeAttribute("aria-current");
        }
      });
    },
  };
}

  Object.assign(REGISTRO, { SECCIONES, crearArmazon });
})();

(() => {
/* =========================================================================
   LISA vigIA — Formato de cifras y fechas en convención chilena.
   ========================================================================= */

const formateadorMoneda = new Intl.NumberFormat("es-CL", {
  style: "currency",
  currency: "CLP",
  maximumFractionDigits: 0,
});

const formateadorNumero = new Intl.NumberFormat("es-CL", {
  maximumFractionDigits: 0,
});

/**
 * Formatea un monto como moneda chilena, por ejemplo "$905.000".
 * @param {number} monto
 * @returns {string}
 */
function comoMoneda(monto) {
  return formateadorMoneda.format(monto);
}

/**
 * Formatea un entero con separador de miles.
 * @param {number} valor
 * @returns {string}
 */
function comoNumero(valor) {
  return formateadorNumero.format(Math.round(valor));
}

/**
 * Formatea un porcentaje entero, por ejemplo "65%".
 * @param {number} valor
 * @returns {string}
 */
function comoPorcentaje(valor) {
  return `${Math.round(valor)}%`;
}

/**
 * Devuelve la fecha y hora actual en formato legible para el reporte.
 * @returns {string}
 */
function marcaDeTiempo() {
  const ahora = new Date();
  const fecha = ahora.toLocaleDateString("es-CL", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
  });
  /* Se fuerza el reloj de 24 horas: evita el sufijo "a. m." abreviado,
     que arrastra puntos y complica la lectura junto a la fecha. */
  const hora = ahora.toLocaleTimeString("es-CL", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false,
  });
  return `${fecha} · ${hora} h`;
}

/**
 * Comprueba que una dirección de correo tenga una forma válida.
 * @param {string} valor
 * @returns {boolean}
 */
function esCorreoValido(valor) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(valor.trim());
}

  Object.assign(REGISTRO, { comoMoneda, comoNumero, comoPorcentaje, marcaDeTiempo, esCorreoValido });
})();

(() => {
  const { crear, NIVEL } = REGISTRO;
/* =========================================================================
   LISA vigIA — Tabla de casos con semáforo de riesgo.
   La usan tanto el listado de casos críticos como el de casos leves; la
   diferencia está en el detalle de las cabeceras y en el resaltado.
   ========================================================================= */


/* Traducción de cada nivel a un texto para lectores de pantalla. */
const TEXTO_NIVEL = {
  [NIVEL.ALTO]: "riesgo alto",
  [NIVEL.MEDIO]: "riesgo medio",
  [NIVEL.BAJO]: "riesgo bajo",
};

/**
 * Construye el círculo del semáforo para un criterio.
 * @param {string} nivel Uno de los valores de NIVEL.
 * @param {string} criterio Nombre del criterio evaluado.
 * @returns {HTMLElement}
 */
function crearSemaforo(nivel, criterio) {
  return crear("span", {
    clase: ["semaforo", `semaforo--${nivel}`],
    atributos: {
      role: "img",
      "aria-label": `${criterio}: ${TEXTO_NIVEL[nivel]}`,
      title: `${criterio}: ${TEXTO_NIVEL[nivel]}`,
    },
  });
}

/* Clasifica el puntaje para darle color al número final. */
function clasePuntaje(puntaje) {
  if (puntaje >= 70) {
    return "puntaje--alto";
  }
  if (puntaje >= 40) {
    return "puntaje--medio";
  }
  return "puntaje--bajo";
}

/**
 * Crea una tabla de casos navegable.
 * @param {object} opciones
 * @param {object[]} opciones.casos Casos que se listan.
 * @param {boolean} [opciones.compacta] Usa abreviaturas en las cabeceras.
 * @param {string} [opciones.idDestacado] Caso que se resalta en la lista.
 * @param {Function} opciones.alAbrirCaso Recibe el id del caso elegido.
 * @returns {HTMLElement}
 */
function crearTablaCasos({ casos, compacta = false, idDestacado, alAbrirCaso }) {
  const columnas = compacta
    ? ["Beneficiario", "AF", "VE", "PT", "Score"]
    : [
        "Beneficiario (Nombre-RUT)",
        "Análisis Forense",
        "Validación Externa",
        "Patrones",
        "Scoring",
      ];

  const encabezados = columnas.map((titulo, indice) => {
    const esUltima = indice === columnas.length - 1;
    const esCentro = indice > 0 && !esUltima;

    return crear("th", {
      texto: titulo,
      clase: esUltima ? "col-derecha" : esCentro ? "col-centro" : null,
      atributos: { scope: "col" },
    });
  });

  const cuerpo = crear("tbody");

  casos.forEach((caso) => {
    const celdaBeneficiario = crear("td", {
      hijos: [
        crear("p", { clase: "celda-beneficiario__nombre", texto: caso.beneficiario }),
        crear("p", { clase: "celda-beneficiario__rut", texto: caso.rut }),
      ],
    });

    const celdasSemaforo = [
      crearSemaforo(caso.semaforo.forense, "Análisis forense de documentos"),
      crearSemaforo(caso.semaforo.validacion, "Validación externa e interna"),
      crearSemaforo(caso.semaforo.patrones, "Análisis de patrones de comportamiento"),
    ].map((marca) => crear("td", { clase: "col-centro", hijos: [marca] }));

    const esDestacado = caso.id === idDestacado;

    const valorPuntaje = crear("span", {
      clase: ["puntaje", clasePuntaje(caso.puntaje), esDestacado ? "puntaje--marcado" : null],
      texto: String(caso.puntaje),
    });

    const celdaPuntaje = crear("td", { clase: "col-derecha", hijos: [valorPuntaje] });

    const fila = crear("tr", {
      clase: esDestacado ? "esta-destacada" : null,
      atributos: {
        tabindex: "0",
        role: "link",
        "aria-label": `Abrir el caso de ${caso.beneficiario}, puntaje de riesgo ${caso.puntaje} de 100`,
      },
      datos: { caso: caso.id },
      hijos: [celdaBeneficiario, ...celdasSemaforo, celdaPuntaje],
      eventos: {
        click: () => alAbrirCaso(caso.id),
        keydown: (evento) => {
          /* La fila se comporta como un enlace también desde el teclado. */
          if (evento.key === "Enter" || evento.key === " ") {
            evento.preventDefault();
            alAbrirCaso(caso.id);
          }
        },
      },
    });

    cuerpo.appendChild(fila);
  });

  const tabla = crear("table", {
    clase: ["tabla-casos", compacta ? "tabla-casos--compacta" : null],
    hijos: [crear("thead", { hijos: [crear("tr", { hijos: encabezados })] }), cuerpo],
  });

  return crear("div", { clase: "tabla-envoltura", hijos: [tabla] });
}

  Object.assign(REGISTRO, { crearTablaCasos });
})();

(() => {
  const { crear, comoMoneda, comoPorcentaje, casos, casosCriticos, casosLevesLista, icono, crearTablaCasos } = REGISTRO;
/* =========================================================================
   LISA vigIA — Vista de inicio: indicadores de cartera y listados de casos.
   ========================================================================= */





/* Caso que aparece resaltado por ser el de mayor puntaje. */
const ID_CASO_PRINCIPAL = "77940303";

/**
 * Calcula los indicadores que encabezan el panel.
 * @returns {object}
 */
function calcularIndicadores() {
  const montoTotal = casos.reduce((suma, caso) => suma + caso.monto, 0);
  const montoCritico = casosCriticos.reduce((suma, caso) => suma + caso.monto, 0);

  return {
    totalCasos: casos.length,
    totalCriticos: casosCriticos.length,
    montoTotal,
    montoCritico,
    porcentajeCasos: (casosCriticos.length / casos.length) * 100,
    porcentajeMonto: (montoCritico / montoTotal) * 100,
  };
}

/**
 * Anima un valor numérico desde cero hasta su cifra final.
 * @param {HTMLElement} elemento Nodo cuyo texto se actualiza.
 * @param {number} valorFinal
 * @param {Function} formatear Convierte el número en texto.
 */
function animarValor(elemento, valorFinal, formatear) {
  /* Se respeta la preferencia del sistema de reducir el movimiento. */
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    elemento.textContent = formatear(valorFinal);
    return;
  }

  const duracion = 900;
  const inicio = performance.now();

  const paso = (ahora) => {
    const avance = Math.min((ahora - inicio) / duracion, 1);
    /* Curva de salida suave para que el contador desacelere al final. */
    const suavizado = 1 - (1 - avance) ** 3;

    elemento.textContent = formatear(valorFinal * suavizado);

    if (avance < 1) {
      window.requestAnimationFrame(paso);
    }
  };

  window.requestAnimationFrame(paso);
}

/* Tarjeta de recuento de casos críticos. */
function crearKpiCriticos(datos) {
  const valor = crear("p", { clase: ["kpi__valor", "kpi__valor--critico"], texto: "0" });
  animarValor(valor, datos.totalCriticos, (numero) => String(Math.round(numero)));

  return crear("article", {
    clase: ["kpi", "kpi--alerta"],
    hijos: [
      crear("div", {
        clase: "kpi__cabecera",
        hijos: [
          crear("h3", { clase: "kpi__titulo", texto: "Total de casos críticos" }),
          icono("alerta", { tamano: 20, clase: "kpi__icono kpi__icono--alerta" }),
        ],
      }),
      valor,
      crear("p", {
        clase: "kpi__nota",
        texto: `de ${datos.totalCasos} casos activos en revisión`,
      }),
    ],
  });
}

/* Tarjeta del monto en riesgo, que ocupa doble ancho. */
function crearKpiMonto(datos) {
  const valor = crear("p", {
    clase: ["kpi__valor", "kpi__valor--monto", "kpi__valor--critico"],
    texto: comoMoneda(0),
  });
  animarValor(valor, datos.montoCritico, comoMoneda);

  return crear("article", {
    clase: ["kpi", "kpi--alerta", "kpi--ancho"],
    hijos: [
      crear("div", {
        clase: "kpi__cabecera",
        hijos: [
          crear("h3", { clase: "kpi__titulo", texto: "Monto en riesgo (crítico)" }),
          crear("span", { clase: ["distintivo", "distintivo--critico"], texto: "Exposición crítica" }),
        ],
      }),
      valor,
      crear("p", {
        clase: ["kpi__nota", "kpi__nota--alerta"],
        hijos: [
          icono("tendencia", { tamano: 16 }),
          crear("span", { texto: `Concentrado en ${datos.totalCriticos} casos` }),
        ],
      }),
    ],
  });
}

/* Tarjeta de porcentaje con barra de progreso. */
function crearKpiPorcentaje(titulo, porcentaje) {
  const numero = crear("span", { clase: "kpi__porcentaje", texto: "0%" });
  animarValor(numero, porcentaje, comoPorcentaje);

  const relleno = crear("span", { clase: "barra__relleno" });
  relleno.style.width = "0%";

  /* La barra se llena en el cuadro siguiente para animar el ancho. */
  window.requestAnimationFrame(() => {
    relleno.style.width = `${porcentaje}%`;
  });

  return crear("article", {
    clase: "kpi",
    hijos: [
      crear("h3", { clase: "kpi__titulo", texto: titulo }),
      crear("div", {
        clase: "kpi__medida",
        hijos: [numero, crear("span", { clase: "barra", hijos: [relleno] })],
      }),
    ],
  });
}

/* Tarjeta del monto total detectado en toda la cartera. */
function crearKpiTotal(datos) {
  const valor = crear("p", {
    clase: ["kpi__valor", "kpi__valor--monto"],
    texto: comoMoneda(0),
  });
  animarValor(valor, datos.montoTotal, comoMoneda);

  return crear("article", {
    clase: "kpi",
    hijos: [
      crear("div", {
        clase: "kpi__cabecera",
        hijos: [
          crear("h3", { clase: "kpi__titulo", texto: "Monto total detectado" }),
          icono("grafico", { tamano: 20, clase: "kpi__icono" }),
        ],
      }),
      valor,
      crear("p", { clase: "kpi__nota", texto: "Suma de todos los niveles de riesgo" }),
    ],
  });
}

/* Panel contenedor de un listado de casos. */
function crearPanelListado({ titulo, nombreIcono, distintivo, claseDistintivo, tabla }) {
  return crear("section", {
    clase: "panel",
    hijos: [
      crear("header", {
        clase: "panel__cabecera",
        hijos: [
          crear("h2", {
            clase: "panel__titulo",
            hijos: [icono(nombreIcono, { tamano: 22 }), crear("span", { texto: titulo })],
          }),
          crear("span", {
            clase: ["distintivo", claseDistintivo],
            texto: distintivo,
            atributos: { style: "margin-left:auto" },
          }),
        ],
      }),
      tabla,
    ],
  });
}

/**
 * Construye la vista completa del panel inicial.
 * @param {object} opciones
 * @param {Function} opciones.alAbrirCaso Navega al reporte del caso.
 * @returns {HTMLElement}
 */
function crearVistaDashboard({ alAbrirCaso }) {
  const datos = calcularIndicadores();

  const cabecera = crear("header", {
    clase: "vista__cabecera",
    hijos: [
      crear("div", {
        hijos: [
          crear("h1", { clase: "vista__titulo", texto: "Protocolo de detección de fraude" }),
          crear("p", {
            clase: "vista__subtitulo",
            texto: "Evaluación de riesgo en tiempo real y resumen del análisis forense.",
          }),
        ],
      }),
      crear("div", {
        clase: "vista__meta",
        hijos: [
          crear("p", { clase: "vista__meta-titulo", texto: "Último escaneo" }),
          crear("p", {
            clase: "vista__meta-estado",
            hijos: [
              crear("span", { clase: "vista__meta-punto" }),
              crear("span", { texto: "CANALIZACIÓN ACTIVA" }),
            ],
          }),
        ],
      }),

  const indicadores = crear("section", {

      crearKpiCriticos(datos),

      crearKpiPorcentaje("Monto crítico sobre el total", datos.porcentajeMonto),
      crearKpiTotal(datos),

  });

  const panelCriticos = crearPanelListado({
    titulo: "Casos críticos",

    distintivo: "Acción inmediata requerida",
    claseDistintivo: "distintivo--critico",

  const panelLeves = crearPanelListado({

  return crear("div", {

    hijos: [cabecera, indicadores, listados],
  });
}

  Object.assign(REGISTRO, { crearVistaDashboard });
})();

(() => {
  const { crear, reemplazar, casos, icono, crearTablaCasos } = REGISTRO;
/* =========================================================================
   LISA vigIA — Registro de casos: cartera completa con filtros y búsqueda.
   ========================================================================= */




/* Filtros disponibles sobre la cartera. */
const FILTROS = [
  { id: "todos", etiqueta: "Todos" },
  { id: "critico", etiqueta: "Críticos" },
  { id: "leve", etiqueta: "Leves" },
];

/**
 * Construye la vista del registro completo de casos.
 * @param {object} opciones
 * @param {Function} opciones.alAbrirCaso
 * @param {string} [opciones.busqueda] Texto inicial del filtro.
 * @returns {HTMLElement}
 */
function crearVistaRegistro({ alAbrirCaso, busqueda = "" }) {
  let filtroActivo = "todos";
  let textoBusqueda = busqueda;

  const contenedorTabla = crear("div");
  const resumen = crear("p", { clase: "vista__subtitulo" });

  /* Aplica filtro y búsqueda sobre la cartera y redibuja la tabla. */
  const actualizar = () => {
    const termino = textoBusqueda.trim().toLowerCase();

    const filtrados = casos.filter((caso) => {
      const coincideFiltro = filtroActivo === "todos" || caso.criticidad === filtroActivo;

      const coincideTexto =
        termino === "" ||
        caso.beneficiario.toLowerCase().includes(termino) ||
        caso.rut.toLowerCase().includes(termino) ||
        caso.numeroSiniestro.includes(termino);

      return coincideFiltro && coincideTexto;
    });

    resumen.textContent =
      termino === ""
        ? `${filtrados.length} casos en la cartera.`
        : `${filtrados.length} casos coinciden con "${textoBusqueda}".`;

    if (filtrados.length === 0) {
      reemplazar(
        contenedorTabla,
        crear("div", {
          clase: "estado-vacio",
          texto: "No se encontraron casos con los criterios indicados.",
        })
      );
      return;
    }

    reemplazar(
      contenedorTabla,
      crearTablaCasos({ casos: filtrados, alAbrirCaso })
    );
  };

  const botonesFiltro = FILTROS.map((filtro) =>
    crear("button", {

(() => {
  const { crear } = REGISTRO;
/* =========================================================================
   LISA vigIA — Visor del documento periciado.
   Muestra la boleta de honorarios aportada por el beneficiario y superpone
   las zonas señaladas por el detector visual. Cada marca es interactiva:
   al posar el puntero sobre ella se describe el hallazgo asociado.
   ========================================================================= */

/* Colores por tipo de marca, alineados con la leyenda del visor. */
const COLOR_MARCA = {
  visual: "#e5484d",
  metadato: "#7c6ce0",
};

/**
 * Construye el visor con la boleta y sus marcas de anomalía.
 * @param {object} opciones
 * @param {object} opciones.caso Caso cuyo documento se representa.
 * @param {object[]} opciones.marcas Zonas detectadas como anómalas.
 * @returns {HTMLElement}
 */
function crearVisorDocumento({ caso, marcas }) {
  const imagen = crear("img", {
    clase: "documento__imagen",
    atributos: {
      src: "assets/boleta-4761.png",
      alt: `${caso.documento} presentada por ${caso.beneficiario}, con las zonas señaladas por el análisis forense.`,
      loading: "lazy",
    },
  });

  const capa = crear("div", { clase: "documento__capa" });

  /* Descripción del hallazgo que se muestra bajo el documento. */
  const detalle = crear("p", {
    clase: "documento__detalle",
    texto: "Pase el puntero sobre una zona marcada para ver el hallazgo.",
  });

  const textoInicial = detalle.textContent;

  marcas.forEach((marca) => {
    const color = COLOR_MARCA[marca.tipo] ?? COLOR_MARCA.visual;

    const zona = crear("button", {
      clase: ["documento__marca", `documento__marca--${marca.tipo}`],
      atributos: {
        type: "button",
        "aria-label": `${marca.etiqueta}: ${marca.detalle}`,
      },
    });

    /* Las coordenadas vienen en porcentaje sobre la imagen original. */
    zona.style.left = `${marca.x}%`;
    zona.style.top = `${marca.y}%`;
    zona.style.width = `${marca.ancho}%`;
    zona.style.height = `${marca.alto}%`;
    zona.style.borderColor = color;
    zona.style.backgroundColor = `${color}22`;

    const etiqueta = crear("span", { clase: "documento__etiqueta", texto: marca.etiqueta });
    etiqueta.style.backgroundColor = color;
    zona.appendChild(etiqueta);

    /* Al enfocar o apuntar la zona se describe el hallazgo debajo. */
    const describir = () => {
      detalle.textContent = `${marca.etiqueta}: ${marca.detalle}`;
      detalle.classList.add("esta-activo");
    };

    const restaurar = () => {
      detalle.textContent = textoInicial;
      detalle.classList.remove("esta-activo");
    };

    zona.addEventListener("mouseenter", describir);
    zona.addEventListener("focus", describir);
    zona.addEventListener("mouseleave", restaurar);
    zona.addEventListener("blur", restaurar);

    /* El botón no envía formularios ni navega: solo describe. */
    zona.addEventListener("click", (evento) => {
      evento.preventDefault();
      describir();
    });

    capa.appendChild(zona);
  });

  const visor = crear("figure", {
    clase: "documento",
    hijos: [imagen, capa],
  });

  const leyenda = crear("figcaption", {
    clase: "documento__pie",
    hijos: [
      crear("span", {
        clase: "documento__leyenda",
        hijos: [
          crear("span", { clase: "documento__muestra" }),
          crear("span", { texto: "Anomalía visual" }),
        ],
      }),
      crear("span", {
        clase: "documento__leyenda",
        hijos: [
          crear("span", { clase: ["documento__muestra", "documento__muestra--meta"] }),
          crear("span", { texto: "Capa editada" }),
        ],
      }),
      crear("span", {
        clase: "documento__origen",
        texto: `${caso.documento} · ${caso.fechaDocumento}`,
      }),
    ],
  });

  return crear("div", { hijos: [visor, leyenda, detalle] });
}

  Object.assign(REGISTRO, { crearVisorDocumento });
})();

(() => {
  const { esTemaClaro } = REGISTRO;
/* =========================================================================
   LISA vigIA — Paleta para los gráficos.
   Los SVG fijan sus colores en atributos, que no siguen a las variables CSS.
   Este módulo entrega los valores del tema activo para que los gráficos se
   dibujen coherentes con el resto de la interfaz.
   ========================================================================= */

const NOCTURNA = {
  critico: "#f2857f",
  criticoFuerte: "#e5484d",
  medio: "#e5b567",
  bajo: "#6ea8d8",
  ok: "#5fc9a0",
  /* Turquesa tomado de la onda de LISA, reservado a la serie de precisión.
     Sobre el fondo nocturno rinde de sobra (contraste 8,5), así que se usa
     el tono del logotipo sin ajustar. */
  precision: "#00e5c2",
  acento: "#9b7cff",
  violeta: "#9b7cff",
  violetaClaro: "#c4aeff",

  texto: "#eef2fb",
  textoMedio: "#a3b0cc",
  textoTenue: "#7b8cb0",

  fondo: "#0a1836",
  rejilla: "#24386b",
  trazoTenue: "#3d5490",

  /* Rellenos de nodo, más oscuros que su trazo. */
  nodoNeutro: "#1c2f5c",
  nodoBorde: "#3d5490",
  nodoVioleta: "#221a4d",
  nodoCritico: "#3d1f2e",
  nodoPrestador: "#261c56",
  nucleo: "#101f42",
  puntoPoblacion: "#2c4272",
  barraLiberados: "#1d4f52",
};

/* La paleta diurna se apoya en los colores de los logotipos: el violeta y el
   cian de la onda de LISA. Los tonos del semáforo —crítico, medio, bajo y
   correcto— quedan fuera de esa armonía porque comunican estado de riesgo. */
const DIURNA = {
  critico: "#c8322f",
  criticoFuerte: "#b3231f",
  medio: "#9a6800",
  bajo: "#2b7ea6",
  ok: "#157a56",
  /* El mismo turquesa, oscurecido para que rinda sobre fondo claro: el tono
     del logotipo daría 2,3 de contraste, y este alcanza 4,8. */
  precision: "#1e798d",
  acento: "#4a00c5",
  violeta: "#4a00c5",
  violetaClaro: "#35008c",

  texto: "#1a1633",
  textoMedio: "#4d4869",
  textoTenue: "#6a6484",

  fondo: "#ffffff",
  rejilla: "#e2ddf0",
  trazoTenue: "#b0a8cd",

  /* En tema claro los rellenos son tintes suaves del propio color. */
  nodoNeutro: "#e7e3f7",
  nodoBorde: "#aaa2c9",
  nodoVioleta: "#e8e0fa",
  nodoCritico: "#fbe9e8",
  nodoPrestador: "#e3daf8",
  nucleo: "#ffffff",
  puntoPoblacion: "#c7dcea",
  barraLiberados: "#a7d4c2",
};

/**
 * Devuelve la paleta que corresponde al tema activo.
 * @returns {object}
 */
function paleta() {
  return esTemaClaro() ? DIURNA : NOCTURNA;
}

  Object.assign(REGISTRO, { paleta });
})();

/* ===== src/js/components/graficoDesviacion.js ===== */
(() => {
  const { crear, crearSVG, vaciar, comoMoneda, paleta } = REGISTRO;
/* =========================================================================
   LISA vigIA — Gráfico de dispersión de montos.
   Sitúa cada siniestro sobre la banda de ±1σ y ±2σ del promedio histórico
   para que los cuatro casos atípicos queden visualmente fuera del rango.
   El globo informativo se muestra al posar el puntero sobre cada punto.
   ========================================================================= */
/* Lienzo en unidades de usuario; el SVG escala con el contenedor. */
const ANCHO = 760;
const ALTO = 340;
const MARGEN = { arriba: 24, derecha: 24, abajo: 42, izquierda: 78 };

const ANCHO_TRAMA = ANCHO - MARGEN.izquierda - MARGEN.derecha;
const ALTO_TRAMA = ALTO - MARGEN.arriba - MARGEN.abajo;

/* Calcula media y desviación estándar de una serie de montos. */
function calcularEstadisticos(montos) {
  const media = montos.reduce((suma, valor) => suma + valor, 0) / montos.length;
  const varianza =
    montos.reduce((suma, valor) => suma + (valor - media) ** 2, 0) / montos.length;
  return { media, desviacion: Math.sqrt(varianza) };
}

/**
 * Dibuja el gráfico de desviación.
 * @param {object} opciones
 * @param {object[]} opciones.poblacion Casos dentro del rango esperado.
 * @param {object[]} opciones.atipicos Casos que se salen de la banda.
 * @param {number} [opciones.promedioReferencia] Promedio histórico oficial.
 * @param {Function} [opciones.alElegirCaso] Recibe el id de un atípico.
 * @returns {HTMLElement}
 */function crearGraficoDesviacion({
  poblacion,
  atipicos,
  promedioReferencia,
  alElegirCaso,
}) {
  const COLOR = paleta();
  const estadisticos = calcularEstadisticos(poblacion.map((dato) => dato.monto));
  const { desviacion } = estadisticos;

  /* Se rotula el promedio histórico declarado por el modelo de riesgo; la
     media de la muestra solo se usa para dimensionar la banda. */
  const media = promedioReferencia ?? estadisticos.media;

  /* La escala vertical llega algo más allá del mayor atípico. */
  const montoMaximo = Math.max(...atipicos.map((dato) => dato.monto)) * 1.12;

  /* Escala de raíz cuadrada: comprime la parte alta del eje para que la
     banda de desviación siga siendo legible junto a montos diez veces
     mayores, sin perder de vista lo lejos que quedan los atípicos. */
  const escalaY = (monto) =>
    ALTO_TRAMA - Math.sqrt(Math.max(monto, 0) / montoMaximo) * ALTO_TRAMA;

  /* Los atípicos se intercalan entre la población para que la comparación
     sea inmediata, en lugar de agruparse todos al final del eje. */
  const total = poblacion.length + atipicos.length;
  const escalaX = (indice) => (ANCHO_TRAMA / (total + 1)) * (indice + 1);

  /* Posiciones repartidas de forma regular para los cuatro atípicos. */
  const posicionAtipico = (indice) =>
    Math.round(((indice + 1) * total) / (atipicos.length + 1));

  const svg = crearSVG("svg", {
    clase: "grafico__lienzo",
    atributos: {
      viewBox: `0 0 ${ANCHO} ${ALTO}`,
      role: "img",
      "aria-label":
        "Dispersión de montos por siniestro: la banda sombreada marca el rango esperado y cuatro casos quedan muy por encima.",
    },
  });

  const trama = crearSVG("g", {
    atributos: { transform: `translate(${MARGEN.izquierda}, ${MARGEN.arriba})` },
  });

  /* --- Bandas de desviación ---------------------------------------- */
  const bandas = [
    { factor: 2, opacidad: 0.06 },
    { factor: 1, opacidad: 0.1 },
  ];

  bandas.forEach(({ factor, opacidad }) => {
    const superior = escalaY(media + desviacion * factor);
    const inferior = escalaY(Math.max(media - desviacion * factor, 0));

    trama.appendChild(
      crearSVG("rect", {
        atributos: {
          x: 0,
          y: superior,
          width: ANCHO_TRAMA,
          height: Math.max(inferior - superior, 1),
          fill: COLOR.bajo,
          opacity: opacidad,
          rx: 4,
        },
      })
    );
  });

  /* --- Línea del promedio histórico -------------------------------- */
  trama.appendChild(
    crearSVG("line", {
      atributos: {
        x1: 0,
        y1: escalaY(media),
        x2: ANCHO_TRAMA,
        y2: escalaY(media),
        stroke: COLOR.bajo,
        "stroke-width": 1.5,
        "stroke-dasharray": "6 4",
      },
    })
  );

  trama.appendChild(
    crearSVG("text", {
      texto: `Promedio histórico ${comoMoneda(media)}`,
      atributos: {
        x: 6,
        y: escalaY(media) - 8,
        fill: COLOR.bajo,
        "font-size": 11,
        "font-family": "monospace",
      },
    })
  );

  /* --- Eje vertical con marcas de monto -----------------------------
     Los valores se eligen a mano porque la escala no es lineal: así el
     eje conserva cifras redondas y suficiente detalle en la zona baja. */
  const marcasEje = [0, 50000, 150000, 400000, 700000, 1000000].filter(
    (monto) => monto <= montoMaximo
  );

  marcasEje.forEach((monto) => {
    const y = escalaY(monto);

    trama.appendChild(
      crearSVG("line", {
        atributos: {
          x1: 0,
          y1: y,
          x2: ANCHO_TRAMA,
          y2: y,
          stroke: COLOR.rejilla,
          "stroke-width": 1,
        },
      })
    );

    trama.appendChild(
      crearSVG("text", {
        texto: `$${Math.round(monto / 1000)}k`,
        atributos: {
          x: -12,
          y: y + 4,
          fill: COLOR.textoTenue,
          "font-size": 11,
          "font-family": "monospace",
          "text-anchor": "end",
        },
      })
    );
  });

  /* --- Globo informativo -------------------------------------------- */
  const tooltip = crear("div", { clase: "tooltip", atributos: { role: "tooltip" } });

  /* Rellena y posiciona el globo respecto del contenedor del gráfico. */
  function mostrarTooltip(dato, evento, contenedor) {
    vaciar(tooltip);

    const filas = [
      ["RUT", dato.rut],
      ["Documento", dato.documento],
      ["Monto", comoMoneda(dato.monto)],
      ["Prestación", dato.prestacion],
      ["Fecha", dato.fecha],
    ];

    tooltip.appendChild(crear("p", { clase: "tooltip__titulo", texto: dato.nombre }));

    filas.forEach(([clave, valor]) => {
      tooltip.appendChild(
        crear("div", {
          clase: "tooltip__fila",
          hijos: [
            crear("span", { clase: "tooltip__clave", texto: clave }),
            crear("span", { clase: "tooltip__valor", texto: valor }),
          ],
        })
      );
    });

    const limites = contenedor.getBoundingClientRect();
    const x = evento.clientX - limites.left + 16;
    const y = evento.clientY - limites.top + 16;

    /* Se corrige la posición para que el globo no rebase el panel. */
    const anchoTooltip = 240;
    const desbordaDerecha = x + anchoTooltip > limites.width;

    tooltip.style.left = `${desbordaDerecha ? x - anchoTooltip - 32 : x}px`;
    tooltip.style.top = `${y}px`;
    tooltip.classList.add("esta-visible");
  }

  function ocultarTooltip() {
    tooltip.classList.remove("esta-visible");
  }

  /* --- Puntos de la población de referencia ------------------------- */
  const contenedor = crear("div", { clase: "grafico" });

  /* Índices que ocuparán los atípicos, para no solaparlos con el resto. */
  const indicesAtipicos = new Set(atipicos.map((_, indice) => posicionAtipico(indice)));

  /* Cada punto de la población toma la siguiente ranura libre del eje. */
  const ranurasPoblacion = [];
  for (let ranura = 0, asignadas = 0; asignadas < poblacion.length; ranura += 1) {
    if (!indicesAtipicos.has(ranura)) {
      ranurasPoblacion.push(ranura);
      asignadas += 1;
    }
  }

  poblacion.forEach((dato, indice) => {
    const punto = crearSVG("circle", {
      clase: "punto-dato",
      atributos: {
        cx: escalaX(ranurasPoblacion[indice]),
        cy: escalaY(dato.monto),
        r: 5,
        fill: COLOR.puntoPoblacion,
        stroke: COLOR.bajo,
        "stroke-width": 1.5,
      },
    });

    punto.addEventListener("mousemove", (evento) => mostrarTooltip(dato, evento, contenedor));
    punto.addEventListener("mouseleave", ocultarTooltip);
    trama.appendChild(punto);
  });

  /* --- Puntos atípicos ---------------------------------------------- */
  atipicos.forEach((dato, indice) => {
    const cx = escalaX(posicionAtipico(indice));
    const cy = escalaY(dato.monto);

    /* Halo que resalta el punto correspondiente al caso en pantalla. */
    if (dato.esCasoActual) {
      const halo = crearSVG("circle", {
        atributos: { cx, cy, r: 14, fill: COLOR.critico, opacity: 0.18 },
      });
      halo.appendChild(
        crearSVG("animate", {
          atributos: {
            attributeName: "r",
            values: "12;18;12",
            dur: "2.4s",
            repeatCount: "indefinite",
          },
        })
      );
      trama.appendChild(halo);
    }

    /* Línea vertical que enfatiza la distancia respecto del promedio. */
    trama.appendChild(
      crearSVG("line", {
        atributos: {
          x1: cx,
          y1: cy,
          x2: cx,
          y2: escalaY(media),
          stroke: COLOR.critico,
          "stroke-width": 1,
          "stroke-dasharray": "3 3",
          opacity: 0.5,
        },
      })
    );

    const punto = crearSVG("circle", {
      clase: "punto-dato",
      atributos: {
        cx,
        cy,
        r: dato.esCasoActual ? 8 : 7,
        fill: COLOR.critico,
        stroke: COLOR.fondo,
        "stroke-width": 2,
        tabindex: "0",
        role: "button",
        "aria-label": `${dato.nombre}, monto ${comoMoneda(dato.monto)}. Abrir el caso.`,
      },
    });

    punto.addEventListener("mousemove", (evento) => mostrarTooltip(dato, evento, contenedor));
    punto.addEventListener("mouseleave", ocultarTooltip);

    /* El punto también da acceso directo al caso relacionado. */
    if (alElegirCaso && dato.idCaso && !dato.esCasoActual) {
      punto.addEventListener("click", () => alElegirCaso(dato.idCaso));
      punto.addEventListener("keydown", (evento) => {
        if (evento.key === "Enter" || evento.key === " ") {
          evento.preventDefault();
          alElegirCaso(dato.idCaso);
        }
      });
    }

    trama.appendChild(punto);
  });

  svg.appendChild(trama);

  /* --- Leyenda ------------------------------------------------------ */
  const leyenda = crear("div", {
    clase: "grafico__leyenda",
    hijos: [
      crearItemLeyenda(COLOR.bajo, "Siniestros dentro del rango esperado"),
      crearItemLeyenda(COLOR.critico, "Casos fuera de la desviación (4)"),
      crearItemLeyenda(COLOR.puntoPoblacion, "Banda de ±1σ y ±2σ", true),
    ],
  });

  contenedor.appendChild(
    crear("p", { clase: "grafico__titulo", texto: "Dispersión de montos frente al promedio histórico" })
  );
  contenedor.appendChild(
    crear("p", {
      clase: "grafico__ayuda",
      texto: "Pase el puntero sobre un punto para ver el detalle del siniestro.",
    })
  );
  contenedor.appendChild(svg);
  contenedor.appendChild(leyenda);
  contenedor.appendChild(tooltip);

  return contenedor;
}

/* Construye un elemento de la leyenda del gráfico. */
function crearItemLeyenda(color, texto, esBanda = false) {
  const muestra = crear("span", { clase: "grafico__muestra" });
  muestra.style.backgroundColor = color;
  if (esBanda) {
    muestra.style.borderRadius = "0.2rem";
  }

  return crear("span", {
    clase: "grafico__leyenda-item",
    hijos: [muestra, crear("span", { texto })],
  });
}

  Object.assign(REGISTRO, { crearGraficoDesviacion });
})();

/* ===== src/js/components/graficoCoalicion.js ===== */
(() => {
  const { crear, crearSVG, vaciar, comoMoneda, paleta } = REGISTRO;
/* =========================================================================
   LISA vigIA — Grafo de coalición.
   Dispone el prestador en el centro y a su alrededor los pacientes que
   repiten visitas. El grosor de cada arista refleja el número de visitas,
   de modo que la concentración del patrón se aprecia de un vistazo.
   ========================================================================= */
const ANCHO = 760;
const ALTO = 460;
const CENTRO_X = ANCHO / 2;
/* El centro se sitúa algo por encima del medio: la mitad inferior necesita
   más espacio para los rótulos de los nodos y el cartel del prestador. */
const CENTRO_Y = 200;
const RADIO_ORBITA = 150;

/**
 * Dibuja la red de coalición entre un prestador y sus pacientes.
 * @param {object} opciones
 * @param {object} opciones.prestador Nodo central.
 * @param {object[]} opciones.pacientes Nodos periféricos.
 * @param {Function} [opciones.alElegirCaso] Recibe el id del caso elegido.
 * @returns {HTMLElement}
 */function crearGraficoCoalicion({ prestador, pacientes, alElegirCaso }) {
  const COLOR = paleta();
  const contenedor = crear("div", { clase: "grafico" });

  const svg = crearSVG("svg", {
    clase: "grafico__lienzo",
    atributos: {
      viewBox: `0 0 ${ANCHO} ${ALTO}`,
      role: "img",
      "aria-label": `Red de coalición: ${pacientes.length} pacientes concentran sus visitas en el prestador ${prestador.nombre}.`,
    },
  });

  const maximoVisitas = Math.max(...pacientes.map((paciente) => paciente.visitas));

  /* Reparte los pacientes en círculo alrededor del prestador. La órbita se
     estira en vertical para dejar libre la franja del cartel central. */
  const posiciones = pacientes.map((paciente, indice) => {
    const angulo = (Math.PI * 2 * indice) / pacientes.length - Math.PI / 2;
    const seno = Math.sin(angulo);

    return {
      paciente,
      x: CENTRO_X + Math.cos(angulo) * RADIO_ORBITA,
      /* Los nodos por debajo del centro se alejan algo más para que sus
         rótulos no queden bajo el cartel con el nombre del prestador. */
      y: CENTRO_Y + seno * RADIO_ORBITA * (seno > 0 ? 1.06 : 0.82),
    };
  });

  /* --- Anillos de referencia ---------------------------------------- */
  [RADIO_ORBITA * 0.55, RADIO_ORBITA].forEach((radio) => {
    svg.appendChild(
      crearSVG("ellipse", {
        atributos: {
          cx: CENTRO_X,
          cy: CENTRO_Y,
          rx: radio,
          ry: radio * 0.94,
          fill: "none",
          stroke: COLOR.rejilla,
          "stroke-width": 1,
          "stroke-dasharray": "4 6",
        },
      })
    );
  });

  /* --- Globo informativo -------------------------------------------- */
  const tooltip = crear("div", { clase: "tooltip", atributos: { role: "tooltip" } });

  function mostrarTooltip(paciente, evento) {
    vaciar(tooltip);

    const filas = [
      ["RUT", paciente.rut],
      ["Visitas", `${paciente.visitas} en ${paciente.dias} días`],
      ["Monto", comoMoneda(paciente.monto)],
      ["Prestador", prestador.nombre],
    ];

    tooltip.appendChild(crear("p", { clase: "tooltip__titulo", texto: paciente.nombre }));

    filas.forEach(([clave, valor]) => {
      tooltip.appendChild(
        crear("div", {
          clase: "tooltip__fila",
          hijos: [
            crear("span", { clase: "tooltip__clave", texto: clave }),
            crear("span", { clase: "tooltip__valor", texto: valor }),
          ],
        })
      );
    });

    const limites = contenedor.getBoundingClientRect();
    const x = evento.clientX - limites.left + 16;
    const y = evento.clientY - limites.top + 16;
    const anchoTooltip = 240;

    tooltip.style.left = `${x + anchoTooltip > limites.width ? x - anchoTooltip - 32 : x}px`;
    tooltip.style.top = `${y}px`;
    tooltip.classList.add("esta-visible");
  }

  function ocultarTooltip() {
    tooltip.classList.remove("esta-visible");
  }

  /* --- Aristas ------------------------------------------------------- */
  posiciones.forEach(({ paciente, x, y }) => {
    const grosor = 1 + (paciente.visitas / maximoVisitas) * 4;

    const arista = crearSVG("line", {
      atributos: {
        x1: CENTRO_X,
        y1: CENTRO_Y,
        x2: x,
        y2: y,
        stroke: paciente.esCasoActual ? COLOR.critico : COLOR.violeta,
        "stroke-width": grosor,
        opacity: paciente.esCasoActual ? 0.9 : 0.45,
        "stroke-linecap": "round",
      },
    });

    /* Un pulso recorre la arista del caso en revisión. */
    if (paciente.esCasoActual) {
      arista.appendChild(
        crearSVG("animate", {
          atributos: {
            attributeName: "opacity",
            values: "0.9;0.35;0.9",
            dur: "2.2s",
            repeatCount: "indefinite",
          },
        })
      );
    }

    svg.appendChild(arista);

    /* Número de visitas rotulado junto a la arista. El texto se aparta en
       perpendicular para no quedar bajo el nodo ni bajo el cartel central. */
    const largo = Math.hypot(x - CENTRO_X, y - CENTRO_Y) || 1;

    /* Las aristas inferiores pasan junto al cartel del prestador, así que
       sus rótulos se apartan más y se sitúan más cerca del paciente. */
    const esInferior = y > CENTRO_Y;
    const separacion = esInferior ? 34 : 16;
    const avance = esInferior ? 0.78 : 0.5;

    const medioXAjustado = CENTRO_X + (x - CENTRO_X) * avance;
    const medioYAjustado = CENTRO_Y + (y - CENTRO_Y) * avance;

    const desvioX = (-(y - CENTRO_Y) / largo) * separacion;
    const desvioY = ((x - CENTRO_X) / largo) * separacion;

    svg.appendChild(
      crearSVG("text", {
        texto: `${paciente.visitas} visitas`,
        atributos: {
          x: medioXAjustado + desvioX,
          y: medioYAjustado + desvioY,
          fill: COLOR.textoMedio,
          "font-size": 10,
          "font-family": "monospace",
          "text-anchor": "middle",
          "dominant-baseline": "middle",
        },
      })
    );
  });

  /* --- Nodo central: el prestador ------------------------------------ */
  const halo = crearSVG("circle", {
    atributos: { cx: CENTRO_X, cy: CENTRO_Y, r: 46, fill: COLOR.violeta, opacity: 0.14 },
  });
  halo.appendChild(
    crearSVG("animate", {
      atributos: {
        attributeName: "r",
        values: "42;54;42",
        dur: "3s",
        repeatCount: "indefinite",
      },
    })
  );
  svg.appendChild(halo);

  svg.appendChild(
    crearSVG("circle", {
      atributos: {
        cx: CENTRO_X,
        cy: CENTRO_Y,
        r: 34,
        fill: COLOR.nodoPrestador,
        stroke: COLOR.violeta,
        "stroke-width": 2,
      },
    })
  );

  svg.appendChild(
    crearSVG("text", {
      texto: "PRESTADOR",
      atributos: {
        x: CENTRO_X,
        y: CENTRO_Y + 4,
        fill: COLOR.violetaClaro,
        "font-size": 10,
        "font-weight": "700",
        "font-family": "monospace",
        "text-anchor": "middle",
      },
    })
  );

  /* Cartel opaco bajo el nodo central: evita que el nombre del prestador
     se confunda con las aristas que pasan por detrás. */
  const anchoCartel = Math.max(prestador.nombre.length * 7.2, 150);

  svg.appendChild(
    crearSVG("rect", {
      atributos: {
        x: CENTRO_X - anchoCartel / 2,
        y: CENTRO_Y + 40,
        width: anchoCartel,
        height: 36,
        rx: 6,
        fill: COLOR.fondo,
        stroke: COLOR.rejilla,
        "stroke-width": 1,
      },
    })
  );

  svg.appendChild(
    crearSVG("text", {
      texto: prestador.nombre,
      atributos: {
        x: CENTRO_X,
        y: CENTRO_Y + 56,
        fill: COLOR.texto,
        "font-size": 13,
        "font-weight": "600",
        "text-anchor": "middle",
      },
    })
  );

  svg.appendChild(
    crearSVG("text", {
      texto: prestador.rut,
      atributos: {
        x: CENTRO_X,
        y: CENTRO_Y + 70,
        fill: COLOR.textoTenue,
        "font-size": 11,
        "font-family": "monospace",
        "text-anchor": "middle",
      },
    })
  );

  /* --- Nodos de pacientes -------------------------------------------- */
  posiciones.forEach(({ paciente, x, y }) => {
    const color = paciente.esCasoActual ? COLOR.critico : COLOR.violeta;

    const grupo = crearSVG("g", {
      clase: "nodo-red",
      atributos: {
        tabindex: "0",
        role: "button",
        "aria-label": `${paciente.nombre}, ${paciente.visitas} visitas en ${paciente.dias} días. Abrir el caso.`,
      },
    });

    grupo.appendChild(
      crearSVG("circle", {
        clase: "nodo-red__circulo",
        atributos: {
          cx: x,
          cy: y,
          r: 22,
          fill: paciente.esCasoActual ? COLOR.nodoCritico : COLOR.nodoVioleta,
          stroke: color,
          "stroke-width": 2,
        },
      })
    );

    /* Iniciales del paciente dentro del nodo. */
    const iniciales = paciente.nombre
      .split(" ")
      .filter((parte) => parte.length > 1)
      .slice(0, 2)
      .map((parte) => parte[0])
      .join("");

    grupo.appendChild(
      crearSVG("text", {
        texto: iniciales,
        atributos: {
          x,
          y: y + 4,
          fill: color,
          "font-size": 12,
          "font-weight": "700",
          "font-family": "monospace",
          "text-anchor": "middle",
        },
      })
    );

    /* Nombre bajo el nodo, desplazado según su posición en la órbita. */
    grupo.appendChild(
      crearSVG("text", {
        texto: paciente.nombre,
        atributos: {
          x,
          y: y < CENTRO_Y ? y - 32 : y + 40,
          fill: paciente.esCasoActual ? COLOR.critico : COLOR.textoMedio,
          "font-size": 11,
          "font-weight": paciente.esCasoActual ? "700" : "400",
          "text-anchor": "middle",
        },
      })
    );

    grupo.addEventListener("mousemove", (evento) => mostrarTooltip(paciente, evento));
    grupo.addEventListener("mouseleave", ocultarTooltip);

    if (alElegirCaso && !paciente.esCasoActual) {
      grupo.addEventListener("click", () => alElegirCaso(paciente.id));
      grupo.addEventListener("keydown", (evento) => {
        if (evento.key === "Enter" || evento.key === " ") {
          evento.preventDefault();
          alElegirCaso(paciente.id);
        }
      });
    }

    svg.appendChild(grupo);
  });

  contenedor.appendChild(
    crear("p", { clase: "grafico__titulo", texto: "Red de concentración sobre un mismo prestador" })
  );
  contenedor.appendChild(
    crear("p", {
      clase: "grafico__ayuda",
      texto:
        "El grosor de cada vínculo representa la cantidad de visitas. Pase el puntero sobre un nodo para ver el detalle.",
    })
  );
  contenedor.appendChild(svg);

  contenedor.appendChild(
    crear("div", {
      clase: "grafico__leyenda",
      hijos: [
        crearItemLeyenda(COLOR.critico, "Caso en revisión"),
        crearItemLeyenda(COLOR.violeta, "Pacientes con el mismo patrón"),
      ],
    })
  );

  contenedor.appendChild(tooltip);
  return contenedor;
}

/* Construye un elemento de la leyenda del grafo. */
function crearItemLeyenda(color, texto) {
  const muestra = crear("span", { clase: "grafico__muestra" });
  muestra.style.backgroundColor = color;

  return crear("span", {
    clase: "grafico__leyenda-item",
    hijos: [muestra, crear("span", { texto })],
  });
}

  Object.assign(REGISTRO, { crearGraficoCoalicion });
})();

(() => {
  const { crear, vaciar, icono } = REGISTRO;
/* =========================================================================
   LISA vigIA — Ventanas modales.
   Reemplazan a confirm() y prompt() manteniendo el estilo de la aplicación,
   el foco atrapado dentro del diálogo y el cierre con la tecla Escape.
   ========================================================================= */


const SELECTOR_FOCALIZABLE =
  'button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';

/* Solo existe un modal a la vez; se reutiliza el mismo nodo raíz. */
let raiz = null;
let cajaActual = null;
let elementoPrevio = null;

function obtenerRaiz() {
  if (!raiz) {
    raiz = crear("div", {
      clase: "modal",
      atributos: { role: "dialog", "aria-modal": "true", "aria-hidden": "true" },
    });

    /* Un clic sobre el velo, fuera de la caja, cierra el diálogo. */
    raiz.addEventListener("click", (evento) => {
      if (evento.target === raiz) {
        cerrarModal();
      }
    });

    document.body.appendChild(raiz);
  }
  return raiz;
}

/* Mantiene el tabulador dentro del diálogo mientras está abierto. */
function alPulsarTecla(evento) {
  if (evento.key === "Escape") {
    evento.preventDefault();
    cerrarModal();
    return;
  }

  if (evento.key !== "Tab" || !cajaActual) {
    return;
  }

  const focalizables = Array.from(cajaActual.querySelectorAll(SELECTOR_FOCALIZABLE));
  if (focalizables.length === 0) {
    return;
  }

  const primero = focalizables[0];
  const ultimo = focalizables[focalizables.length - 1];

  if (evento.shiftKey && document.activeElement === primero) {
    evento.preventDefault();
    ultimo.focus();
  } else if (!evento.shiftKey && document.activeElement === ultimo) {
    evento.preventDefault();
    primero.focus();
  }
}

/**
 * Abre un diálogo modal.
 * @param {object} opciones
 * @param {string} opciones.titulo Título visible del diálogo.
 * @param {string} [opciones.nombreIcono] Icono mostrado junto al título.
 * @param {Node[]} opciones.cuerpo Nodos que componen el contenido.
 * @param {Node[]} [opciones.acciones] Botones del pie del diálogo.
 * @returns {HTMLElement} La caja del modal, por si hay que consultarla.
 */
function abrirModal({ titulo, nombreIcono = "aviso", cuerpo, acciones = [] }) {
  const contenedor = obtenerRaiz();
  vaciar(contenedor);

  const idTitulo = "modal-titulo";

  const botonCerrar = crear("button", {
    clase: "modal__cerrar",
    atributos: { type: "button", "aria-label": "Cerrar ventana" },
    hijos: [icono("cerrar", { tamano: 18 })],
    eventos: { click: cerrarModal },
  });

  const cabecera = crear("header", {
    clase: "modal__cabecera",
    hijos: [
      icono(nombreIcono, { tamano: 22 }),
      crear("h2", { clase: "modal__titulo", texto: titulo, atributos: { id: idTitulo } }),
      botonCerrar,
    ],
  });

  const seccionCuerpo = crear("div", { clase: "modal__cuerpo", hijos: cuerpo });

  const caja = crear("div", {
    clase: "modal__caja",
    hijos: [
      cabecera,
      seccionCuerpo,
      acciones.length > 0 ? crear("footer", { clase: "modal__pie", hijos: acciones }) : null,
    ],
  });

  contenedor.setAttribute("aria-labelledby", idTitulo);
  contenedor.appendChild(caja);
  cajaActual = caja;
  elementoPrevio = document.activeElement;

  /* El siguiente cuadro permite que la transición CSS se aprecie. */
  window.requestAnimationFrame(() => {
    contenedor.classList.add("esta-visible");
    contenedor.setAttribute("aria-hidden", "false");

    const primero = caja.querySelector(SELECTOR_FOCALIZABLE);
    if (primero) {
      primero.focus();
    }
  });

  document.addEventListener("keydown", alPulsarTecla);
  return caja;
}

/** Cierra el diálogo abierto y devuelve el foco a su origen. */
function cerrarModal() {
  if (!raiz) {
    return;
  }

  raiz.classList.remove("esta-visible");
  raiz.setAttribute("aria-hidden", "true");
  document.removeEventListener("keydown", alPulsarTecla);
  cajaActual = null;

  if (elementoPrevio && typeof elementoPrevio.focus === "function") {
    elementoPrevio.focus();
  }
  elementoPrevio = null;
}

/**
 * Diálogo de confirmación con dos salidas, en reemplazo de confirm().
 * @param {object} opciones
 * @param {string} opciones.titulo
 * @param {string} opciones.mensaje
 * @param {string} [opciones.textoConfirmar]
 * @param {string} [opciones.textoCancelar]
 * @param {string} [opciones.estiloConfirmar] Clase modificadora del botón.
 * @param {string} [opciones.nombreIcono]
 * @param {Function} opciones.alConfirmar Se ejecuta al aceptar.
 */
function confirmar({
  titulo,
  mensaje,
  textoConfirmar = "Confirmar",
  textoCancelar = "Cancelar",
  estiloConfirmar = "boton--primario",
  nombreIcono = "aviso",
  alConfirmar,
}) {
  const botonCancelar = crear("button", {
    clase: ["boton", "boton--fantasma"],
    atributos: { type: "button" },
    texto: textoCancelar,
    eventos: { click: cerrarModal },
  });

  const botonConfirmar = crear("button", {
    clase: ["boton", estiloConfirmar],
    atributos: { type: "button" },
    texto: textoConfirmar,
    eventos: {
      click: () => {
        cerrarModal();
        alConfirmar();
      },
    },
  });

  abrirModal({
    titulo,
    nombreIcono,
    cuerpo: [crear("p", { texto: mensaje })],
    acciones: [botonCancelar, botonConfirmar],
  });
}

  Object.assign(REGISTRO, { abrirModal, cerrarModal, confirmar });
})();

(() => {
  const { crear, reemplazar, comoMoneda, esCorreoValido, marcaDeTiempo, icono, abrirModal, cerrarModal, confirmar, mostrarAviso } = REGISTRO;
/* =========================================================================
   LISA vigIA — Barra de decisión del analista.
   Concentra las tres acciones de cierre: emitir el reporte en PDF, enviarlo
   por correo y resolver si el caso continúa a liquidación o se deriva a
   investigación por fraude.
   ========================================================================= */





/* Nombre sugerido del archivo al guardar el reporte. */
function nombreArchivo(caso) {
  return `LISA-vigIA_Caso-${caso.numeroSiniestro}_${caso.beneficiario.replace(/\s+/g, "-")}.pdf`;
}

/**
 * Abre el diálogo de impresión del navegador.

 * ya adapta el reporte al formato A4.
 * @param {object} caso
 */
function emitirReporte(caso) {

    nombreIcono: "imprimir",

      "Se abrirá el cuadro de impresión del navegador con el reporte completo del caso. Elija \"Guardar como PDF\" en el destino para descargar el documento.",

/**

 */
function enviarPorCorreo(caso) {
  const campoCorreo = crear("input", {
    clase: "campo__control",
    atributos: {
      type: "email",
      id: "correo-destino",

    },

  const campoMensaje = crear("textarea", {

  });

  const error = crear("p", { clase: "campo__error", atributos: { role: "alert" } });

  const formulario = crear("form", {
    atributos: { novalidate: "novalidate", id: "formulario-correo" },
    hijos: [
      crear("div", {

/**
 * Construye la barra de decisión del reporte.
 * @param {object} opciones
 * @param {object} opciones.caso
 * @returns {HTMLElement}
 */
function crearBarraDecision({ caso }) {
  const barra = crear("section", { clase: ["decision", "no-imprimir"] });

  /* Sustituye la barra por el resultado una vez tomada la decisión. */
  const mostrarResolucion = (tipo) => {

  const texto = crear("div", {
    clase: "decision__texto",

  const acciones = crear("div", {

  barra.appendChild(texto);
  barra.appendChild(acciones);

  return barra;
}

/* Sección 3: patrones de comportamiento, con los dos gráficos. */
function crearSeccionPatrones(caso, alAbrirCaso) {
  const { desviacion, coalicion } = caso.evidencia.patrones;

  /* --- Bloque de desviación estadística ----------------------------- */
  const relacionados = casosAtipicos

          crear("span", { clase: "relacionado__monto", texto: comoMoneda(dato.monto) }),
        ],
        eventos: { click: () => alAbrirCaso(dato.idCaso) },
      })
    );

  const bloqueDesviacion = crear("div", {
    hijos: [
      crear("div", {
        clase: ["hallazgo", "hallazgo--critico"],

        ],
      }),
      crearGraficoDesviacion({
        poblacion: poblacionHistorica,
        atipicos: casosAtipicos,
        promedioReferencia: desviacion.promedio,
        alElegirCaso: alAbrirCaso,
      }),
      crear("div", {
        clase: "no-imprimir",
        hijos: [
          crear("p", {
            clase: "hallazgos__grupo-titulo",
            atributos: { style: "margin-top:2.4rem" },
            texto: "Casos con desviación similar",
          }),
          crear("div", { clase: "relacionados", hijos: relacionados }),
        ],
      }),
    ],
  });

  /* --- Bloque de coalición ------------------------------------------ */
  const bloqueCoalicion = crear("div", {
    atributos: { style: "margin-top:3.2rem" },
    hijos: [
      crear("div", {
        clase: ["hallazgo", "hallazgo--critico"],

        alElegirCaso: alAbrirCaso,
      }),
    ],
  });

  return crear("section", {
    clase: "panel",
    hijos: [
      crearCabeceraSeccion({
        titulo: "Análisis de patrones de comportamiento",
        nombreIcono: "red",

      crear("div", { clase: "panel__cuerpo", hijos: [bloqueDesviacion, bloqueCoalicion] }),
    ],
  });
}

/**
 * Construye la vista de reporte para un caso.
 * @param {object} opciones
 * @param {object} opciones.caso Caso que se está revisando.
 * @param {Function} opciones.alVolver Regresa al panel inicial.
 * @param {Function} opciones.alAbrirCaso Navega a otro caso.
 * @returns {HTMLElement}
 */
function crearVistaReporte({ caso, alVolver, alAbrirCaso }) {
  const volver = crear("button", {
    clase: ["volver", "no-imprimir"],
    atributos: { type: "button" },
    hijos: [icono("flechaIzquierda", { tamano: 16 }), crear("span", { texto: "Volver al panel" })],
    eventos: { click: alVolver },
  });

  const secciones = caso.evidencia
    ? [
        crearSeccionForense(caso),
        crearSeccionValidacion(caso),
        crearSeccionPatrones(caso, alAbrirCaso),
      ]
    : [crearAvisoSinEvidencia(caso)];

  return crear("div", {
    clase: "vista",
    hijos: [
      crearEncabezadoImpresion(caso),
      volver,
      crearFicha(caso),
      fragmento(secciones),
      /* Un caso cerrado ya no admite decisión: su resolución está tomada. */
      caso.estado === "cerrado" ? null : crearBarraDecision({ caso }),
    ],
  });
}

  Object.assign(REGISTRO, { crearVistaReporte });
})();

    .map((prestador) => {
      const propios = casos.filter((caso) => caso.rutPrestador === prestador.id);
      const criticos = propios.filter((caso) => caso.criticidad === "critico");
      const monto = propios.reduce((suma, caso) => suma + caso.monto, 0);
      const montoCritico = criticos.reduce((suma, caso) => suma + caso.monto, 0);

      /* El puntaje del prestador es el mayor de sus casos. */
      const puntajeMaximo = propios.reduce(
        (mayor, caso) => Math.max(mayor, caso.puntaje),
        0
      );

      return {
        ...prestador,
        casos: propios,
        totalCasos: propios.length,
        totalCriticos: criticos.length,
        monto,
        montoCritico,
        puntajeMaximo,
      };
    })
    .sort((uno, otro) => otro.montoCritico - uno.montoCritico);
}

/**

  const fraude = historialResoluciones.reduce((suma, mes) => suma + mes.fraude, 0);
  const liberados = historialResoluciones.reduce(
    (suma, mes) => suma + mes.liberados,
    0
  );
  const montoBloqueado = historialResoluciones.reduce(
    (suma, mes) => suma + mes.montoBloqueado,
    0
  );
  const procesados = historialResoluciones.reduce(
    (suma, mes) => suma + mes.procesados,
    0
  );

  const total = fraude + liberados;

  return {
    fraude,
    liberados,
    total,
    montoBloqueado,
    procesados,
    tasaFraude: (fraude / total) * 100,
    /* Proporción de siniestros que el modelo marca para revisión sobre el
       total que pasa por la canalización. */
    tasaDeteccion: (total / procesados) * 100,
  };
}

/**
 * Resume el estado de la cola documental.
 * @returns {object}
 */
function resumirCola() {
  const contar = (estado) =>
    colaDocumental.filter((documento) => documento.estado === estado).length;

  return {
    concluidos: contar("concluido"),
    analizando: contar("analizando"),
    enCola: contar("en_cola"),
    adulterados: colaDocumental.filter((d) => d.veredicto === "adulterado").length,
    total: colaDocumental.length,
  };
}

/**
 * Construye la red completa de la cartera: prestadores y beneficiarios.
 * @returns {object} Nodos y vínculos listos para dibujar.
 */
function construirRedCartera() {
  const resumen = resumirPrestadores().filter((prestador) => prestador.totalCasos > 0);

  const nodosPrestador = resumen.map((prestador) => ({
    id: prestador.id,
    etiqueta: prestador.nombre,
    tipo: "prestador",
    alerta: prestador.alerta,
    casos: prestador.totalCasos,
    criticos: prestador.totalCriticos,
    monto: prestador.monto,
  }));

  const vinculos = [];
  const nodosBeneficiario = [];

  resumen.forEach((prestador) => {
    prestador.casos.forEach((caso) => {
      nodosBeneficiario.push({
        id: caso.id,
        etiqueta: caso.beneficiario,
        rut: caso.rut,
        tipo: "beneficiario",
        criticidad: caso.criticidad,
        puntaje: caso.puntaje,
        monto: caso.monto,
        prestador: prestador.id,
      });

      vinculos.push({
        origen: prestador.id,
        destino: caso.id,
        criticidad: caso.criticidad,
      });
    });
  });

  return { nodosPrestador, nodosBeneficiario, vinculos, totalCriticos: casosCriticos.length };
}

})();

/* ===== src/js/components/grafoCartera.js ===== */
(() => {
  const { crear, crearSVG, vaciar, comoMoneda, paleta } = REGISTRO;
/* =========================================================================
   LISA vigIA — Grafo de la cartera completa.
   Cada prestador forma un núcleo con sus beneficiarios alrededor. El tamaño
   del núcleo refleja cuántos casos concentra y su color, el nivel de alerta,
   de modo que los focos de fraude se distinguen de un vistazo.
   ========================================================================= */
const ANCHO = 900;

/* Alto de cada fila de núcleos; el lienzo crece según cuántas hagan falta,
   de modo que no queden franjas vacías cuando hay pocos prestadores. */
const ALTO_FILA = 250;

/* Color de cada nivel de alerta del prestador, según el tema activo. */
const coloresAlerta = (COLOR) => ({
  critica: COLOR.critico,
  media: COLOR.medio,
  baja: COLOR.bajo,
});

/* Proporción vertical de la órbita: la achata para dejar sitio al cartel. */
const ACHATADO = 0.68;

/* Radio de la órbita de beneficiarios en torno a un núcleo. */
const radioOrbita = (cantidad) => Math.min(40 + cantidad * 4, 76);

/**
 * Dibuja la red de prestadores y beneficiarios de toda la cartera.
 * @param {object} opciones
 * @param {object[]} opciones.nodosPrestador
 * @param {object[]} opciones.nodosBeneficiario
 * @param {Function} [opciones.alElegirCaso] Recibe el id del caso.
 * @returns {HTMLElement}
 */function crearGrafoCartera({ nodosPrestador, nodosBeneficiario, alElegirCaso }) {
  const COLOR = paleta();
  const COLOR_ALERTA = coloresAlerta(COLOR);
  const contenedor = crear("div", { clase: "grafico" });

  /* Los prestadores se reparten en una retícula holgada, ordenados de mayor
     a menor concentración para que el foco principal quede a la izquierda. */
  const ordenados = [...nodosPrestador].sort((uno, otro) => otro.casos - uno.casos);
  const columnas = Math.min(ordenados.length, 3);
  const filas = Math.ceil(ordenados.length / columnas);

  const anchoCelda = ANCHO / columnas;
  const altoCelda = ALTO_FILA;
  const alto = filas * ALTO_FILA;

  const svg = crearSVG("svg", {
    clase: "grafico__lienzo",
    atributos: {
      viewBox: `0 0 ${ANCHO} ${alto}`,
      role: "img",
      "aria-label": `Red de la cartera: ${nodosPrestador.length} prestadores y ${nodosBeneficiario.length} beneficiarios.`,
    },
  });

  const centros = new Map();

  ordenados.forEach((prestador, indice) => {
    const columna = indice % columnas;
    const fila = Math.floor(indice / columnas);

    centros.set(prestador.id, {
      x: anchoCelda * (columna + 0.5),
      y: altoCelda * (fila + 0.5),
      prestador,
    });
  });

  /* --- Globo informativo -------------------------------------------- */
  const tooltip = crear("div", { clase: "tooltip", atributos: { role: "tooltip" } });

  function mostrarTooltip(titulo, filas, evento) {
    vaciar(tooltip);
    tooltip.appendChild(crear("p", { clase: "tooltip__titulo", texto: titulo }));

    filas.forEach(([clave, valor]) => {
      tooltip.appendChild(
        crear("div", {
          clase: "tooltip__fila",
          hijos: [
            crear("span", { clase: "tooltip__clave", texto: clave }),
            crear("span", { clase: "tooltip__valor", texto: valor }),
          ],
        })
      );
    });

    const limites = contenedor.getBoundingClientRect();
    const x = evento.clientX - limites.left + 16;
    const y = evento.clientY - limites.top + 16;
    const ancho = 240;

    tooltip.style.left = `${x + ancho > limites.width ? x - ancho - 32 : x}px`;
    tooltip.style.top = `${y}px`;
    tooltip.classList.add("esta-visible");
  }

  const ocultarTooltip = () => tooltip.classList.remove("esta-visible");

  /* --- Vínculos y beneficiarios -------------------------------------- */
  centros.forEach(({ x, y, prestador }) => {
    const propios = nodosBeneficiario.filter(
      (nodo) => nodo.prestador === prestador.id
    );

    const color = COLOR_ALERTA[prestador.alerta];
    const radio = radioOrbita(propios.length);

    propios.forEach((beneficiario, indice) => {
      const angulo = (Math.PI * 2 * indice) / propios.length - Math.PI / 2;
      const bx = x + Math.cos(angulo) * radio;
      /* La órbita se achata para reservar espacio al cartel del nombre. */
      const by = y + Math.sin(angulo) * radio * ACHATADO;

      const esCritico = beneficiario.criticidad === "critico";

      svg.appendChild(
        crearSVG("line", {
          atributos: {
            x1: x,
            y1: y,
            x2: bx,
            y2: by,
            stroke: esCritico ? color : COLOR.trazoTenue,
            "stroke-width": esCritico ? 1.6 : 1,
            opacity: esCritico ? 0.7 : 0.35,
          },
        })
      );

      const nodo = crearSVG("circle", {
        clase: "punto-dato",
        atributos: {
          cx: bx,
          cy: by,
          r: esCritico ? 7 : 5,
          fill: esCritico ? color : COLOR.nodoNeutro,
          stroke: esCritico ? COLOR.fondo : COLOR.nodoBorde,
          "stroke-width": 1.5,
          tabindex: "0",
          role: "button",
          "aria-label": `${beneficiario.etiqueta}, puntaje ${beneficiario.puntaje}. Abrir el caso.`,
        },
      });

      const detalle = [
        ["RUT", beneficiario.rut],
        ["Monto", comoMoneda(beneficiario.monto)],
        ["Scoring", `${beneficiario.puntaje}/100`],
        ["Criticidad", esCritico ? "Crítico" : "Leve"],
      ];

      nodo.addEventListener("mousemove", (evento) =>
        mostrarTooltip(beneficiario.etiqueta, detalle, evento)
      );
      nodo.addEventListener("mouseleave", ocultarTooltip);

      if (alElegirCaso) {
        nodo.addEventListener("click", () => alElegirCaso(beneficiario.id));
        nodo.addEventListener("keydown", (evento) => {
          if (evento.key === "Enter" || evento.key === " ") {
            evento.preventDefault();
            alElegirCaso(beneficiario.id);
          }
        });
      }

      svg.appendChild(nodo);
    });
  });

  /* --- Núcleos de prestador ------------------------------------------ */
  centros.forEach(({ x, y, prestador }) => {
    const color = COLOR_ALERTA[prestador.alerta];
    const radioNucleo = 16 + Math.min(prestador.casos, 6) * 2.6;

    /* El foco crítico late para atraer la mirada. */
    if (prestador.alerta === "critica") {
      const halo = crearSVG("circle", {
        atributos: { cx: x, cy: y, r: radioNucleo + 12, fill: color, opacity: 0.16 },
      });
      halo.appendChild(
        crearSVG("animate", {
          atributos: {
            attributeName: "r",
            values: `${radioNucleo + 8};${radioNucleo + 20};${radioNucleo + 8}`,
            dur: "3s",
            repeatCount: "indefinite",
          },
        })
      );
      svg.appendChild(halo);
    }

    const nucleo = crearSVG("circle", {
      clase: "punto-dato",
      atributos: {
        cx: x,
        cy: y,
        r: radioNucleo,
        fill: COLOR.nucleo,
        stroke: color,
        "stroke-width": prestador.alerta === "critica" ? 3 : 2,
        tabindex: "0",
        "aria-label": `${prestador.etiqueta}: ${prestador.casos} casos, ${prestador.criticos} críticos.`,
      },
    });

    nucleo.addEventListener("mousemove", (evento) =>
      mostrarTooltip(prestador.etiqueta, [
        ["RUT", prestador.id],
        ["Casos", String(prestador.casos)],
        ["Críticos", String(prestador.criticos)],
        ["Monto", comoMoneda(prestador.monto)],
      ], evento)
    );
    nucleo.addEventListener("mouseleave", ocultarTooltip);
    svg.appendChild(nucleo);

    svg.appendChild(
      crearSVG("text", {
        texto: String(prestador.casos),
        atributos: {
          x,
          y: y + 4,
          fill: color,
          "font-size": 13,
          "font-weight": "700",
          "font-family": "monospace",
          "text-anchor": "middle",
        },
      })
    );

    /* Cartel con el nombre, sobre fondo opaco para separarlo del grafo. */
    const etiqueta = prestador.etiqueta;
    const anchoCartel = Math.max(etiqueta.length * 6.4, 120);

    /* El cartel se sitúa por debajo de la órbita, no del núcleo, para que
       ningún beneficiario quede tapado por el nombre del prestador. */
    const propios = nodosBeneficiario.filter((nodo) => nodo.prestador === prestador.id);
    const yCartel = y + radioOrbita(propios.length) * ACHATADO + 18;

    svg.appendChild(
      crearSVG("rect", {
        atributos: {
          x: x - anchoCartel / 2,
          y: yCartel,
          width: anchoCartel,
          height: 20,
          rx: 5,
          fill: COLOR.fondo,
          stroke: COLOR.rejilla,
          "stroke-width": 1,
        },
      })
    );

    svg.appendChild(
      crearSVG("text", {
        texto: etiqueta,
        atributos: {
          x,
          y: yCartel + 14,
          fill: COLOR.texto,
          "font-size": 11,
          "font-weight": "600",
          "text-anchor": "middle",
        },
      })
    );
  });

  contenedor.appendChild(
    crear("p", {
      clase: "grafico__titulo",
      texto: "Mapa de vínculos entre prestadores y beneficiarios",
    })
  );
  contenedor.appendChild(
    crear("p", {
      clase: "grafico__ayuda",
      texto:
        "El tamaño del núcleo indica cuántos casos concentra el prestador. Pase el puntero sobre cualquier nodo para ver el detalle.",
    })
  );
  contenedor.appendChild(svg);

  contenedor.appendChild(
    crear("div", {
      clase: "grafico__leyenda",
      hijos: [
        crearItemLeyenda(COLOR_ALERTA.critica, "Concentración crítica"),
        crearItemLeyenda(COLOR_ALERTA.media, "Bajo vigilancia"),
        crearItemLeyenda(COLOR_ALERTA.baja, "Sin hallazgos"),
      ],
    })
  );

  contenedor.appendChild(tooltip);
  return contenedor;
}

  const muestra = crear("span", { clase: "grafico__muestra" });

  return crear("span", {
    clase: "grafico__leyenda-item",
    hijos: [muestra, crear("span", { texto })],
  });
}

  Object.assign(REGISTRO, { crearGrafoCartera });
})();
