(() => {
  const { crear, crearSVG, vaciar, comoMoneda } = REGISTRO;
/* =========================================================================
   LISA vigIA — Gráfico de dispersión de montos.
   Sitúa cada siniestro sobre la banda de ±1σ y ±2σ del promedio histórico
   para que los cuatro casos atípicos queden visualmente fuera del rango.
   El globo informativo se muestra al posar el puntero sobre cada punto.
   ========================================================================= */


/* Lienzo en unidades de usuario; el SVG escala con el contenedor. */
const ANCHO = 760;
const ALTO = 340;
const MARGEN = { arriba: 24, derecha: 24, abajo: 42, izquierda: 78 };

const ANCHO_TRAMA = ANCHO - MARGEN.izquierda - MARGEN.derecha;
const ALTO_TRAMA = ALTO - MARGEN.arriba - MARGEN.abajo;

/* Calcula media y desviación estándar de una serie de montos. */
function calcularEstadisticos(montos) {
  const media = montos.reduce((suma, valor) => suma + valor, 0) / montos.length;
  const varianza =
    montos.reduce((suma, valor) => suma + (valor - media) ** 2, 0) / montos.length;
  return { media, desviacion: Math.sqrt(varianza) };
}

/**
 * Dibuja el gráfico de desviación.
 * @param {object} opciones
 * @param {object[]} opciones.poblacion Casos dentro del rango esperado.
 * @param {object[]} opciones.atipicos Casos que se salen de la banda.
 * @param {number} [opciones.promedioReferencia] Promedio histórico oficial.
 * @param {Function} [opciones.alElegirCaso] Recibe el id de un atípico.
 * @returns {HTMLElement}
 */
function crearGraficoDesviacion({
  poblacion,
  atipicos,
  promedioReferencia,
  alElegirCaso,
}) {
  const estadisticos = calcularEstadisticos(poblacion.map((dato) => dato.monto));
  const { desviacion } = estadisticos;

  /* Se rotula el promedio histórico declarado por el modelo de riesgo; la
     media de la muestra solo se usa para dimensionar la banda. */
  const media = promedioReferencia ?? estadisticos.media;

  /* La escala vertical llega algo más allá del mayor atípico. */
  const montoMaximo = Math.max(...atipicos.map((dato) => dato.monto)) * 1.12;

  /* Escala de raíz cuadrada: comprime la parte alta del eje para que la
     banda de desviación siga siendo legible junto a montos diez veces
     mayores, sin perder de vista lo lejos que quedan los atípicos. */
  const escalaY = (monto) =>
    ALTO_TRAMA - Math.sqrt(Math.max(monto, 0) / montoMaximo) * ALTO_TRAMA;

  /* Los atípicos se intercalan entre la población para que la comparación
     sea inmediata, en lugar de agruparse todos al final del eje. */
  const total = poblacion.length + atipicos.length;
  const escalaX = (indice) => (ANCHO_TRAMA / (total + 1)) * (indice + 1);

  /* Posiciones repartidas de forma regular para los cuatro atípicos. */
  const posicionAtipico = (indice) =>
    Math.round(((indice + 1) * total) / (atipicos.length + 1));

  const svg = crearSVG("svg", {
    clase: "grafico__lienzo",
    atributos: {
      viewBox: `0 0 ${ANCHO} ${ALTO}`,
      role: "img",
      "aria-label":
        "Dispersión de montos por siniestro: la banda sombreada marca el rango esperado y cuatro casos quedan muy por encima.",
    },
  });

  const trama = crearSVG("g", {
    atributos: { transform: `translate(${MARGEN.izquierda}, ${MARGEN.arriba})` },
  });

  /* --- Bandas de desviación ---------------------------------------- */
  const bandas = [
    { factor: 2, opacidad: 0.06 },
    { factor: 1, opacidad: 0.1 },
  ];

  bandas.forEach(({ factor, opacidad }) => {
    const superior = escalaY(media + desviacion * factor);
    const inferior = escalaY(Math.max(media - desviacion * factor, 0));

    trama.appendChild(
      crearSVG("rect", {
        atributos: {
          x: 0,
          y: superior,
          width: ANCHO_TRAMA,
          height: Math.max(inferior - superior, 1),
          fill: "#6ea8d8",
          opacity: opacidad,
          rx: 4,
        },
      })
    );
  });

  /* --- Línea del promedio histórico -------------------------------- */
  trama.appendChild(
    crearSVG("line", {
      atributos: {
        x1: 0,
        y1: escalaY(media),
        x2: ANCHO_TRAMA,
        y2: escalaY(media),
        stroke: "#6ea8d8",
        "stroke-width": 1.5,
        "stroke-dasharray": "6 4",
      },
    })
  );

  trama.appendChild(
    crearSVG("text", {
      texto: `Promedio histórico ${comoMoneda(media)}`,
      atributos: {
        x: 6,
        y: escalaY(media) - 8,
        fill: "#6ea8d8",
        "font-size": 11,
        "font-family": "monospace",
      },
    })
  );

  /* --- Eje vertical con marcas de monto -----------------------------
     Los valores se eligen a mano porque la escala no es lineal: así el
     eje conserva cifras redondas y suficiente detalle en la zona baja. */
  const marcasEje = [0, 50000, 150000, 400000, 700000, 1000000].filter(
    (monto) => monto <= montoMaximo
  );

  marcasEje.forEach((monto) => {
    const y = escalaY(monto);

    trama.appendChild(
      crearSVG("line", {
        atributos: {
          x1: 0,
          y1: y,
          x2: ANCHO_TRAMA,
          y2: y,
          stroke: "#26262e",
          "stroke-width": 1,
        },
      })
    );

    trama.appendChild(
      crearSVG("text", {
        texto: `$${Math.round(monto / 1000)}k`,
        atributos: {
          x: -12,
          y: y + 4,
          fill: "#6e6e7c",
          "font-size": 11,
          "font-family": "monospace",
          "text-anchor": "end",
        },
      })
    );
  });

  /* --- Globo informativo -------------------------------------------- */
  const tooltip = crear("div", { clase: "tooltip", atributos: { role: "tooltip" } });

  /* Rellena y posiciona el globo respecto del contenedor del gráfico. */
  function mostrarTooltip(dato, evento, contenedor) {
    vaciar(tooltip);

    const filas = [
      ["RUT", dato.rut],
      ["Documento", dato.documento],
      ["Monto", comoMoneda(dato.monto)],
      ["Prestación", dato.prestacion],
      ["Fecha", dato.fecha],
    ];

    tooltip.appendChild(crear("p", { clase: "tooltip__titulo", texto: dato.nombre }));

    filas.forEach(([clave, valor]) => {
      tooltip.appendChild(
        crear("div", {
          clase: "tooltip__fila",
          hijos: [
            crear("span", { clase: "tooltip__clave", texto: clave }),
            crear("span", { clase: "tooltip__valor", texto: valor }),
          ],
        })
      );
    });

    const limites = contenedor.getBoundingClientRect();
    const x = evento.clientX - limites.left + 16;
    const y = evento.clientY - limites.top + 16;

    /* Se corrige la posición para que el globo no rebase el panel. */
    const anchoTooltip = 240;
    const desbordaDerecha = x + anchoTooltip > limites.width;

    tooltip.style.left = `${desbordaDerecha ? x - anchoTooltip - 32 : x}px`;
    tooltip.style.top = `${y}px`;
    tooltip.classList.add("esta-visible");
  }

  function ocultarTooltip() {
    tooltip.classList.remove("esta-visible");
  }

  /* --- Puntos de la población de referencia ------------------------- */
  const contenedor = crear("div", { clase: "grafico" });

  /* Índices que ocuparán los atípicos, para no solaparlos con el resto. */
  const indicesAtipicos = new Set(atipicos.map((_, indice) => posicionAtipico(indice)));

  /* Cada punto de la población toma la siguiente ranura libre del eje. */
  const ranurasPoblacion = [];
  for (let ranura = 0, asignadas = 0; asignadas < poblacion.length; ranura += 1) {
    if (!indicesAtipicos.has(ranura)) {
      ranurasPoblacion.push(ranura);
      asignadas += 1;
    }
  }

  poblacion.forEach((dato, indice) => {
    const punto = crearSVG("circle", {
      clase: "punto-dato",
      atributos: {
        cx: escalaX(ranurasPoblacion[indice]),
        cy: escalaY(dato.monto),
        r: 5,
        fill: "#3d4a5c",
        stroke: "#6ea8d8",
        "stroke-width": 1.5,
      },
    });

    punto.addEventListener("mousemove", (evento) => mostrarTooltip(dato, evento, contenedor));
    punto.addEventListener("mouseleave", ocultarTooltip);
    trama.appendChild(punto);
  });

  /* --- Puntos atípicos ---------------------------------------------- */
  atipicos.forEach((dato, indice) => {
    const cx = escalaX(posicionAtipico(indice));
    const cy = escalaY(dato.monto);

    /* Halo que resalta el punto correspondiente al caso en pantalla. */
    if (dato.esCasoActual) {
      const halo = crearSVG("circle", {
        atributos: { cx, cy, r: 14, fill: "#f2857f", opacity: 0.18 },
      });
      halo.appendChild(
        crearSVG("animate", {
          atributos: {
            attributeName: "r",
            values: "12;18;12",
            dur: "2.4s",
            repeatCount: "indefinite",
          },
        })
      );
      trama.appendChild(halo);
    }

    /* Línea vertical que enfatiza la distancia respecto del promedio. */
    trama.appendChild(
      crearSVG("line", {
        atributos: {
          x1: cx,
          y1: cy,
          x2: cx,
          y2: escalaY(media),
          stroke: "#f2857f",
          "stroke-width": 1,
          "stroke-dasharray": "3 3",
          opacity: 0.5,
        },
      })
    );

    const punto = crearSVG("circle", {
      clase: "punto-dato",
      atributos: {
        cx,
        cy,
        r: dato.esCasoActual ? 8 : 7,
        fill: "#f2857f",
        stroke: "#0a0a0c",
        "stroke-width": 2,
        tabindex: "0",
        role: "button",
        "aria-label": `${dato.nombre}, monto ${comoMoneda(dato.monto)}. Abrir el caso.`,
      },
    });

    punto.addEventListener("mousemove", (evento) => mostrarTooltip(dato, evento, contenedor));
    punto.addEventListener("mouseleave", ocultarTooltip);

    /* El punto también da acceso directo al caso relacionado. */
    if (alElegirCaso && dato.idCaso && !dato.esCasoActual) {
      punto.addEventListener("click", () => alElegirCaso(dato.idCaso));
      punto.addEventListener("keydown", (evento) => {
        if (evento.key === "Enter" || evento.key === " ") {
          evento.preventDefault();
          alElegirCaso(dato.idCaso);
        }
      });
    }

    trama.appendChild(punto);
  });

  svg.appendChild(trama);

  /* --- Leyenda ------------------------------------------------------ */
  const leyenda = crear("div", {
    clase: "grafico__leyenda",
    hijos: [
      crearItemLeyenda("#6ea8d8", "Siniestros dentro del rango esperado"),
      crearItemLeyenda("#f2857f", "Casos fuera de la desviación (4)"),
      crearItemLeyenda("rgba(110,168,216,.35)", "Banda de ±1σ y ±2σ", true),
    ],
  });

  contenedor.appendChild(
    crear("p", { clase: "grafico__titulo", texto: "Dispersión de montos frente al promedio histórico" })
  );
  contenedor.appendChild(
    crear("p", {
      clase: "grafico__ayuda",
      texto: "Pase el puntero sobre un punto para ver el detalle del siniestro.",
    })
  );
  contenedor.appendChild(svg);
  contenedor.appendChild(leyenda);
  contenedor.appendChild(tooltip);

  return contenedor;
}

/* Construye un elemento de la leyenda del gráfico. */
function crearItemLeyenda(color, texto, esBanda = false) {
  const muestra = crear("span", { clase: "grafico__muestra" });
  muestra.style.backgroundColor = color;
  if (esBanda) {
    muestra.style.borderRadius = "0.2rem";
  }

  return crear("span", {
    clase: "grafico__leyenda-item",
    hijos: [muestra, crear("span", { texto })],
  });
}

/* ===== src/js/components/graficoCoalicion.js ===== */
(() => {
  const { crear, crearSVG, vaciar, comoMoneda } = REGISTRO;
/* =========================================================================
   LISA vigIA — Grafo de coalición.
   Dispone el prestador en el centro y a su alrededor los pacientes que
   repiten visitas. El grosor de cada arista refleja el número de visitas,
   de modo que la concentración del patrón se aprecia de un vistazo.
   ========================================================================= */


const ANCHO = 760;
const ALTO = 460;
const CENTRO_X = ANCHO / 2;
/* El centro se sitúa algo por encima del medio: la mitad inferior necesita
   más espacio para los rótulos de los nodos y el cartel del prestador. */
const CENTRO_Y = 200;
const RADIO_ORBITA = 150;

/**
 * Dibuja la red de coalición entre un prestador y sus pacientes.
 * @param {object} opciones
 * @param {object} opciones.prestador Nodo central.
 * @param {object[]} opciones.pacientes Nodos periféricos.
 * @param {Function} [opciones.alElegirCaso] Recibe el id del caso elegido.
 * @returns {HTMLElement}
 */
function crearGraficoCoalicion({ prestador, pacientes, alElegirCaso }) {
  const contenedor = crear("div", { clase: "grafico" });

  const svg = crearSVG("svg", {
    clase: "grafico__lienzo",
    atributos: {
      viewBox: `0 0 ${ANCHO} ${ALTO}`,
      role: "img",
      "aria-label": `Red de coalición: ${pacientes.length} pacientes concentran sus visitas en el prestador ${prestador.nombre}.`,
    },
  });

  const maximoVisitas = Math.max(...pacientes.map((paciente) => paciente.visitas));

  /* Reparte los pacientes en círculo alrededor del prestador. La órbita se
     estira en vertical para dejar libre la franja del cartel central. */
  const posiciones = pacientes.map((paciente, indice) => {
    const angulo = (Math.PI * 2 * indice) / pacientes.length - Math.PI / 2;
    const seno = Math.sin(angulo);

    return {
      paciente,
      x: CENTRO_X + Math.cos(angulo) * RADIO_ORBITA,
      /* Los nodos por debajo del centro se alejan algo más para que sus
         rótulos no queden bajo el cartel con el nombre del prestador. */
      y: CENTRO_Y + seno * RADIO_ORBITA * (seno > 0 ? 1.06 : 0.82),
    };
  });

  /* --- Anillos de referencia ---------------------------------------- */
  [RADIO_ORBITA * 0.55, RADIO_ORBITA].forEach((radio) => {
    svg.appendChild(
      crearSVG("ellipse", {
        atributos: {
          cx: CENTRO_X,
          cy: CENTRO_Y,
          rx: radio,
          ry: radio * 0.94,
          fill: "none",
          stroke: "#26262e",
          "stroke-width": 1,
          "stroke-dasharray": "4 6",
        },
      })
    );
  });

  /* --- Globo informativo -------------------------------------------- */
  const tooltip = crear("div", { clase: "tooltip", atributos: { role: "tooltip" } });

  function mostrarTooltip(paciente, evento) {
    vaciar(tooltip);

    const filas = [
      ["RUT", paciente.rut],
      ["Visitas", `${paciente.visitas} en ${paciente.dias} días`],
      ["Monto", comoMoneda(paciente.monto)],
      ["Prestador", prestador.nombre],
    ];

    tooltip.appendChild(crear("p", { clase: "tooltip__titulo", texto: paciente.nombre }));

    filas.forEach(([clave, valor]) => {
      tooltip.appendChild(
        crear("div", {
          clase: "tooltip__fila",
          hijos: [
            crear("span", { clase: "tooltip__clave", texto: clave }),
            crear("span", { clase: "tooltip__valor", texto: valor }),
          ],
        })
      );
    });

    const limites = contenedor.getBoundingClientRect();
    const x = evento.clientX - limites.left + 16;
    const y = evento.clientY - limites.top + 16;
    const anchoTooltip = 240;

    tooltip.style.left = `${x + anchoTooltip > limites.width ? x - anchoTooltip - 32 : x}px`;
    tooltip.style.top = `${y}px`;
    tooltip.classList.add("esta-visible");
  }

  function ocultarTooltip() {
    tooltip.classList.remove("esta-visible");
  }

  /* --- Aristas ------------------------------------------------------- */
  posiciones.forEach(({ paciente, x, y }) => {
    const grosor = 1 + (paciente.visitas / maximoVisitas) * 4;

    const arista = crearSVG("line", {
      atributos: {
        x1: CENTRO_X,
        y1: CENTRO_Y,
        x2: x,
        y2: y,
        stroke: paciente.esCasoActual ? "#f2857f" : "#7c6ce0",
        "stroke-width": grosor,
        opacity: paciente.esCasoActual ? 0.9 : 0.45,
        "stroke-linecap": "round",
      },
    });

    /* Un pulso recorre la arista del caso en revisión. */
    if (paciente.esCasoActual) {
      arista.appendChild(
        crearSVG("animate", {
          atributos: {
            attributeName: "opacity",
            values: "0.9;0.35;0.9",
            dur: "2.2s",
            repeatCount: "indefinite",
          },
        })
      );
    }

    svg.appendChild(arista);

    /* Número de visitas rotulado junto a la arista. El texto se aparta en
       perpendicular para no quedar bajo el nodo ni bajo el cartel central. */
    const largo = Math.hypot(x - CENTRO_X, y - CENTRO_Y) || 1;

    /* Las aristas inferiores pasan junto al cartel del prestador, así que
       sus rótulos se apartan más y se sitúan más cerca del paciente. */
    const esInferior = y > CENTRO_Y;
    const separacion = esInferior ? 30 : 16;
    const avance = esInferior ? 0.62 : 0.5;

    const medioXAjustado = CENTRO_X + (x - CENTRO_X) * avance;
    const medioYAjustado = CENTRO_Y + (y - CENTRO_Y) * avance;

    const desvioX = (-(y - CENTRO_Y) / largo) * separacion;
    const desvioY = ((x - CENTRO_X) / largo) * separacion;

    svg.appendChild(
      crearSVG("text", {
        texto: `${paciente.visitas} visitas`,
        atributos: {
          x: medioXAjustado + desvioX,
          y: medioYAjustado + desvioY,
          fill: "#a0a0ae",
          "font-size": 10,
          "font-family": "monospace",
          "text-anchor": "middle",
          "dominant-baseline": "middle",
        },
      })
    );
  });

  /* --- Nodo central: el prestador ------------------------------------ */
  const halo = crearSVG("circle", {
    atributos: { cx: CENTRO_X, cy: CENTRO_Y, r: 46, fill: "#7c6ce0", opacity: 0.14 },
  });
  halo.appendChild(
    crearSVG("animate", {
      atributos: {
        attributeName: "r",
        values: "42;54;42",
        dur: "3s",
        repeatCount: "indefinite",
      },
    })
  );
  svg.appendChild(halo);

  svg.appendChild(
    crearSVG("circle", {
      atributos: {
        cx: CENTRO_X,
        cy: CENTRO_Y,
        r: 34,
        fill: "#241f3d",
        stroke: "#7c6ce0",
        "stroke-width": 2,
      },
    })
  );

  svg.appendChild(
    crearSVG("text", {
      texto: "PRESTADOR",
      atributos: {
        x: CENTRO_X,
        y: CENTRO_Y + 4,
        fill: "#b9aef5",
        "font-size": 10,
        "font-weight": "700",
        "font-family": "monospace",
        "text-anchor": "middle",
      },
    })
  );

  /* Cartel opaco bajo el nodo central: evita que el nombre del prestador
     se confunda con las aristas que pasan por detrás. */
  const anchoCartel = Math.max(prestador.nombre.length * 7.2, 150);

  svg.appendChild(
    crearSVG("rect", {
      atributos: {
        x: CENTRO_X - anchoCartel / 2,
        y: CENTRO_Y + 40,
        width: anchoCartel,
        height: 36,
        rx: 6,
        fill: "#0a0a0c",
        stroke: "#26262e",
        "stroke-width": 1,
      },
    })
  );

  svg.appendChild(
    crearSVG("text", {
      texto: prestador.nombre,
      atributos: {
        x: CENTRO_X,
        y: CENTRO_Y + 56,
        fill: "#f2f2f5",
        "font-size": 13,
        "font-weight": "600",
        "text-anchor": "middle",
      },
    })
  );

  svg.appendChild(
    crearSVG("text", {
      texto: prestador.rut,
      atributos: {
        x: CENTRO_X,
        y: CENTRO_Y + 70,
        fill: "#6e6e7c",
        "font-size": 11,
        "font-family": "monospace",
        "text-anchor": "middle",
      },
    })
  );

  /* --- Nodos de pacientes -------------------------------------------- */
  posiciones.forEach(({ paciente, x, y }) => {
    const color = paciente.esCasoActual ? "#f2857f" : "#7c6ce0";

    const grupo = crearSVG("g", {
      clase: "nodo-red",
      atributos: {
        tabindex: "0",
        role: "button",
        "aria-label": `${paciente.nombre}, ${paciente.visitas} visitas en ${paciente.dias} días. Abrir el caso.`,
      },
    });

    grupo.appendChild(
      crearSVG("circle", {
        clase: "nodo-red__circulo",
        atributos: {
          cx: x,
          cy: y,
          r: 22,
          fill: paciente.esCasoActual ? "#3a1f22" : "#1d1b2e",
          stroke: color,
          "stroke-width": 2,
        },
      })
    );

    /* Iniciales del paciente dentro del nodo. */
    const iniciales = paciente.nombre
      .split(" ")
      .filter((parte) => parte.length > 1)
      .slice(0, 2)
      .map((parte) => parte[0])
      .join("");

    grupo.appendChild(
      crearSVG("text", {
        texto: iniciales,
        atributos: {
          x,
          y: y + 4,
          fill: color,
          "font-size": 12,
          "font-weight": "700",
          "font-family": "monospace",
          "text-anchor": "middle",
        },
      })
    );

    /* Nombre bajo el nodo, desplazado según su posición en la órbita. */
    grupo.appendChild(
      crearSVG("text", {
        texto: paciente.nombre,
        atributos: {
          x,
          y: y < CENTRO_Y ? y - 32 : y + 40,
          fill: paciente.esCasoActual ? "#f2857f" : "#a0a0ae",
          "font-size": 11,
          "font-weight": paciente.esCasoActual ? "700" : "400",
          "text-anchor": "middle",
        },
      })
    );

    grupo.addEventListener("mousemove", (evento) => mostrarTooltip(paciente, evento));
    grupo.addEventListener("mouseleave", ocultarTooltip);

    if (alElegirCaso && !paciente.esCasoActual) {
      grupo.addEventListener("click", () => alElegirCaso(paciente.id));
      grupo.addEventListener("keydown", (evento) => {
        if (evento.key === "Enter" || evento.key === " ") {
          evento.preventDefault();
          alElegirCaso(paciente.id);
        }
      });
    }

    svg.appendChild(grupo);
  });

  contenedor.appendChild(
    crear("p", { clase: "grafico__titulo", texto: "Red de concentración sobre un mismo prestador" })
  );
  contenedor.appendChild(
    crear("p", {
      clase: "grafico__ayuda",
      texto:
        "El grosor de cada vínculo representa la cantidad de visitas. Pase el puntero sobre un nodo para ver el detalle.",
    })
  );
  contenedor.appendChild(svg);

  contenedor.appendChild(
    crear("div", {
      clase: "grafico__leyenda",
      hijos: [
        crearItemLeyenda("#f2857f", "Caso en revisión"),
        crearItemLeyenda("#7c6ce0", "Pacientes con el mismo patrón"),
      ],
    })
  );

  contenedor.appendChild(tooltip);
  return contenedor;
}

/* Construye un elemento de la leyenda del grafo. */
function crearItemLeyenda(color, texto) {
  const muestra = crear("span", { clase: "grafico__muestra" });
  muestra.style.backgroundColor = color;

  return crear("span", {
    clase: "grafico__leyenda-item",
    hijos: [muestra, crear("span", { texto })],
  });
}

  Object.assign(REGISTRO, { crearGraficoCoalicion });
})();

/* ===== src/js/components/modal.js ===== */
(() => {
  const { crear, vaciar, icono } = REGISTRO;
/* =========================================================================
   LISA vigIA — Ventanas modales.
   Reemplazan a confirm() y prompt() manteniendo el estilo de la aplicación,
   el foco atrapado dentro del diálogo y el cierre con la tecla Escape.
   ========================================================================= */


const SELECTOR_FOCALIZABLE =
  'button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';

/* Solo existe un modal a la vez; se reutiliza el mismo nodo raíz. */
let raiz = null;
let cajaActual = null;
let elementoPrevio = null;

function obtenerRaiz() {
  if (!raiz) {
    raiz = crear("div", {
      clase: "modal",
      atributos: { role: "dialog", "aria-modal": "true", "aria-hidden": "true" },
    });

    /* Un clic sobre el velo, fuera de la caja, cierra el diálogo. */
    raiz.addEventListener("click", (evento) => {
      if (evento.target === raiz) {
        cerrarModal();
      }
    });

    document.body.appendChild(raiz);
  }
  return raiz;
}

/* Mantiene el tabulador dentro del diálogo mientras está abierto. */
function alPulsarTecla(evento) {
  if (evento.key === "Escape") {
    evento.preventDefault();
    cerrarModal();
    return;
  }

  if (evento.key !== "Tab" || !cajaActual) {
    return;
  }

  const focalizables = Array.from(cajaActual.querySelectorAll(SELECTOR_FOCALIZABLE));
  if (focalizables.length === 0) {
    return;
  }

  const primero = focalizables[0];
  const ultimo = focalizables[focalizables.length - 1];

  if (evento.shiftKey && document.activeElement === primero) {
    evento.preventDefault();
    ultimo.focus();
  } else if (!evento.shiftKey && document.activeElement === ultimo) {
    evento.preventDefault();
    primero.focus();
  }
}

/**
 * Abre un diálogo modal.
 * @param {object} opciones
 * @param {string} opciones.titulo Título visible del diálogo.
 * @param {string} [opciones.nombreIcono] Icono mostrado junto al título.
 * @param {Node[]} opciones.cuerpo Nodos que componen el contenido.
 * @param {Node[]} [opciones.acciones] Botones del pie del diálogo.
 * @returns {HTMLElement} La caja del modal, por si hay que consultarla.
 */
function abrirModal({ titulo, nombreIcono = "aviso", cuerpo, acciones = [] }) {
  const contenedor = obtenerRaiz();
  vaciar(contenedor);

  const idTitulo = "modal-titulo";

  const botonCerrar = crear("button", {
    clase: "modal__cerrar",
    atributos: { type: "button", "aria-label": "Cerrar ventana" },
    hijos: [icono("cerrar", { tamano: 18 })],
    eventos: { click: cerrarModal },
  });

  const cabecera = crear("header", {
    clase: "modal__cabecera",
    hijos: [
      icono(nombreIcono, { tamano: 22 }),
      crear("h2", { clase: "modal__titulo", texto: titulo, atributos: { id: idTitulo } }),
      botonCerrar,
    ],
  });

  const seccionCuerpo = crear("div", { clase: "modal__cuerpo", hijos: cuerpo });

  const caja = crear("div", {
    clase: "modal__caja",
    hijos: [
      cabecera,
      seccionCuerpo,
      acciones.length > 0 ? crear("footer", { clase: "modal__pie", hijos: acciones }) : null,
    ],
  });

  contenedor.setAttribute("aria-labelledby", idTitulo);
  contenedor.appendChild(caja);
  cajaActual = caja;
  elementoPrevio = document.activeElement;

  /* El siguiente cuadro permite que la transición CSS se aprecie. */
  window.requestAnimationFrame(() => {
    contenedor.classList.add("esta-visible");
    contenedor.setAttribute("aria-hidden", "false");

    const primero = caja.querySelector(SELECTOR_FOCALIZABLE);
    if (primero) {
      primero.focus();
    }
  });

  document.addEventListener("keydown", alPulsarTecla);
  return caja;
}

/** Cierra el diálogo abierto y devuelve el foco a su origen. */
function cerrarModal() {
  if (!raiz) {
    return;
  }

  raiz.classList.remove("esta-visible");
  raiz.setAttribute("aria-hidden", "true");
  document.removeEventListener("keydown", alPulsarTecla);
  cajaActual = null;

  if (elementoPrevio && typeof elementoPrevio.focus === "function") {
    elementoPrevio.focus();
  }
  elementoPrevio = null;
}

/**
 * Diálogo de confirmación con dos salidas, en reemplazo de confirm().
 * @param {object} opciones
 * @param {string} opciones.titulo
 * @param {string} opciones.mensaje
 * @param {string} [opciones.textoConfirmar]
 * @param {string} [opciones.textoCancelar]
 * @param {string} [opciones.estiloConfirmar] Clase modificadora del botón.
 * @param {string} [opciones.nombreIcono]
 * @param {Function} opciones.alConfirmar Se ejecuta al aceptar.
 */
function confirmar({
  titulo,
  mensaje,
  textoConfirmar = "Confirmar",
  textoCancelar = "Cancelar",
  estiloConfirmar = "boton--primario",
  nombreIcono = "aviso",
  alConfirmar,
}) {
  const botonCancelar = crear("button", {
    clase: ["boton", "boton--fantasma"],
    atributos: { type: "button" },
    texto: textoCancelar,
    eventos: { click: cerrarModal },
  });

  const botonConfirmar = crear("button", {
    clase: ["boton", estiloConfirmar],
    atributos: { type: "button" },
    texto: textoConfirmar,
    eventos: {
      click: () => {
        cerrarModal();
        alConfirmar();
      },
    },
  });

  abrirModal({
    titulo,
    nombreIcono,
    cuerpo: [crear("p", { texto: mensaje })],
    acciones: [botonCancelar, botonConfirmar],
  });
}

  Object.assign(REGISTRO, { abrirModal, cerrarModal, confirmar });
})();

 * @param {object} opciones

 * @param {Function} opciones.alVolver Regresa al panel inicial.
 * @param {Function} opciones.alAbrirCaso Navega a otro caso.
 * @returns {HTMLElement}
 */
function crearVistaReporte({ caso, alVolver, alAbrirCaso }) {
  const volver = crear("button", {
    clase: ["volver", "no-imprimir"],
    atributos: { type: "button" },
    hijos: [icono("flechaIzquierda", { tamano: 16 }), crear("span", { texto: "Volver al panel" })],
    eventos: { click: alVolver },
  });

  const secciones = caso.evidencia
    ? [
        crearSeccionForense(caso),
        crearSeccionValidacion(caso),
        crearSeccionPatrones(caso, alAbrirCaso),
      ]
    : [crearAvisoSinEvidencia()];

  return crear("div", {
    clase: "vista",
    hijos: [
      crearEncabezadoImpresion(caso),
      volver,
      crearFicha(caso),
      fragmento(secciones),
      crearBarraDecision({ caso }),
    ],
  });
}

  Object.assign(REGISTRO, { crearVistaReporte });
})();

/**
 * Resume la cartera agrupada por prestador.
 * @returns {object[]} Prestadores con sus casos, montos y criticidad.
 */
function resumirPrestadores() {
  return prestadores
    .map((prestador) => {
      const propios = casos.filter((caso) => caso.rutPrestador === prestador.id);
      const criticos = propios.filter((caso) => caso.criticidad === "critico");
      const monto = propios.reduce((suma, caso) => suma + caso.monto, 0);
      const montoCritico = criticos.reduce((suma, caso) => suma + caso.monto, 0);

      /* El puntaje del prestador es el mayor de sus casos. */
      const puntajeMaximo = propios.reduce(
        (mayor, caso) => Math.max(mayor, caso.puntaje),
        0
      );

      return {
        ...prestador,
        casos: propios,
        totalCasos: propios.length,
        totalCriticos: criticos.length,
        monto,
        montoCritico,
        puntajeMaximo,
      };
    })
    .sort((uno, otro) => otro.montoCritico - uno.montoCritico);
}

/**
 * Calcula el resumen del histórico de resoluciones.
 * @returns {object}
 */
function resumirArchivo() {
  const fraude = historialResoluciones.reduce((suma, mes) => suma + mes.fraude, 0);
  const liberados = historialResoluciones.reduce(
    (suma, mes) => suma + mes.liberados,
    0
  );
  const montoBloqueado = historialResoluciones.reduce(
    (suma, mes) => suma + mes.montoBloqueado,
    0
  );

  return {
    fraude,
    liberados,
    total: fraude + liberados,
    montoBloqueado,
    tasaFraude: (fraude / (fraude + liberados)) * 100,
  };
}

/**
 * Resume el estado de la cola documental.
 * @returns {object}
 */
function resumirCola() {
  const contar = (estado) =>
    colaDocumental.filter((documento) => documento.estado === estado).length;

  return {
    concluidos: contar("concluido"),
    analizando: contar("analizando"),
    enCola: contar("en_cola"),
    adulterados: colaDocumental.filter((d) => d.veredicto === "adulterado").length,
    total: colaDocumental.length,
  };
}

/**
 * Construye la red completa de la cartera: prestadores y beneficiarios.
 * @returns {object} Nodos y vínculos listos para dibujar.
 */
function construirRedCartera() {
  const resumen = resumirPrestadores().filter((prestador) => prestador.totalCasos > 0);

  const nodosPrestador = resumen.map((prestador) => ({
    id: prestador.id,
    etiqueta: prestador.nombre,
    tipo: "prestador",
    alerta: prestador.alerta,
    casos: prestador.totalCasos,
    criticos: prestador.totalCriticos,
    monto: prestador.monto,
  }));

  const vinculos = [];
  const nodosBeneficiario = [];

  resumen.forEach((prestador) => {
    prestador.casos.forEach((caso) => {
      nodosBeneficiario.push({
        id: caso.id,
        etiqueta: caso.beneficiario,
        rut: caso.rut,
        tipo: "beneficiario",
        criticidad: caso.criticidad,
        puntaje: caso.puntaje,
        monto: caso.monto,
        prestador: prestador.id,
      });

      vinculos.push({
        origen: prestador.id,
        destino: caso.id,
        criticidad: caso.criticidad,
      });
    });
  });

  return { nodosPrestador, nodosBeneficiario, vinculos, totalCriticos: casosCriticos.length };
}

/* ===== src/js/components/grafoCartera.js ===== */
(() => {
  const { crear, crearSVG, vaciar, comoMoneda } = REGISTRO;
/* =========================================================================
   LISA vigIA — Grafo de la cartera completa.
   Cada prestador forma un núcleo con sus beneficiarios alrededor. El tamaño
   del núcleo refleja cuántos casos concentra y su color, el nivel de alerta,
   de modo que los focos de fraude se distinguen de un vistazo.
   ========================================================================= */


const ANCHO = 900;

/* Alto de cada fila de núcleos; el lienzo crece según cuántas hagan falta,
   de modo que no queden franjas vacías cuando hay pocos prestadores. */
const ALTO_FILA = 250;

/* Color de cada nivel de alerta del prestador. */
const COLOR_ALERTA = {
  critica: "#f2857f",
  media: "#e5b567",
  baja: "#6ea8d8",
};

/* Proporción vertical de la órbita: la achata para dejar sitio al cartel. */
const ACHATADO = 0.68;

/* Radio de la órbita de beneficiarios en torno a un núcleo. */
const radioOrbita = (cantidad) => Math.min(40 + cantidad * 4, 76);

/**
 * Dibuja la red de prestadores y beneficiarios de toda la cartera.
 * @param {object} opciones
 * @param {object[]} opciones.nodosPrestador
 * @param {object[]} opciones.nodosBeneficiario
 * @param {Function} [opciones.alElegirCaso] Recibe el id del caso.
 * @returns {HTMLElement}
 */
function crearGrafoCartera({ nodosPrestador, nodosBeneficiario, alElegirCaso }) {
  const contenedor = crear("div", { clase: "grafico" });

  /* Los prestadores se reparten en una retícula holgada, ordenados de mayor
     a menor concentración para que el foco principal quede a la izquierda. */
  const ordenados = [...nodosPrestador].sort((uno, otro) => otro.casos - uno.casos);
  const columnas = Math.min(ordenados.length, 3);
  const filas = Math.ceil(ordenados.length / columnas);

  const anchoCelda = ANCHO / columnas;
  const altoCelda = ALTO_FILA;
  const alto = filas * ALTO_FILA;

  const svg = crearSVG("svg", {
    clase: "grafico__lienzo",
    atributos: {
      viewBox: `0 0 ${ANCHO} ${alto}`,
      role: "img",
      "aria-label": `Red de la cartera: ${nodosPrestador.length} prestadores y ${nodosBeneficiario.length} beneficiarios.`,
    },
  });

  const centros = new Map();

  ordenados.forEach((prestador, indice) => {
    const columna = indice % columnas;
    const fila = Math.floor(indice / columnas);

    centros.set(prestador.id, {
      x: anchoCelda * (columna + 0.5),
      y: altoCelda * (fila + 0.5),
      prestador,
    });
  });

  /* --- Globo informativo -------------------------------------------- */
  const tooltip = crear("div", { clase: "tooltip", atributos: { role: "tooltip" } });

  function mostrarTooltip(titulo, filas, evento) {
    vaciar(tooltip);
    tooltip.appendChild(crear("p", { clase: "tooltip__titulo", texto: titulo }));

    filas.forEach(([clave, valor]) => {
      tooltip.appendChild(
        crear("div", {
          clase: "tooltip__fila",
          hijos: [
            crear("span", { clase: "tooltip__clave", texto: clave }),
            crear("span", { clase: "tooltip__valor", texto: valor }),
          ],
        })
      );
    });

    const limites = contenedor.getBoundingClientRect();
    const x = evento.clientX - limites.left + 16;
    const y = evento.clientY - limites.top + 16;
    const ancho = 240;

    tooltip.style.left = `${x + ancho > limites.width ? x - ancho - 32 : x}px`;
    tooltip.style.top = `${y}px`;
    tooltip.classList.add("esta-visible");
  }

  const ocultarTooltip = () => tooltip.classList.remove("esta-visible");

  /* --- Vínculos y beneficiarios -------------------------------------- */
  centros.forEach(({ x, y, prestador }) => {
    const propios = nodosBeneficiario.filter(
      (nodo) => nodo.prestador === prestador.id
    );

    const color = COLOR_ALERTA[prestador.alerta];
    const radio = radioOrbita(propios.length);

    propios.forEach((beneficiario, indice) => {
      const angulo = (Math.PI * 2 * indice) / propios.length - Math.PI / 2;
      const bx = x + Math.cos(angulo) * radio;
      /* La órbita se achata para reservar espacio al cartel del nombre. */
      const by = y + Math.sin(angulo) * radio * ACHATADO;

      const esCritico = beneficiario.criticidad === "critico";

      svg.appendChild(
        crearSVG("line", {
          atributos: {
            x1: x,
            y1: y,
            x2: bx,
            y2: by,
            stroke: esCritico ? color : "#3a3a46",
            "stroke-width": esCritico ? 1.6 : 1,
            opacity: esCritico ? 0.7 : 0.35,
          },
        })
      );

      const nodo = crearSVG("circle", {
        clase: "punto-dato",
        atributos: {
          cx: bx,
          cy: by,
          r: esCritico ? 7 : 5,
          fill: esCritico ? color : "#2a2a34",
          stroke: esCritico ? "#0a0a0c" : "#4a4a58",
          "stroke-width": 1.5,
          tabindex: "0",
          role: "button",
          "aria-label": `${beneficiario.etiqueta}, puntaje ${beneficiario.puntaje}. Abrir el caso.`,
        },
      });

      const detalle = [
        ["RUT", beneficiario.rut],
        ["Monto", comoMoneda(beneficiario.monto)],
        ["Scoring", `${beneficiario.puntaje}/100`],
        ["Criticidad", esCritico ? "Crítico" : "Leve"],
      ];

      nodo.addEventListener("mousemove", (evento) =>
        mostrarTooltip(beneficiario.etiqueta, detalle, evento)
      );
      nodo.addEventListener("mouseleave", ocultarTooltip);

      if (alElegirCaso) {
        nodo.addEventListener("click", () => alElegirCaso(beneficiario.id));
        nodo.addEventListener("keydown", (evento) => {
          if (evento.key === "Enter" || evento.key === " ") {
            evento.preventDefault();
            alElegirCaso(beneficiario.id);
          }
        });
      }

      svg.appendChild(nodo);
    });
  });

  /* --- Núcleos de prestador ------------------------------------------ */
  centros.forEach(({ x, y, prestador }) => {
    const color = COLOR_ALERTA[prestador.alerta];
    const radioNucleo = 16 + Math.min(prestador.casos, 6) * 2.6;

    /* El foco crítico late para atraer la mirada. */
    if (prestador.alerta === "critica") {
      const halo = crearSVG("circle", {
        atributos: { cx: x, cy: y, r: radioNucleo + 12, fill: color, opacity: 0.16 },
      });
      halo.appendChild(
        crearSVG("animate", {
          atributos: {
            attributeName: "r",
            values: `${radioNucleo + 8};${radioNucleo + 20};${radioNucleo + 8}`,
            dur: "3s",
            repeatCount: "indefinite",
          },
        })
      );
      svg.appendChild(halo);
    }

    const nucleo = crearSVG("circle", {
      clase: "punto-dato",
      atributos: {
        cx: x,
        cy: y,
        r: radioNucleo,
        fill: "#16161c",
        stroke: color,
        "stroke-width": prestador.alerta === "critica" ? 3 : 2,
        tabindex: "0",
        "aria-label": `${prestador.etiqueta}: ${prestador.casos} casos, ${prestador.criticos} críticos.`,
      },
    });

    nucleo.addEventListener("mousemove", (evento) =>
      mostrarTooltip(prestador.etiqueta, [
        ["RUT", prestador.id],
        ["Casos", String(prestador.casos)],
        ["Críticos", String(prestador.criticos)],
        ["Monto", comoMoneda(prestador.monto)],
      ], evento)
    );
    nucleo.addEventListener("mouseleave", ocultarTooltip);
    svg.appendChild(nucleo);

    svg.appendChild(
      crearSVG("text", {
        texto: String(prestador.casos),
        atributos: {
          x,
          y: y + 4,
          fill: color,
          "font-size": 13,
          "font-weight": "700",
          "font-family": "monospace",
          "text-anchor": "middle",
        },
      })
    );

    /* Cartel con el nombre, sobre fondo opaco para separarlo del grafo. */
    const etiqueta = prestador.etiqueta;
    const anchoCartel = Math.max(etiqueta.length * 6.4, 120);

    /* El cartel se sitúa por debajo de la órbita, no del núcleo, para que
       ningún beneficiario quede tapado por el nombre del prestador. */
    const propios = nodosBeneficiario.filter((nodo) => nodo.prestador === prestador.id);
    const yCartel = y + radioOrbita(propios.length) * ACHATADO + 18;

    svg.appendChild(
      crearSVG("rect", {
        atributos: {
          x: x - anchoCartel / 2,
          y: yCartel,
          width: anchoCartel,
          height: 20,
          rx: 5,
          fill: "#0a0a0c",
          stroke: "#26262e",
          "stroke-width": 1,
        },
      })
    );

    svg.appendChild(
      crearSVG("text", {
        texto: etiqueta,
        atributos: {
          x,
          y: yCartel + 14,
          fill: "#f2f2f5",
          "font-size": 11,
          "font-weight": "600",
          "text-anchor": "middle",
        },
      })
    );
  });

  contenedor.appendChild(
    crear("p", {
      clase: "grafico__titulo",
      texto: "Mapa de vínculos entre prestadores y beneficiarios",
    })
  );
  contenedor.appendChild(
    crear("p", {
      clase: "grafico__ayuda",
      texto:
        "El tamaño del núcleo indica cuántos casos concentra el prestador. Pase el puntero sobre cualquier nodo para ver el detalle.",
    })
  );
  contenedor.appendChild(svg);

  contenedor.appendChild(
    crear("div", {
      clase: "grafico__leyenda",
      hijos: [
        crearItemLeyenda(COLOR_ALERTA.critica, "Concentración crítica"),
        crearItemLeyenda(COLOR_ALERTA.media, "Bajo vigilancia"),
        crearItemLeyenda(COLOR_ALERTA.baja, "Sin hallazgos"),
      ],
    })
  );

  contenedor.appendChild(tooltip);
  return contenedor;
}

/* Construye un elemento de la leyenda. */
function crearItemLeyenda(color, texto) {
  const muestra = crear("span", { clase: "grafico__muestra" });
  muestra.style.backgroundColor = color;

  return crear("span", {
    clase: "grafico__leyenda-item",
    hijos: [muestra, crear("span", { texto })],
  });
}

})();

        texto: `${documento.confianza}%`,

      crear("td", { clase: "col-derecha", hijos: [celdaConfianza] }),
    ],
    eventos: {
      click: () => alAbrirCaso(documento.idCaso),
      keydown: (evento) => {
        if (evento.key === "Enter" || evento.key === " ") {
          evento.preventDefault();
          alAbrirCaso(documento.idCaso);
        }

    },
  });
}

/* ===== src/js/components/graficoAprendizaje.js ===== */
(() => {
  const { crear, crearSVG, vaciar } = REGISTRO;
/* =========================================================================
   LISA vigIA — Curva de aprendizaje del modelo.
   Traza cómo subió la precisión mientras caían los falsos positivos y los
   casos que lograban escapar, y marca sobre la curva el mes en que entró
   en producción cada capacidad nueva.
   ========================================================================= */

const ANCHO = 820;
const ALTO = 380;
const MARGEN = { arriba: 44, derecha: 24, abajo: 52, izquierda: 48 };

const ANCHO_TRAMA = ANCHO - MARGEN.izquierda - MARGEN.derecha;
const ALTO_TRAMA = ALTO - MARGEN.arriba - MARGEN.abajo;

/**
 * Dibuja la evolución del modelo a lo largo del semestre.
 * @param {object} opciones
 * @param {object[]} opciones.historial Meses con precisión y falsos positivos.
 * @param {object[]} opciones.hitos Capacidades incorporadas al modelo.
 * @returns {HTMLElement}
 */
function crearGraficoAprendizaje({ historial, hitos }) {
  const contenedor = crear("div", { clase: "grafico" });

  const svg = crearSVG("svg", {
    clase: "grafico__lienzo",
    atributos: {
      viewBox: `0 0 ${ANCHO} ${ALTO}`,
      role: "img",
      "aria-label":
        "Evolución del modelo: la precisión sube del 62 % al 94 % mientras los falsos positivos caen del 31 % al 6 %.",
    },
  });

  const trama = crearSVG("g", {
    atributos: { transform: `translate(${MARGEN.izquierda}, ${MARGEN.arriba})` },
  });

  const paso = ANCHO_TRAMA / (historial.length - 1);
  const escalaX = (indice) => paso * indice;
  const escalaY = (porcentaje) => ALTO_TRAMA - (porcentaje / 100) * ALTO_TRAMA;

  /* --- Rejilla ------------------------------------------------------- */
  [0, 25, 50, 75, 100].forEach((valor) => {
    const y = escalaY(valor);

    trama.appendChild(
      crearSVG("line", {
        atributos: {
          x1: 0,
          y1: y,
          x2: ANCHO_TRAMA,
          y2: y,
          stroke: "#26262e",
          "stroke-width": 1,
        },
      })
    );

    trama.appendChild(
      crearSVG("text", {
        texto: `${valor}%`,
        atributos: {
          x: -10,
          y: y + 4,
          fill: "#6e6e7c",
          "font-size": 11,
          "font-family": "monospace",
          "text-anchor": "end",
        },
      })
    );
  });

  /* --- Área bajo la curva de precisión -------------------------------- */
  const puntosPrecision = historial.map((mes, indice) => ({
    x: escalaX(indice),
    y: escalaY(mes.precision),
  }));

  const area = [
    `M 0 ${ALTO_TRAMA}`,
    ...puntosPrecision.map((punto) => `L ${punto.x} ${punto.y}`),
    `L ${ANCHO_TRAMA} ${ALTO_TRAMA}`,
    "Z",
  ].join(" ");

  const degradado = crearSVG("defs", {
    hijos: [
      crearSVG("linearGradient", {
        atributos: { id: "degradadoPrecision", x1: "0", y1: "0", x2: "0", y2: "1" },
        hijos: [
          crearSVG("stop", {
            atributos: { offset: "0%", "stop-color": "#5fc9a0", "stop-opacity": "0.32" },
          }),
          crearSVG("stop", {
            atributos: { offset: "100%", "stop-color": "#5fc9a0", "stop-opacity": "0" },
          }),
        ],
      }),
    ],
  });

  svg.appendChild(degradado);
  trama.appendChild(crearSVG("path", { atributos: { d: area, fill: "url(#degradadoPrecision)" } }));

  /* --- Línea de falsos positivos, en descenso -------------------------- */
  const trazoFalsos = historial
    .map((mes, indice) => `${escalaX(indice)},${escalaY(mes.falsosPositivos)}`)
    .join(" ");

  trama.appendChild(
    crearSVG("polyline", {
      atributos: {
        points: trazoFalsos,
        fill: "none",
        stroke: "#f2857f",
        "stroke-width": 2,
        "stroke-dasharray": "5 4",
        "stroke-linecap": "round",
      },
    })
  );

  /* --- Línea de precisión --------------------------------------------- */
  const trazoPrecision = puntosPrecision.map((punto) => `${punto.x},${punto.y}`).join(" ");

  const linea = crearSVG("polyline", {
    atributos: {
      points: trazoPrecision,
      fill: "none",
      stroke: "#5fc9a0",
      "stroke-width": 3,
      "stroke-linecap": "round",
      "stroke-linejoin": "round",
    },
  });

  /* La curva se dibuja progresivamente al entrar en pantalla. */
  const largoTrazo = ANCHO_TRAMA * 1.4;
  linea.setAttribute("stroke-dasharray", largoTrazo);
  linea.setAttribute("stroke-dashoffset", largoTrazo);
  linea.appendChild(
    crearSVG("animate", {
      atributos: {
        attributeName: "stroke-dashoffset",
        from: largoTrazo,
        to: "0",
        dur: "1.4s",
        fill: "freeze",
      },
    })
  );

  trama.appendChild(linea);

  /* --- Globo informativo ----------------------------------------------- */
  const tooltip = crear("div", { clase: "tooltip", atributos: { role: "tooltip" } });

  function mostrarTooltip(mes, evento) {
    vaciar(tooltip);
    tooltip.appendChild(crear("p", { clase: "tooltip__titulo", texto: mes.mes }));

    [
      ["Precisión", `${mes.precision}%`],
      ["Falsos positivos", `${mes.falsosPositivos}%`],
      ["Días por caso", `${mes.diasResolucion}`],
      ["Casos escapados", String(mes.escapados)],
    ].forEach(([clave, valor]) => {
      tooltip.appendChild(
        crear("div", {
          clase: "tooltip__fila",
          hijos: [
            crear("span", { clase: "tooltip__clave", texto: clave }),
            crear("span", { clase: "tooltip__valor", texto: valor }),
          ],
        })
      );
    });

    const limites = contenedor.getBoundingClientRect();
    const x = evento.clientX - limites.left + 16;
    const y = evento.clientY - limites.top + 16;
    const ancho = 240;

    tooltip.style.left = `${x + ancho > limites.width ? x - ancho - 32 : x}px`;
    tooltip.style.top = `${y}px`;
    tooltip.classList.add("esta-visible");
  }

  const ocultarTooltip = () => tooltip.classList.remove("esta-visible");

  /* --- Puntos, hitos y rótulos ------------------------------------------ */
  const mesesConHito = new Map(hitos.map((hito) => [hito.abreviatura, hito]));

  historial.forEach((mes, indice) => {
    const x = escalaX(indice);
    const hito = mesesConHito.get(mes.abreviatura);

    /* Marca vertical en los meses en que el modelo incorporó una capacidad. */
    if (hito) {
      trama.appendChild(
        crearSVG("line", {
          atributos: {
            x1: x,
            y1: escalaY(mes.precision),
            x2: x,
            y2: -12,
            stroke: "#4a4a58",
            "stroke-width": 1,
            "stroke-dasharray": "3 3",
          },
        })
      );

      trama.appendChild(
        crearSVG("circle", {
          atributos: { cx: x, cy: -16, r: 3, fill: "#c3cbf0" },
        })
      );
    }

    /* Punto sobre la línea de falsos positivos. */
    trama.appendChild(
      crearSVG("circle", {
        atributos: {
          cx: x,
          cy: escalaY(mes.falsosPositivos),
          r: 3.5,
          fill: "#f2857f",
        },
      })
    );

    /* Punto de precisión, mayor en el mes final. */
    const esFinal = indice === historial.length - 1;

    const punto = crearSVG("circle", {
      clase: "punto-dato",
      atributos: {
        cx: x,
        cy: escalaY(mes.precision),
        r: esFinal ? 7 : 5,
        fill: "#5fc9a0",
        stroke: "#0a0a0c",
        "stroke-width": 2,
      },
    });

    punto.addEventListener("mousemove", (evento) => mostrarTooltip(mes, evento));
    punto.addEventListener("mouseleave", ocultarTooltip);
    trama.appendChild(punto);

    /* Rótulo del valor en el primer y el último mes. */
    if (indice === 0 || esFinal) {
      trama.appendChild(
        crearSVG("text", {
          texto: `${mes.precision}%`,
          atributos: {
            x: esFinal ? x - 6 : x + 6,
            y: escalaY(mes.precision) - 14,
            fill: "#5fc9a0",
            "font-size": 13,
            "font-weight": "700",
            "font-family": "monospace",
            "text-anchor": esFinal ? "end" : "start",
          },
        })
      );
    }

    /* Rótulo del mes en el eje inferior. */
    trama.appendChild(
      crearSVG("text", {
        texto: mes.abreviatura,
        atributos: {
          x,
          y: ALTO_TRAMA + 22,
          fill: hito ? "#c3cbf0" : "#6e6e7c",
          "font-size": 11,
          "font-weight": hito ? "700" : "400",
          "text-anchor": "middle",
        },
      })
    );
  });

  svg.appendChild(trama);

  contenedor.appendChild(
    crear("p", {
      clase: "grafico__titulo",
      texto: "Precisión del modelo frente a falsos positivos",
    })
  );
  contenedor.appendChild(
    crear("p", {
      clase: "grafico__ayuda",
      texto:
        "Los meses marcados en el eje corresponden a la entrada en producción de una capacidad nueva. Pase el puntero sobre un punto para ver el detalle.",
    })
  );
  contenedor.appendChild(svg);

  contenedor.appendChild(
    crear("div", {
      clase: "grafico__leyenda",
      hijos: [
        crearItemLeyenda("#5fc9a0", "Precisión de detección"),
        crearItemLeyenda("#f2857f", "Falsos positivos"),
        crearItemLeyenda("#c3cbf0", "Capacidad incorporada"),
      ],
    })
  );

  contenedor.appendChild(tooltip);
  return contenedor;
}

  );

  botones.forEach((boton) => {
    boton.addEventListener("click", () => {
      filtro = boton.dataset.filtroArchivo;

  return crear("section", {
    clase: "panel",

      crear("header", {

        hijos: [

            hijos: patronesAprendidos.map(crearTarjetaPatron),
          }),
        ],
      }),
    ],
  });

  return crear("div", {
    clase: "vista",
    hijos: [
      crear("header", {
        clase: "vista__cabecera",
        hijos: [
          crear("div", {
            hijos: [
              crear("h1", { clase: "vista__titulo", texto: "Inteligencia archivada" }),
              crear("p", {
                clase: "vista__subtitulo",
                texto:
                  "Lo que el sistema aprendió de cada caso resuelto y cómo eso cambia lo que detecta hoy.",
              }),
            ],
          }),
          crear("div", {
            clase: "vista__meta",
            hijos: [
              crear("p", { clase: "vista__meta-titulo", texto: "Monto bloqueado" }),
              crear("p", {
                clase: ["vista__meta-estado", "dato-mono"],
                texto: comoMoneda(resumen.montoBloqueado),
              }),
            ],
          }),
        ],
      }),
      crearTitular(),
      panelCurva,
      panelHitos,
      panelRecuperados,
      panelReincidentes,
      panelSenales,
      panelPatrones,
      crearPanelCasos(),
    ],
  });
}

/* Barra de progreso con animación de entrada. */
function crearRelleno(porcentaje) {
  const relleno = crear("span", { clase: "barra__relleno" });
  relleno.style.width = "0%";

  window.requestAnimationFrame(() => {
    relleno.style.width = `${porcentaje}%`;
  });

  return relleno;
}

  Object.assign(REGISTRO, { crearVistaArchivo });
})();

/* ===== src/js/app.js ===== */
(() => {
  const { reemplazar, obtenerCaso, crearArmazon, mostrarAviso, crearVistaDashboard, crearVistaRegistro, crearVistaReporte, crearVistaRed, crearVistaForense, crearVistaArchivo } = REGISTRO;
/* =========================================================================
   LISA vigIA — Punto de entrada.
   Monta el armazón, resuelve la navegación entre vistas y mantiene el
   estado mínimo del prototipo (sección activa y caso en revisión).
   ========================================================================= */










/* Estado del prototipo. */
const estado = {
  seccion: "panel",
  idCaso: null,
  busqueda: "",
};

/* Referencias creadas al montar el armazón. */
let armazon = null;

/** Navega a una sección de la barra lateral. */
function navegar(seccion) {
  estado.seccion = seccion;
  estado.idCaso = null;
  dibujar();
}

/** Abre el reporte de un caso concreto. */
function abrirCaso(id) {
  const caso = obtenerCaso(id);

  if (!caso) {
    mostrarAviso({
      tipo: "alerta",
      titulo: "Caso no encontrado",
      texto: `No existe un expediente con el identificador ${id}.`,
    });
    return;
  }

  estado.seccion = "casos";
  estado.idCaso = id;
  dibujar();
}

/** Vuelve al panel inicial desde cualquier vista. */
function volverAlPanel() {
  navegar("panel");
}

/** Aplica la búsqueda de la cabecera sobre el registro de casos. */
function buscar(texto) {
  if (texto === "") {
    mostrarAviso({ titulo: "Búsqueda", texto: "Escriba un nombre, RUT o número de caso." });
    return;
  }

  estado.busqueda = texto;
  estado.seccion = "casos";
  estado.idCaso = null;
  dibujar();
}

/** Construye la vista que corresponde al estado actual. */
function resolverVista() {
  if (estado.idCaso) {
    return crearVistaReporte({
      caso: obtenerCaso(estado.idCaso),
      alVolver: volverAlPanel,
      alAbrirCaso: abrirCaso,
    });
  }

  if (estado.seccion === "casos") {
    return crearVistaRegistro({ alAbrirCaso: abrirCaso, busqueda: estado.busqueda });
  }

  if (estado.seccion === "red") {
    return crearVistaRed({ alAbrirCaso: abrirCaso });
  }

  if (estado.seccion === "forense") {
    return crearVistaForense({ alAbrirCaso: abrirCaso });
  }

  if (estado.seccion === "archivo") {
    return crearVistaArchivo({ alAbrirCaso: abrirCaso });
  }

  return crearVistaDashboard({ alAbrirCaso: abrirCaso });
}

/** Vuelca la vista activa en el contenedor principal. */
function dibujar() {
  reemplazar(armazon.contenedorVista, resolverVista());
  armazon.marcarSeccion(estado.seccion);

  /* Cada cambio de vista empieza desde el inicio del documento. */
  window.scrollTo({ top: 0, behavior: "auto" });
}

/** Arranca la aplicación. */
function iniciar() {
  armazon = crearArmazon({ alNavegar: navegar, alBuscar: buscar });

  document.body.appendChild(armazon.app);
  document.body.appendChild(armazon.velo);

  dibujar();
}

iniciar();

})();
};

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", arrancar);
} else {
  arrancar();
}
</script>
