*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  /* --- Superficies -------------------------------------------------- */
  --color-fondo: #0a1836;
  --color-superficie: #101f42;
  --color-superficie-alta: #16274f;
  --color-superficie-suave: #1c2f5c;
  --color-panel-datos: #16294f;

  /* --- Bordes y separadores ----------------------------------------- */
  --color-borde: #24386b;
  --color-borde-suave: #1a2c58;
  --color-borde-acento: #3d5490;

  /* Franjas de navegación. En el tema nocturno se confunden con el fondo,
     que es justo el efecto buscado allí. */
  --color-cromo: #081330;
  --color-cromo-borde: #1a2c58;

  /* --- Texto --------------------------------------------------------- */
  --color-texto: #eef2fb;
  --color-texto-medio: #a3b0cc;
  --color-texto-tenue: #7b8cb0;

  /* --- Semáforo de riesgo -------------------------------------------- */
  --color-critico: #f2857f;
  --color-critico-fuerte: #e5484d;
  --color-critico-fondo: rgba(242, 133, 127, 0.12);
  --color-medio: #e5b567;
  --color-medio-fondo: rgba(229, 181, 103, 0.12);
  --color-bajo: #6ea8d8;
  --color-bajo-fondo: rgba(110, 168, 216, 0.12);
  --color-ok: #5fc9a0;
  --color-ok-fondo: rgba(95, 201, 160, 0.12);
  --color-ok-fondo-fuerte: rgba(95, 201, 160, 0.24);
  /* Turquesa de la onda de LISA, reservado a la serie de precisión de los
     gráficos. Se mantiene aparte de --color-ok porque aquel comunica un
     estado correcto y este es identidad de marca. */
  --color-precision: #00e5c2;
  /* Realce de la fila destacada en los listados. */
  --color-fila-critica: rgba(242, 133, 127, 0.07);
  --color-fila-critica-fuerte: rgba(242, 133, 127, 0.12);
  --color-borde-alerta: rgba(242, 133, 127, 0.35);

  /* --- Marca LISA ----------------------------------------------------- */
  --color-marca-turquesa: #00e5c2;
  --color-marca-azul: #36d9ff;
  --color-marca-violeta: #9b7cff;
  --color-accion: #9b7cff;
  /* Texto que se apoya sobre el color de acento. Cada tema lo define según
     la luminosidad de su propio acento: aquí es lavanda claro. */
  --color-sobre-accion: #0a0a1a;

  /* --- Tipografía ------------------------------------------------------ */
  --fuente-base: "Assistant", "Segoe UI", system-ui, -apple-system, sans-serif;
  /* Geométrica para titulares, en el lugar que la Futura ocupa en el sitio. */
  --fuente-titulo: "Jost", "Futura", "Century Gothic", var(--fuente-base);
  --fuente-mono: "Cascadia Mono", "Consolas", "SF Mono", "Menlo", monospace;

  /* --- Ritmo espacial --------------------------------------------------- */
  --espacio-xs: 0.4rem;
  --espacio-sm: 0.8rem;
  --espacio-md: 1.6rem;
  --espacio-lg: 2.4rem;
  --espacio-xl: 3.2rem;

  --radio-sm: 0.4rem;
  --radio-md: 0.8rem;
  --radio-lg: 1.2rem;

  --ancho-sidebar: 26rem;
  --alto-topbar: 7rem;

  --sombra-panel: 0 0.2rem 1.6rem rgba(3, 8, 22, 0.55);
  --transicion: 160ms ease;
}

/* =========================================================================
   Tema diurno.
   La paleta se deriva de los logotipos: el violeta #4f439b y el cian #2fa2cd
   de la onda de LISA, y el azul #365e91 del retrato del vigía. Los neutros
   llevan un sesgo hacia ese azul en lugar de ser grises puros, de modo que
   el conjunto se lea como una sola familia cromática.

   El semáforo de riesgo queda fuera de esa armonía: rojo, ámbar y verde
   comunican estado, no marca, así que solo se oscurecen lo justo para
   conservar el contraste sobre fondo claro.
   ========================================================================= */

:root[data-tema="claro"] {
  /* --- Superficies, teñidas con el azul de marca --------------------- */
  --color-fondo: #eeecf7;
  --color-superficie: #ffffff;
  --color-superficie-alta: #f6f4fc;
  --color-superficie-suave: #e6e2f5;
  --color-panel-datos: #e7e3f7;

  /* Franjas de navegación: llevan el azul de marca más marcado, para que
     el armazón de la aplicación se distinga del área de trabajo. */
  --color-cromo: #e8e4f6;
  --color-cromo-borde: #d5cce9;

  /* --- Bordes y separadores ----------------------------------------- */
  --color-borde: #d4cce6;
  --color-borde-suave: #e2ddf0;
  --color-borde-acento: #b0a8cd;

  /* --- Texto: azul muy oscuro en lugar de negro ---------------------- */
  --color-texto: #1a1633;
  --color-texto-medio: #4d4869;
  --color-texto-tenue: #6a6484;

  /* --- Semáforo de riesgo. Ajeno a la marca: comunica estado. -------- */
  --color-critico: #c8322f;
  --color-critico-fuerte: #b3231f;
  --color-critico-fondo: rgba(200, 50, 47, 0.1);
  --color-medio: #9a6800;
  --color-medio-fondo: rgba(154, 104, 0, 0.12);
  --color-bajo: #2b6ea8;
  --color-bajo-fondo: rgba(43, 110, 168, 0.12);
  --color-ok: #157a56;
  --color-ok-fondo: rgba(21, 122, 86, 0.1);
  --color-ok-fondo-fuerte: rgba(21, 122, 86, 0.18);
  --color-precision: #1e798d;
  --color-fila-critica: rgba(200, 50, 47, 0.05);
  --color-fila-critica-fuerte: rgba(200, 50, 47, 0.09);
  --color-borde-alerta: rgba(200, 50, 47, 0.3);

  /* --- Marca LISA ----------------------------------------------------- */
  --color-marca-turquesa: #1e798d;
  --color-marca-azul: #2b7ea6;
  --color-marca-violeta: #4a00c5;
  --color-accion: #4a00c5;
  /* Turquesa vivo del sitio. Con 1,6 de contraste sobre blanco solo sirve
     como adorno: los datos usan la variante oscura de arriba. */
  --color-marca-brillo: #00e5c2;
  /* El acento diurno es el violeta oscuro de LISA, así que el texto que se
     apoya sobre él va en blanco. */
  --color-sobre-accion: #ffffff;

  --sombra-panel: 0 0.2rem 1.6rem rgba(26, 22, 51, 0.1);
}

html {
  font-size: 62.5%; /* 1rem = 10px */
}

body {
  min-height: 100vh;
  background-color: var(--color-fondo);
  color: var(--color-texto);
  font-family: var(--fuente-base);
  font-size: 1.4rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* Ningún contenido ancho debe desplazar la página en horizontal: los
     bloques que lo necesitan gestionan su propio scroll interno. */
  overflow-x: hidden;
  transition: background-color var(--transicion), color var(--transicion);
}

h1,
h2,
h3,
h4 {
  font-family: var(--fuente-titulo);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.01em;
}

ul,
ol {
  list-style: none;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
  display: block;
}

table {
  border-collapse: collapse;
  width: 100%;
}

:focus-visible {
  outline: 0.2rem solid var(--color-accion);
  outline-offset: 0.2rem;
}

/* Texto reservado a lectores de pantalla. */
.solo-lectores {
  position: absolute;
  width: 0.1rem;
  height: 0.1rem;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Utilidades tipográficas de uso transversal. */
.dato-mono {
  font-family: var(--fuente-mono);
  font-variant-numeric: tabular-nums;
}

.etiqueta-campo {
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-texto-tenue);
}


/* ===== src/css/layout.css ===== */
/* =========================================================================
   LISA vigIA — Armazón de la aplicación: barra lateral, cabecera superior
   y contenedor de vistas. Grid de dos columnas que colapsa en móvil.
   ========================================================================= */

.app {
  display: grid;
  grid-template-columns: var(--ancho-sidebar) 1fr;
  min-height: 100vh;
}

/* ------------------------------------------------------------------ */
/* Barra lateral                                                       */
/* ------------------------------------------------------------------ */

.sidebar {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-lg);
  padding: var(--espacio-lg) var(--espacio-md);
  background-color: var(--color-cromo);
  border-right: 0.1rem solid var(--color-cromo-borde);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar__marca {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--espacio-sm);
  text-align: center;
}

/* Retrato del vigía: el PNG viene en azul plano, que sobre el fondo
   nocturno pierde contraste, así que se aclara solo en ese tema. */
.sidebar__vigia {
  width: 9.6rem;
  height: auto;
  object-fit: contain;
  filter: brightness(1.85) saturate(1.15);
}

:root[data-tema="claro"] .sidebar__vigia {
  filter: none;
}

.sidebar__identidad {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
}

/* La onda de LISA acompaña al nombre. El PNG trae un amplio margen
   transparente, así que se recorta con object-fit y un escalado que
   aprovecha ese espacio sobrante. */
.sidebar__logo {
  width: 3.2rem;
  height: 1.8rem;
  object-fit: cover;
  object-position: center;
  transform: scale(2.1);
  flex-shrink: 0;
}

.sidebar__nombre {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  overflow: hidden;
}

.sidebar__nombre span {
  background: linear-gradient(
    90deg,
    var(--color-marca-turquesa),
    var(--color-marca-violeta)
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.sidebar__estado {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
  font-size: 1.2rem;
  color: var(--color-texto-medio);
}

.sidebar__punto {
  width: 0.7rem;
  height: 0.7rem;
  border-radius: 50%;
  background-color: var(--color-critico);
  box-shadow: 0 0 0.8rem var(--color-critico);
}

.sidebar__accion {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--espacio-sm);
  width: 100%;
  padding: 1.2rem;
  background-color: var(--color-accion);
  color: var(--color-sobre-accion);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  border-radius: var(--radio-md);
  transition: filter var(--transicion);
}

.sidebar__accion:hover {
  filter: brightness(1.08);
}

.sidebar__nav {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-xs);
}

.sidebar__enlace {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  width: 100%;
  padding: 1.2rem var(--espacio-md);
  font-size: 1.4rem;
  color: var(--color-texto-medio);
  border-radius: var(--radio-md);
  text-align: left;
  transition: background-color var(--transicion), color var(--transicion);
}

.sidebar__enlace:hover {
  background-color: var(--color-superficie);
  color: var(--color-texto);
}

/* La sección activa se marca con el acento de LISA. */
.sidebar__enlace[aria-current="page"] {
  background-color: var(--color-superficie);
  color: var(--color-texto);
  font-weight: 600;
  box-shadow: inset 0.3rem 0 0 var(--color-accion);
}

.sidebar__enlace .icono {
  flex-shrink: 0;
  color: currentColor;
}

.sidebar__pie {
  margin-top: auto;
  padding-top: var(--espacio-md);
  border-top: 0.1rem solid var(--color-borde-suave);
  display: flex;
  flex-direction: column;
  gap: var(--espacio-xs);
}

/* ------------------------------------------------------------------ */
/* Cabecera superior                                                   */
/* ------------------------------------------------------------------ */

.principal {
  display: flex;
  flex-direction: column;
  min-width: 0; /* permite que las tablas internas hagan scroll */
}

.topbar {
  display: flex;
  align-items: center;
  gap: var(--espacio-lg);
  height: var(--alto-topbar);
  padding: 0 var(--espacio-lg);
  border-bottom: 0.1rem solid var(--color-cromo-borde);
  background-color: var(--color-cromo);
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar__titulo {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  white-space: nowrap;
  min-width: 0;
}

.topbar__buscador {
  position: relative;
  flex: 1;
  max-width: 52rem;
}

.topbar__buscador .icono {
  position: absolute;
  left: 1.4rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-texto-tenue);
  pointer-events: none;
}

.topbar__input {
  width: 100%;
  padding: 1.1rem 1.4rem 1.1rem 4.4rem;
  font-family: inherit;
  font-size: 1.4rem;
  color: var(--color-texto);
  /* El campo se apoya en la superficie para separarse de la franja. */
  background-color: var(--color-superficie);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-md);
  transition: border-color var(--transicion);
}

.topbar__input::placeholder {
  color: var(--color-texto-tenue);
}

.topbar__input:focus {
  outline: none;
  border-color: var(--color-borde-acento);
}

.topbar__acciones {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  margin-left: auto;
  flex-shrink: 0;
}

.topbar__boton {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 3.8rem;
  height: 3.8rem;
  color: var(--color-texto-medio);
  border-radius: 50%;
  transition: background-color var(--transicion), color var(--transicion);
}

.topbar__boton:hover {
  background-color: var(--color-superficie-alta);
  color: var(--color-texto);
}

.topbar__notificacion {
  position: absolute;
  top: 0.6rem;
  right: 0.8rem;
  width: 0.8rem;
  height: 0.8rem;
  border-radius: 50%;
  background-color: var(--color-critico-fuerte);
  border: 0.2rem solid var(--color-fondo);
}

.topbar__avatar {
  width: 3.8rem;
  height: 3.8rem;
  border-radius: 50%;
  background: linear-gradient(
    135deg,
    var(--color-marca-turquesa),
    var(--color-marca-violeta)
  );
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  font-weight: 700;
  color: #fff;
}

/* ------------------------------------------------------------------ */
/* Contenedor de vistas                                                */
/* ------------------------------------------------------------------ */

.vista {
  flex: 1;
  padding: var(--espacio-xl) var(--espacio-lg);
  display: flex;
  flex-direction: column;
  gap: var(--espacio-lg);
}

.vista__cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--espacio-md);
  flex-wrap: wrap;
}

.vista__titulo {
  font-size: 3.6rem;
  letter-spacing: -0.02em;
}

.vista__subtitulo {
  margin-top: var(--espacio-xs);
  font-size: 1.5rem;
  color: var(--color-texto-medio);
}

.vista__meta {
  text-align: right;
  font-size: 1.2rem;
}

.vista__meta-titulo {
  font-weight: 700;
  color: var(--color-texto-medio);
  letter-spacing: 0.04em;
}

.vista__meta-estado {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--espacio-xs);
  margin-top: var(--espacio-xs);
  font-family: var(--fuente-mono);
  color: var(--color-texto);
  letter-spacing: 0.06em;
}

.vista__meta-punto {
  width: 0.6rem;
  height: 0.6rem;
  border-radius: 50%;
  background-color: var(--color-ok);
  animation: latido 2s ease-in-out infinite;
}

@keyframes latido {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}

/* ------------------------------------------------------------------ */
/* Botón de menú (solo móvil)                                          */
/* ------------------------------------------------------------------ */

.menu-movil {
  display: none;
  align-items: center;
  justify-content: center;
  width: 4rem;
  height: 4rem;
  color: var(--color-texto);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-md);
}

.sidebar__cerrar {
  display: none;
  position: absolute;
  top: var(--espacio-md);
  right: var(--espacio-md);
  width: 3.6rem;
  height: 3.6rem;
  align-items: center;
  justify-content: center;
  color: var(--color-texto-medio);
  border-radius: 50%;
}

/* ------------------------------------------------------------------ */
/* Adaptación a pantallas menores                                      */
/* ------------------------------------------------------------------ */

@media (max-width: 1100px) {
  .vista__titulo {
    font-size: 2.8rem;
  }
}

@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 60;
    width: min(30rem, 85vw);
    transform: translateX(-100%);
    transition: transform var(--transicion);
    box-shadow: var(--sombra-panel);
  }

  .sidebar.esta-abierta {
    transform: translateX(0);
  }

  .sidebar__cerrar {
    display: flex;
  }

  .menu-movil {
    display: flex;
  }

  .topbar {
    gap: var(--espacio-md);
    padding: 0 var(--espacio-md);
  }

  .topbar__titulo {
    font-size: 1.3rem;
  }

  .vista {
    padding: var(--espacio-lg) var(--espacio-md);
  }
}

@media (max-width: 620px) {
  .topbar__buscador {
    display: none;
  }

  /* La cabecera conserva el cambio de tema y el avatar: el resto de
     accesos permanece disponible desde el menú lateral. */
  .topbar__boton:not(.topbar__boton--tema) {
    display: none;
  }

  .topbar {
    gap: var(--espacio-sm);
    padding: 0 var(--espacio-sm);
  }

  .topbar__titulo {
    font-size: 1.1rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar__acciones {
    gap: var(--espacio-xs);
  }
}

/* Velo que oscurece el contenido cuando el menú móvil está abierto. */
.velo-menu {
  position: fixed;
  inset: 0;
  z-index: 50;
  background-color: rgba(0, 0, 0, 0.6);
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--transicion), visibility var(--transicion);
}

.velo-menu.esta-visible {
  opacity: 1;
  visibility: visible;
}


/* ===== src/css/componentes.css ===== */
/* =========================================================================
   LISA vigIA — Componentes reutilizables: paneles, indicadores KPI,
   semáforos de riesgo, tablas de casos, distintivos y botones.
   ========================================================================= */

/* ------------------------------------------------------------------ */
/* Panel genérico                                                      */
/* ------------------------------------------------------------------ */

.panel {
  background-color: var(--color-superficie);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  overflow: hidden;
  min-width: 0;
}

.panel__cabecera {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  padding: var(--espacio-md) var(--espacio-lg);
  border-bottom: 0.1rem solid var(--color-borde-suave);
}

.panel__titulo {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  font-size: 1.9rem;
  font-weight: 600;
}

.panel__cuerpo {
  padding: var(--espacio-lg);
}

/* ------------------------------------------------------------------ */
/* Distintivos                                                         */
/* ------------------------------------------------------------------ */

.distintivo {
  display: inline-flex;
  align-items: center;
  gap: var(--espacio-xs);
  padding: 0.6rem 1.2rem;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-radius: var(--radio-sm);
  white-space: nowrap;
}

.distintivo--critico {
  background-color: var(--color-critico-fuerte);
  color: #fff;
}

.distintivo--critico-suave {
  background-color: var(--color-critico-fondo);
  color: var(--color-critico);
  border: 0.1rem solid var(--color-critico);
}

.distintivo--neutro {
  background-color: var(--color-superficie-suave);
  color: var(--color-texto-medio);
}

.distintivo--medio {
  background-color: var(--color-medio-fondo);
  color: var(--color-medio);
  border: 0.1rem solid var(--color-medio);
}

.distintivo--ok {
  background-color: var(--color-ok-fondo);
  color: var(--color-ok);
  border: 0.1rem solid var(--color-ok);
}

/* ------------------------------------------------------------------ */
/* Botones                                                             */
/* ------------------------------------------------------------------ */

.boton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--espacio-sm);
  padding: 1.2rem 2rem;
  font-size: 1.4rem;
  font-weight: 600;
  border-radius: var(--radio-md);
  border: 0.1rem solid transparent;
  transition: background-color var(--transicion), border-color var(--transicion),
    filter var(--transicion);
}

.boton--primario {
  background-color: var(--color-accion);
  color: var(--color-sobre-accion);
}

.boton--primario:hover {
  filter: brightness(1.08);
}

.boton--peligro {
  background-color: var(--color-critico-fuerte);
  color: #fff;
}

.boton--peligro:hover {
  filter: brightness(1.08);
}

.boton--exito {
  background-color: var(--color-ok-fondo);
  color: var(--color-ok);
  border-color: var(--color-ok);
}

.boton--exito:hover {
  background-color: var(--color-ok-fondo-fuerte);
}

.boton--fantasma {
  background-color: transparent;
  color: var(--color-texto-medio);
  border-color: var(--color-borde);
}

.boton--fantasma:hover {
  background-color: var(--color-superficie-alta);
  color: var(--color-texto);
}

.boton[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ------------------------------------------------------------------ */
/* Tarjetas de indicadores (KPI)                                       */
/* ------------------------------------------------------------------ */

/* Cinco indicadores en una sola línea: el monto en riesgo ocupa el doble,
   de modo que la fila se reparte en seis fracciones iguales. */
.indicadores {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--espacio-md);
  align-items: stretch;
}

@media (max-width: 1500px) {
  .indicadores {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width: 1000px) {
  .indicadores {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 620px) {
  .indicadores {
    grid-template-columns: 1fr;
  }
}

.kpi {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-sm);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
}

.kpi--alerta {
  border-color: var(--color-borde-alerta);
}

.kpi--ancho {
  grid-column: span 2;
}

.kpi__cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--espacio-sm);
}

.kpi__titulo {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--color-texto-medio);
}

.kpi__icono {
  color: var(--color-texto-tenue);
  flex-shrink: 0;
}

.kpi__icono--alerta {
  color: var(--color-critico);
}

.kpi__valor {
  font-size: 4.2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
}

.kpi__valor--critico {
  color: var(--color-critico);
}

.kpi__valor--monto {
  font-size: 3.6rem;
  font-family: var(--fuente-mono);
}

.kpi__nota {
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.kpi__nota--alerta {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
  color: var(--color-critico);
}

/* Fila que combina porcentaje y barra de progreso. */
.kpi__medida {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
}

.kpi__porcentaje {
  font-size: 3.2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.barra {
  flex: 1;
  height: 0.6rem;
  background-color: var(--color-superficie-suave);
  border-radius: 999rem;
  overflow: hidden;
}

.barra__relleno {
  height: 100%;
  background-color: var(--color-critico);
  border-radius: 999rem;
  transition: width 600ms ease;
}

/* ------------------------------------------------------------------ */
/* Semáforo de riesgo                                                  */
/* ------------------------------------------------------------------ */

.semaforo {
  display: inline-flex;
  width: 1.8rem;
  height: 1.8rem;
  border-radius: 50%;
  border: 0.2rem solid currentColor;
}

.semaforo--alto {
  color: var(--color-critico);
  background-color: var(--color-critico-fondo);
}

.semaforo--medio {
  color: var(--color-medio);
  background-color: var(--color-medio-fondo);
}

.semaforo--bajo {
  color: var(--color-bajo);
  background-color: var(--color-bajo-fondo);
}

/* Versión grande usada en las cabeceras de sección del reporte. */
.semaforo--grande {
  width: 1.2rem;
  height: 1.2rem;
  border-width: 0;
  background-color: currentColor;
  box-shadow: 0 0 0.8rem currentColor;
}

/* ------------------------------------------------------------------ */
/* Tablas de casos                                                     */
/* ------------------------------------------------------------------ */

/* El scroll queda contenido aquí: min-width:0 impide que el ancho mínimo
   de la tabla empuje al panel y provoque scroll horizontal en la página. */
.tabla-envoltura {
  overflow-x: auto;
  min-width: 0;
  max-width: 100%;
}

.tabla-casos {
  min-width: 52rem;
}

/* La variante compacta cabe en la columna estrecha de casos leves. */
.tabla-casos--compacta {
  min-width: 34rem;
}

.tabla-casos--compacta thead th,
.tabla-casos--compacta td {
  padding-left: var(--espacio-md);
  padding-right: var(--espacio-md);
}

.tabla-casos thead th {
  padding: 1.2rem var(--espacio-lg);
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--color-texto-medio);
  text-align: left;
  background-color: var(--color-superficie-alta);
  border-bottom: 0.1rem solid var(--color-borde-suave);
  white-space: nowrap;
}

.tabla-casos th.col-centro,
.tabla-casos td.col-centro {
  text-align: center;
}

.tabla-casos th.col-derecha,
.tabla-casos td.col-derecha {
  text-align: right;
}

.tabla-casos tbody tr {
  border-bottom: 0.1rem solid var(--color-borde-suave);
  cursor: pointer;
  transition: background-color var(--transicion);
}

.tabla-casos tbody tr:hover,
.tabla-casos tbody tr:focus-visible {
  background-color: var(--color-superficie-alta);
}

.tabla-casos tbody tr.esta-destacada {
  background-color: var(--color-fila-critica);
}

.tabla-casos tbody tr.esta-destacada:hover {
  background-color: var(--color-fila-critica-fuerte);
}

.tabla-casos td {
  padding: 1.4rem var(--espacio-lg);
  vertical-align: middle;
}

.celda-beneficiario__nombre {
  font-family: var(--fuente-mono);
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--color-texto);
}

.celda-beneficiario__rut {
  font-family: var(--fuente-mono);
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
  margin-top: 0.2rem;
}

.puntaje {
  font-family: var(--fuente-mono);
  font-size: 1.5rem;
  font-weight: 700;
}

.puntaje--alto {
  color: var(--color-critico);
}

.puntaje--medio {
  color: var(--color-medio);
}

.puntaje--bajo {
  color: var(--color-texto-medio);
}

/* Recuadro que enmarca el puntaje del caso más grave. */
.puntaje--marcado {
  display: inline-block;
  padding: 0.4rem 1rem;
  border: 0.1rem solid var(--color-critico-fuerte);
  border-radius: var(--radio-sm);
  background-color: var(--color-critico-fondo);
}

/* Cuadrícula que reparte las dos listas de casos del panel inicial.
   minmax(0,·) evita que el contenido ancho estire las columnas. */
.listados {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: var(--espacio-md);
  align-items: start;
}

@media (max-width: 1250px) {
  .listados {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 620px) {
  .kpi--ancho {
    grid-column: span 1;
  }
}

/* ------------------------------------------------------------------ */
/* Modales                                                             */
/* ------------------------------------------------------------------ */

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--espacio-md);
  background-color: rgba(4, 4, 6, 0.72);
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--transicion), visibility var(--transicion);
}

.modal.esta-visible {
  opacity: 1;
  visibility: visible;
}

.modal__caja {
  width: min(56rem, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background-color: var(--color-superficie);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-lg);
  box-shadow: var(--sombra-panel);
  transform: translateY(1.2rem);
  transition: transform var(--transicion);
}

.modal.esta-visible .modal__caja {
  transform: translateY(0);
}

.modal__cabecera {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  padding: var(--espacio-lg);
  border-bottom: 0.1rem solid var(--color-borde-suave);
}

.modal__titulo {
  font-size: 1.9rem;
}

.modal__cerrar {
  margin-left: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 3.4rem;
  height: 3.4rem;
  color: var(--color-texto-medio);
  border-radius: 50%;
}

.modal__cerrar:hover {
  background-color: var(--color-superficie-alta);
  color: var(--color-texto);
}

.modal__cuerpo {
  padding: var(--espacio-lg);
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
  font-size: 1.4rem;
  color: var(--color-texto-medio);
}

.modal__pie {
  display: flex;
  justify-content: flex-end;
  gap: var(--espacio-sm);
  padding: var(--espacio-lg);
  border-top: 0.1rem solid var(--color-borde-suave);
  flex-wrap: wrap;
}

/* Campos de formulario dentro de modales. */
.campo {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-xs);
}

.campo__control {
  width: 100%;
  padding: 1.1rem 1.4rem;
  font-family: inherit;
  font-size: 1.4rem;
  color: var(--color-texto);
  background-color: var(--color-fondo);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-md);
  resize: vertical;
}

.campo__control:focus {
  outline: none;
  border-color: var(--color-borde-acento);
}

.campo__error {
  font-size: 1.2rem;
  color: var(--color-critico);
  min-height: 1.6rem;
}

/* Resumen de adjuntos dentro del modal de correo. */
.adjunto {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  padding: 1.2rem;
  background-color: var(--color-fondo);
  border: 0.1rem dashed var(--color-borde);
  border-radius: var(--radio-md);
  font-family: var(--fuente-mono);
  font-size: 1.3rem;
  color: var(--color-texto);
}

/* ------------------------------------------------------------------ */
/* Avisos flotantes (sustituyen a alert)                               */
/* ------------------------------------------------------------------ */

.avisos {
  position: fixed;
  right: var(--espacio-lg);
  bottom: var(--espacio-lg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: var(--espacio-sm);
  max-width: min(38rem, calc(100vw - 3.2rem));
}

.aviso {
  display: flex;
  align-items: flex-start;
  gap: var(--espacio-sm);
  padding: var(--espacio-md);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde);
  border-left: 0.3rem solid var(--color-accion);
  border-radius: var(--radio-md);
  box-shadow: var(--sombra-panel);
  font-size: 1.3rem;
  animation: aviso-entra 200ms ease;
}

.aviso--exito {
  border-left-color: var(--color-ok);
}

.aviso--exito .aviso__icono {
  color: var(--color-ok);
}

.aviso--alerta {
  border-left-color: var(--color-critico);
}

.aviso--alerta .aviso__icono {
  color: var(--color-critico);
}

.aviso__icono {
  flex-shrink: 0;
  color: var(--color-accion);
  margin-top: 0.1rem;
}

.aviso__titulo {
  font-weight: 700;
  color: var(--color-texto);
}

.aviso__texto {
  color: var(--color-texto-medio);
  margin-top: 0.2rem;
}

@keyframes aviso-entra {
  from {
    opacity: 0;
    transform: translateY(1rem);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Estado vacío para listados sin resultados. */
.estado-vacio {
  padding: var(--espacio-xl);
  text-align: center;
  color: var(--color-texto-tenue);
  font-size: 1.4rem;
}


/* ===== src/css/reporte.css ===== */
/* =========================================================================
   LISA vigIA — Vista de reporte de caso: ficha del siniestro, secciones
   de evidencia, visor del documento y gráficos de patrones.
   ========================================================================= */

/* ------------------------------------------------------------------ */
/* Ficha superior del caso                                             */
/* ------------------------------------------------------------------ */

.ficha {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--espacio-lg);
  padding: var(--espacio-lg) var(--espacio-lg) var(--espacio-lg) var(--espacio-xl);
  background-color: var(--color-panel-datos);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-lg);
  overflow: hidden;
}

/* Franja lateral cuyo color refleja la criticidad del caso. */
.ficha::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 0.5rem;
  height: 100%;
  background-color: var(--color-critico);
}

.ficha--leve::before {
  background-color: var(--color-bajo);
}

.ficha__identidad {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
  flex-wrap: wrap;
}

.ficha__nombre {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  font-size: 3.2rem;
  letter-spacing: -0.02em;
}

.ficha__rut {
  padding: 0.6rem 1.2rem;
  font-family: var(--fuente-mono);
  font-size: 1.4rem;
  background-color: var(--color-superficie-suave);
  border-radius: var(--radio-sm);
}

.ficha__siniestro {
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.ficha__siniestro strong {
  font-family: var(--fuente-mono);
  color: var(--color-texto);
  letter-spacing: 0.04em;
}

/* Cuadrícula de datos del siniestro. */
.ficha__datos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
  gap: var(--espacio-md);
  margin-top: var(--espacio-lg);
}

.ficha__dato-valor {
  margin-top: 0.4rem;
  font-size: 1.6rem;
  color: var(--color-texto);
}

.ficha__dato-valor--monto {
  font-family: var(--fuente-mono);
  font-size: 2.2rem;
  font-weight: 700;
}

.ficha__dato-secundario {
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
  margin-top: 0.2rem;
}

/* Sello circular de probabilidad de fraude. */
.sello {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--espacio-sm);
  align-self: start;
  min-width: 22rem;
  padding: var(--espacio-lg);
  border: 0.1rem solid var(--color-critico);
  border-radius: var(--radio-md);
  background-color: var(--color-critico-fondo);
  text-align: center;
}

.sello--leve {
  border-color: var(--color-bajo);
  background-color: var(--color-bajo-fondo);
}

.sello__circulo {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 7rem;
  height: 7rem;
  border-radius: 50%;
  background-color: var(--color-critico);
  color: var(--color-superficie);
  font-family: var(--fuente-mono);
  font-size: 2rem;
  font-weight: 700;
  box-shadow: 0 0 2.4rem rgba(242, 133, 127, 0.4);
}

.sello--leve .sello__circulo {
  background-color: var(--color-bajo);
  color: var(--color-superficie);
  box-shadow: 0 0 2.4rem rgba(110, 168, 216, 0.35);
}

.sello__texto {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-critico);
}

.sello--leve .sello__texto {
  color: var(--color-bajo);
}

.sello__escala {
  font-size: 1.1rem;
  color: var(--color-texto-medio);
}

/* ------------------------------------------------------------------ */
/* Secciones de evidencia                                              */
/* ------------------------------------------------------------------ */

.seccion__cabecera {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  padding: var(--espacio-md) var(--espacio-lg);
  border-bottom: 0.1rem solid var(--color-borde-suave);
  background-color: var(--color-superficie-alta);
}

.seccion__titulo {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  font-size: 1.9rem;
}

.seccion__distintivo {
  margin-left: auto;
}

/* Documento a la izquierda, hallazgos a la derecha. */
.seccion__doble {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}

.seccion__columna {
  padding: var(--espacio-lg);
  min-width: 0;
}

.seccion__columna + .seccion__columna {
  border-left: 0.1rem solid var(--color-borde-suave);
}

@media (max-width: 1000px) {
  .seccion__doble {
    grid-template-columns: minmax(0, 1fr);
  }

  .seccion__columna + .seccion__columna {
    border-left: none;
    border-top: 0.1rem solid var(--color-borde-suave);
  }

  .ficha {
    grid-template-columns: minmax(0, 1fr);
  }

  .sello {
    min-width: 0;
  }
}

@media (max-width: 620px) {
  /* Las acciones de cierre pasan a ocupar el ancho completo, en columna. */
  .decision__acciones {
    width: 100%;
    flex-direction: column;
  }

  .decision__acciones .boton {
    width: 100%;
  }

  .ficha {
    padding: var(--espacio-md) var(--espacio-md) var(--espacio-md) var(--espacio-lg);
  }

  .ficha__nombre {
    font-size: 2.4rem;
  }

  .ficha__identidad {
    gap: var(--espacio-sm);
  }

  .seccion__columna {
    padding: var(--espacio-md);
  }

  .seccion__cabecera {
    flex-wrap: wrap;
    padding: var(--espacio-md);
  }

  .seccion__distintivo {
    margin-left: 0;
  }
}

/* ------------------------------------------------------------------ */
/* Visor del documento con marcas de anomalía                          */
/* ------------------------------------------------------------------ */

.documento {
  position: relative;
  background-color: #ffffff;
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-md);
  overflow: hidden;
  line-height: 0;
}

.documento__imagen {
  width: 100%;
  height: auto;
  display: block;
}

/* Capa transparente que aloja las marcas sobre la imagen. */
.documento__capa {
  position: absolute;
  inset: 0;
}

.documento__marca {
  position: absolute;
  border: 0.2rem solid var(--color-critico-fuerte);
  border-radius: 0.3rem;
  cursor: help;
  padding: 0;
  transition: box-shadow var(--transicion), transform var(--transicion);
  animation: marca-late 2.8s ease-in-out infinite;
}

.documento__marca:hover,
.documento__marca:focus-visible {
  animation: none;
  transform: scale(1.03);
  box-shadow: 0 0 0 0.3rem rgba(229, 72, 77, 0.25);
  z-index: 2;
}

.documento__marca--metadato:hover,
.documento__marca--metadato:focus-visible {
  box-shadow: 0 0 0 0.3rem rgba(124, 108, 224, 0.25);
}

@keyframes marca-late {
  0%,
  100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.35);
  }
}

/* Rótulo flotante sobre cada zona marcada. */
.documento__etiqueta {
  position: absolute;
  top: -1.9rem;
  left: -0.2rem;
  padding: 0.2rem 0.6rem;
  font-size: 1rem;
  font-weight: 700;
  font-family: var(--fuente-mono);
  line-height: 1.5;
  color: #fff;
  border-radius: 0.3rem;
  white-space: nowrap;
}

/* La etiqueta de la primera marca cae hacia dentro para no salirse. */
.documento__marca:first-child .documento__etiqueta {
  top: auto;
  bottom: -1.9rem;
}

.documento__pie {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
  margin-top: var(--espacio-sm);
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
  flex-wrap: wrap;
  line-height: 1.5;
}

.documento__origen {
  margin-left: auto;
  font-family: var(--fuente-mono);
}

/* Texto que describe la marca activa. */
.documento__detalle {
  margin-top: var(--espacio-sm);
  padding: 1.2rem;
  min-height: 6.4rem;
  font-size: 1.25rem;
  color: var(--color-texto-tenue);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
  transition: color var(--transicion), border-color var(--transicion);
}

.documento__detalle.esta-activo {
  color: var(--color-texto);
  border-color: var(--color-borde-alerta);
}

.documento__leyenda {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
}

.documento__muestra {
  width: 1.2rem;
  height: 0.8rem;
  border-radius: 0.2rem;
  border: 0.1rem solid var(--color-critico);
  background-color: var(--color-critico-fondo);
}

.documento__muestra--meta {
  border-color: #7c6ce0;
  background-color: rgba(124, 108, 224, 0.18);
}

/* ------------------------------------------------------------------ */
/* Hallazgos                                                           */
/* ------------------------------------------------------------------ */

.hallazgos {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
}

.hallazgos__grupo-titulo {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--color-texto);
  margin-bottom: var(--espacio-sm);
}

.hallazgo {
  display: flex;
  align-items: flex-start;
  gap: 1.2rem;
  padding: 1.4rem;
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
  font-size: 1.35rem;
  color: var(--color-texto-medio);
}

.hallazgo + .hallazgo {
  margin-top: var(--espacio-sm);
}

.hallazgo--critico {
  border-color: var(--color-borde-alerta);
}

.hallazgo__icono {
  flex-shrink: 0;
  color: var(--color-critico);
  margin-top: 0.2rem;
}

.hallazgo__icono--medio {
  color: var(--color-medio);
}

.hallazgo__icono--ok {
  color: var(--color-ok);
}

.hallazgo__titulo {
  font-weight: 700;
  color: var(--color-texto);
  margin-bottom: 0.2rem;
}

.hallazgo strong {
  color: var(--color-texto);
}

/* Bloque de metadatos con aspecto de consola. */
.metadatos {
  padding: 1.6rem;
  background-color: var(--color-fondo);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
  font-family: var(--fuente-mono);
  font-size: 1.3rem;
  line-height: 1.9;
  /* Las rutas y marcas de tiempo largas se parten en vez de desbordar. */
  overflow-wrap: anywhere;
}

.metadatos__linea {
  color: var(--color-texto-medio);
}

.metadatos__clave {
  color: var(--color-texto-tenue);
}

.metadatos__separador {
  height: 0.1rem;
  background-color: var(--color-borde-suave);
  margin: var(--espacio-sm) 0;
}

.metadatos__alerta {
  color: var(--color-critico);
}

/* ------------------------------------------------------------------ */
/* Gráficos                                                            */
/* ------------------------------------------------------------------ */

.grafico {
  position: relative;
  margin-top: var(--espacio-md);
  background-color: var(--color-fondo);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
  padding: var(--espacio-md);
  min-width: 0;
  overflow: hidden;
}

.grafico__lienzo {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}

/* En pantallas estrechas los gráficos pensados para escritorio conservan un
   ancho mínimo legible y resuelven el desplazamiento dentro de su propia
   caja. Los que tienen disposición vertical propia quedan excluidos: ya
   están compuestos para ese ancho y no necesitan desplazarse. */
@media (max-width: 760px) {
  .grafico:not(.grafico--vertical) {
    overflow-x: auto;
  }

  .grafico:not(.grafico--vertical) .grafico__lienzo {
    min-width: 60rem;
  }

  .grafico--vertical {
    padding: var(--espacio-sm);
  }

  .grafico--vertical .grafico__leyenda {
    gap: var(--espacio-sm);
    font-size: 1.1rem;
  }
}

.grafico__titulo {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--color-texto);
  margin-bottom: var(--espacio-xs);
}

.grafico__ayuda {
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
  margin-bottom: var(--espacio-md);
}

.grafico__leyenda {
  display: flex;
  flex-wrap: wrap;
  gap: var(--espacio-md);
  margin-top: var(--espacio-md);
  font-size: 1.2rem;
  color: var(--color-texto-medio);
}

.grafico__leyenda-item {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
}

.grafico__muestra {
  width: 1rem;
  height: 1rem;
  border-radius: 50%;
}

/* Muestra rectangular para las series dibujadas como columnas. */
.grafico__muestra--barra {
  width: 0.9rem;
  height: 1.4rem;
  border-radius: 0.2rem;
}

/* Muestra en forma de guía vertical discontinua. */
.grafico__muestra--guia {
  width: 0;
  height: 1.4rem;
  border-radius: 0;
  border-left: 0.2rem dashed currentColor;
  background-color: transparent;
}

/* Elementos interactivos dentro de los SVG. */
.punto-dato {
  cursor: pointer;
  transition: r 120ms ease, opacity 120ms ease;
}

.punto-dato:hover {
  opacity: 0.85;
}

.nodo-red {
  cursor: pointer;
}

.nodo-red:hover .nodo-red__circulo {
  stroke-width: 3;
}

/* Globo informativo compartido por ambos gráficos. */
/* El globo informativo se mantiene oscuro en ambos temas: al flotar sobre
   el gráfico necesita separarse de él, y en el tema diurno una tarjeta
   clara sobre panel claro perdería ese despegue. Sus colores son fijos,
   no tokens, precisamente para no seguir al tema. */
.tooltip {
  position: absolute;
  z-index: 20;
  min-width: 22rem;
  padding: 1.2rem;
  background-color: #1c1f28;
  border: 0.1rem solid #3a3f4d;
  border-radius: var(--radio-md);
  box-shadow: 0 0.4rem 2rem rgba(8, 10, 16, 0.45);
  font-size: 1.2rem;
  color: #f2f2f5;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 120ms ease, visibility 120ms ease;
}

.tooltip.esta-visible {
  opacity: 1;
  visibility: visible;
}

.tooltip__titulo {
  font-size: 1.3rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: var(--espacio-xs);
  padding-bottom: var(--espacio-xs);
  border-bottom: 0.1rem solid #3a3f4d;
}

.tooltip__fila {
  display: flex;
  justify-content: space-between;
  gap: var(--espacio-md);
  line-height: 1.8;
}

.tooltip__clave {
  color: #a3aab8;
}

.tooltip__valor {
  font-family: var(--fuente-mono);
  color: #ffffff;
  text-align: right;
}

/* ------------------------------------------------------------------ */
/* Casos relacionados                                                  */
/* ------------------------------------------------------------------ */

.relacionados {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-sm);
  margin-top: var(--espacio-md);
}

.relacionado {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
  width: 100%;
  padding: 1.2rem 1.6rem;
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
  text-align: left;
  transition: border-color var(--transicion), background-color var(--transicion);
}

.relacionado:hover {
  border-color: var(--color-borde-acento);
  background-color: var(--color-superficie-suave);
}

.relacionado__datos {
  flex: 1;
  min-width: 0;
}

/* El nombre ocupa su propia línea para no pegarse al RUT que le sigue. */
.relacionado__nombre {
  display: block;
  font-family: var(--fuente-mono);
  font-size: 1.35rem;
  font-weight: 600;
  color: var(--color-texto);
}

.relacionado__meta {
  display: block;
}

.relacionado__meta {
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
  margin-top: 0.2rem;
}

.relacionado__monto {
  font-family: var(--fuente-mono);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--color-critico);
  white-space: nowrap;
}

/* ------------------------------------------------------------------ */
/* Barra de decisión del analista                                      */
/* ------------------------------------------------------------------ */

.decision {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  flex-wrap: wrap;
}

.decision__texto {
  flex: 1;
  min-width: min(24rem, 100%);
}

.decision__titulo {
  font-size: 1.6rem;
  font-weight: 600;
  color: var(--color-texto);
}

.decision__ayuda {
  font-size: 1.3rem;
  color: var(--color-texto-medio);
  margin-top: 0.2rem;
}

.decision__acciones {
  display: flex;
  gap: var(--espacio-sm);
  flex-wrap: wrap;
}

/* Resultado mostrado una vez tomada la decisión. */
.resuelto {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  padding: var(--espacio-md);
  border-radius: var(--radio-md);
  font-size: 1.4rem;
}

.resuelto--fraude {
  background-color: var(--color-critico-fondo);
  border: 0.1rem solid var(--color-critico);
  color: var(--color-critico);
}

.resuelto--liquidacion {
  background-color: var(--color-ok-fondo);
  border: 0.1rem solid var(--color-ok);
  color: var(--color-ok);
}

/* Enlace de regreso al panel. */
.volver {
  display: inline-flex;
  align-items: center;
  gap: var(--espacio-xs);
  font-size: 1.3rem;
  color: var(--color-texto-medio);
  transition: color var(--transicion);
}

.volver:hover {
  color: var(--color-texto);
}


/* ===== src/css/secciones.css ===== */
/* =========================================================================
   LISA vigIA — Estilos de las secciones de análisis: fichas de prestador,
   verificadores forenses y patrones de fraude archivados.
   ========================================================================= */

/* ------------------------------------------------------------------ */
/* Utilidades compartidas                                              */
/* ------------------------------------------------------------------ */

.texto-tenue {
  color: var(--color-texto-tenue);
  font-size: 1.3rem;
}

/* Etiqueta que resume un hallazgo del peritaje. */
.marca-hallazgo {
  display: inline-block;
  padding: 0.3rem 0.8rem;
  font-size: 1.1rem;
  font-family: var(--fuente-mono);
  color: var(--color-texto-medio);
  background-color: var(--color-superficie-suave);
  border: 0.1rem solid var(--color-borde);
  border-radius: var(--radio-sm);
  white-space: nowrap;
}

.marcas-hallazgo {
  display: flex;
  flex-wrap: wrap;
  gap: var(--espacio-xs);
}

/* ------------------------------------------------------------------ */
/* Fichas de prestador (Análisis de red)                               */
/* ------------------------------------------------------------------ */

.prestadores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(38rem, 1fr));
  gap: var(--espacio-md);
  align-items: start;
}

.prestador {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  min-width: 0;
}

.prestador--critico {
  border-color: var(--color-borde-alerta);
  background-color: var(--color-fila-critica);
}

.prestador__cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--espacio-md);
  flex-wrap: wrap;
}

.prestador__nombre {
  font-size: 1.8rem;
  font-weight: 600;
}

.prestador__meta {
  margin-top: 0.2rem;
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
}

.prestador__metricas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  gap: var(--espacio-md);
  padding: var(--espacio-md) 0;
  border-top: 0.1rem solid var(--color-borde-suave);
  border-bottom: 0.1rem solid var(--color-borde-suave);
}

.prestador__metrica {
  margin-top: 0.4rem;
  font-family: var(--fuente-mono);
  font-size: 1.7rem;
  font-weight: 700;
  color: var(--color-texto);
}

.prestador__nota {
  font-size: 1.35rem;
  color: var(--color-texto-medio);
}

/* ------------------------------------------------------------------ */
/* Verificadores (Herramientas forenses)                               */
/* ------------------------------------------------------------------ */

.verificadores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(28rem, 1fr));
  gap: var(--espacio-md);
}

.verificador {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  min-width: 0;
}

.verificador__cabecera {
  display: flex;
  align-items: center;
  gap: var(--espacio-md);
}

.verificador__icono {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 4.4rem;
  height: 4.4rem;
  flex-shrink: 0;
  color: var(--color-accion);
  background-color: var(--color-superficie-suave);
  border-radius: var(--radio-md);
}

.verificador__nombre {
  font-size: 1.6rem;
  font-weight: 600;
}

.verificador__estado {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
  margin-top: 0.2rem;
  font-size: 1.2rem;
  color: var(--color-ok);
}

.verificador__punto {
  width: 0.6rem;
  height: 0.6rem;
  border-radius: 50%;
  background-color: var(--color-ok);
  animation: latido 2s ease-in-out infinite;
}

.verificador__descripcion {
  flex: 1;
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.verificador__pie {
  display: flex;
  gap: var(--espacio-xl);
  padding-top: var(--espacio-md);
  border-top: 0.1rem solid var(--color-borde-suave);
}

.verificador__cifra {
  margin-top: 0.4rem;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--color-texto);
}

/* ------------------------------------------------------------------ */
/* Patrones aprendidos (Inteligencia archivada)                        */
/* ------------------------------------------------------------------ */

/* Los grupos de patrones son de cuatro: la retícula pasa de 4 a 2 y a 1
   columna, sin estados intermedios que dejen una tarjeta suelta. */
.patrones {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--espacio-md);
}

@media (max-width: 1500px) {
  .patrones {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.patron {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-sm);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  min-width: 0;
}

.patron__cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--espacio-sm);
  flex-wrap: wrap;
}

.patron__nombre {
  font-size: 1.6rem;
  font-weight: 600;
}

.patron__tendencia {
  display: inline-flex;
  align-items: center;
  gap: var(--espacio-xs);
  font-size: 1.15rem;
  font-family: var(--fuente-mono);
}

.patron__tendencia--sube {
  color: var(--color-critico);
}

.patron__tendencia--baja {
  color: var(--color-ok);
}

/* La flecha apunta hacia abajo cuando la tendencia decrece. */
.patron__tendencia--baja .icono {
  transform: scaleY(-1);
}

.patron__descripcion {
  flex: 1;
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.patron__medida {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--espacio-md);
  padding-top: var(--espacio-md);
  border-top: 0.1rem solid var(--color-borde-suave);
  flex-wrap: wrap;
}

.patron__cifra .puntaje {
  font-size: 2.4rem;
}

.patron__peso {
  flex: 1;
  min-width: 16rem;
}

.patron__porcentaje {
  font-family: var(--fuente-mono);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--color-texto);
}

/* ------------------------------------------------------------------ */
/* Top diez de fraudes                                                 */
/* ------------------------------------------------------------------ */

/* Número de orden dentro del ranking. */
.posicion {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.4rem;
  height: 2.4rem;
  font-family: var(--fuente-mono);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--color-texto-medio);
  background-color: var(--color-superficie-suave);
  border-radius: 50%;
}

/* Los tres primeros puestos llevan el número en el color de alarma. */
.esta-destacada .posicion {
  color: var(--color-critico);
  background-color: var(--color-critico-fondo);
}

.monto-top {
  font-family: var(--fuente-mono);
  font-size: 1.45rem;
  font-weight: 700;
  color: var(--color-critico);
  white-space: nowrap;
}

/* Texto introductorio de un panel. */
.panel__intro {
  max-width: 78ch;
  margin-bottom: var(--espacio-lg);
  font-size: 1.35rem;
  color: var(--color-texto-medio);
}

/* ------------------------------------------------------------------ */
/* Titular de la evolución del modelo                                  */
/* ------------------------------------------------------------------ */

.titular {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: var(--espacio-xl);
  align-items: center;
  padding: var(--espacio-xl);
  background:
    radial-gradient(
      120% 140% at 0% 0%,
      var(--color-ok-fondo),
      transparent 60%
    ),
    var(--color-superficie);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
}

.titular__frase {
  margin-top: var(--espacio-md);
  font-size: 3rem;
  line-height: 1.25;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.titular__frase strong {
  color: var(--color-ok);
}

.titular__nota {
  max-width: 60ch;
  margin-top: var(--espacio-md);
  font-size: 1.4rem;
  color: var(--color-texto-medio);
}

.titular__cifras {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--espacio-md);
}

.titular__cifra {
  padding: var(--espacio-md);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-md);
}

.titular__valor {
  margin-top: 0.4rem;
  font-family: var(--fuente-mono);
  /* La cifra se encoge si la tarjeta es estrecha, de modo que un monto
     largo no desborde el ancho de su columna. */
  font-size: clamp(2rem, 2.4vw, 2.8rem);
  font-weight: 700;
  line-height: 1;
  color: var(--color-texto);
  overflow-wrap: anywhere;
}

/* Nota al pie de las cifras acumuladas, que no evolucionan mes a mes. */
.titular__pie {
  margin-top: var(--espacio-xs);
  font-size: 1.15rem;
  color: var(--color-texto-tenue);
}

.titular__variacion {
  display: flex;
  align-items: center;
  gap: var(--espacio-xs);
  margin-top: var(--espacio-xs);
  font-size: 1.15rem;
}

.titular__variacion--buena {
  color: var(--color-ok);
}

.titular__variacion--mala {
  color: var(--color-critico);
}

/* La flecha se invierte cuando la métrica desciende. */
.titular__variacion--buena .icono {
  transform: scaleY(-1);
}

/* ------------------------------------------------------------------ */
/* Línea de tiempo de hitos                                            */
/* ------------------------------------------------------------------ */

/* Los seis hitos se reparten en una sola fila, o en dos de tres cuando el
   ancho no alcanza, de modo que la secuencia siga leyéndose completa. */
.hitos {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: var(--espacio-lg);
  counter-reset: hito;
}

@media (max-width: 1500px) {
  .hitos {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 1000px) {
  .hitos {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.hito {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--espacio-sm);
  padding-top: var(--espacio-lg);
}

/* Riel horizontal que une los hitos consecutivos. */
.hito::before {
  content: "";
  position: absolute;
  top: 1.4rem;
  left: 0;
  width: 100%;
  height: 0.2rem;
  background-color: var(--color-borde);
}

.hito:last-child::before {
  width: 1.4rem;
}

.hito__marca {
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.8rem;
  height: 2.8rem;
  font-family: var(--fuente-mono);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--color-fondo);
  background-color: var(--color-accion);
  border: 0.3rem solid var(--color-superficie);
  border-radius: 50%;
}

/* El último hito marca el estado actual del modelo. */
.hito:last-child .hito__marca {
  background-color: var(--color-ok);
}

.hito__mes {
  font-size: 1.15rem;
  font-family: var(--fuente-mono);
  color: var(--color-texto-tenue);
}

.hito__titulo {
  font-size: 1.45rem;
  font-weight: 600;
  text-wrap: balance;
}

.hito__descripcion {
  flex: 1;
  font-size: 1.25rem;
  color: var(--color-texto-medio);
}

.hito__precision strong {
  font-family: var(--fuente-mono);
  font-size: 1.4rem;
  color: var(--color-ok);
}

/* ------------------------------------------------------------------ */
/* Casos recuperados                                                   */
/* ------------------------------------------------------------------ */

.recuperados {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(26rem, 1fr));
  gap: var(--espacio-md);
}

.recuperado {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
  padding: var(--espacio-lg);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-radius: var(--radio-lg);
  min-width: 0;
}

.recuperado__nombre {
  font-family: var(--fuente-mono);
  font-size: 1.45rem;
  font-weight: 600;
}

.recuperado__meta {
  margin-top: 0.2rem;
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
}

.recuperado__salto {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--espacio-md);
  padding: var(--espacio-md);
  background-color: var(--color-fondo);
  border-radius: var(--radio-md);
}

.recuperado__salto .puntaje {
  font-size: 2.6rem;
}

/* El puntaje original se muestra tachado: ya no es el vigente. */
.recuperado__antes {
  text-decoration: line-through;
  opacity: 0.6;
}

.recuperado__flecha {
  color: var(--color-texto-tenue);
}

.recuperado__pie {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--espacio-sm);
  flex-wrap: wrap;
}

.recuperado__monto {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--color-critico);
}

/* ------------------------------------------------------------------ */
/* Reincidentes                                                        */
/* ------------------------------------------------------------------ */

.reincidentes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(30rem, 1fr));
  gap: var(--espacio-md);
}

.reincidente {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-md);
  padding: var(--espacio-lg);
  background-color: var(--color-fila-critica);
  border: 0.1rem solid var(--color-borde-alerta);
  border-radius: var(--radio-lg);
  min-width: 0;
}

.reincidente__cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--espacio-sm);
  flex-wrap: wrap;
}

.reincidente__nombre {
  font-size: 1.6rem;
  font-weight: 600;
}

.reincidente__meta {
  margin-top: 0.2rem;
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
}

/* Dos lados enfrentados: lo confirmado frente a lo que sigue abierto. */
.reincidente__balance {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--espacio-md);
  padding: var(--espacio-md) 0;
  border-top: 0.1rem solid var(--color-borde-suave);
  border-bottom: 0.1rem solid var(--color-borde-suave);
}

.reincidente__lado + .reincidente__lado {
  padding-left: var(--espacio-md);
  border-left: 0.1rem solid var(--color-borde-suave);
}

.reincidente__cifra {
  margin-top: 0.4rem;
  font-family: var(--fuente-mono);
  font-size: 3rem;
  font-weight: 700;
  line-height: 1;
}

.reincidente__cifra--historica {
  color: var(--color-texto-medio);
}

.reincidente__cifra--activa {
  color: var(--color-critico);
}

.reincidente__monto {
  margin-top: 0.2rem;
  font-family: var(--fuente-mono);
  font-size: 1.2rem;
  color: var(--color-texto-tenue);
}

.reincidente__nota {
  flex: 1;
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

.reincidente__accion {
  align-self: flex-start;
}

/* ------------------------------------------------------------------ */
/* Señales anticipadas                                                 */
/* ------------------------------------------------------------------ */

/* Las tres señales comparten fila, o pasan a una sola columna: repartirlas
   en dos dejaría una tarjeta suelta. */
.senales {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--espacio-md);
}

@media (max-width: 1100px) {
  .senales {
    grid-template-columns: minmax(0, 1fr);
  }
}

.senal {
  padding: var(--espacio-lg);
  background-color: var(--color-superficie-alta);
  border: 0.1rem solid var(--color-borde-suave);
  border-left: 0.3rem solid var(--color-medio);
  border-radius: var(--radio-md);
  min-width: 0;
}

.senal--alto {
  border-left-color: var(--color-critico);
}

.senal--alto .senal__icono {
  color: var(--color-critico);
}

.senal__cabecera {
  display: flex;
  align-items: center;
  gap: var(--espacio-sm);
  margin-bottom: var(--espacio-sm);
}

.senal__icono {
  flex-shrink: 0;
  color: var(--color-medio);
}

.senal__titulo {
  flex: 1;
  font-size: 1.45rem;
  font-weight: 600;
}

.senal__variacion {
  font-family: var(--fuente-mono);
  font-size: 1.3rem;
  font-weight: 700;
}

.senal__detalle {
  font-size: 1.3rem;
  color: var(--color-texto-medio);
}

/* ------------------------------------------------------------------ */
/* Adaptación a pantallas menores                                      */
/* ------------------------------------------------------------------ */

@media (max-width: 1100px) {
  .titular {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--espacio-lg);
  }

  .titular__frase {
    font-size: 2.4rem;
  }
}

@media (max-width: 620px) {
  .prestadores,
  .verificadores,
  .patrones,
  .recuperados,
  .reincidentes,
  .senales,
  .hitos {
    grid-template-columns: minmax(0, 1fr);
  }

  .prestador,
  .verificador,
  .patron,
  .recuperado,
  .reincidente,
  .senal {
    padding: var(--espacio-md);
  }

  .verificador__pie {
    gap: var(--espacio-lg);
  }

  .titular {
    padding: var(--espacio-lg);
  }

  .titular__cifras {
    grid-template-columns: minmax(0, 1fr);
  }

  /* En una sola columna el riel de los hitos pasa a ser vertical. */
  .hito::before {
    top: 2.8rem;
    left: 1.3rem;
    width: 0.2rem;
    height: calc(100% - 2.8rem);
  }

  .hito:last-child::before {
    height: 0;
  }

  .hito {
    padding-top: 0;
    padding-left: 4.4rem;
    min-height: 2.8rem;
  }
}


/* ===== src/css/impresion.css ===== */
/* =========================================================================
   LISA vigIA — Hoja de impresión. Convierte el reporte en pantalla en un
   documento apto para "Guardar como PDF" desde el diálogo del navegador:
   fondo claro, sin navegación y sin cortes a mitad de sección.
   ========================================================================= */

@media print {
  @page {
    size: A4;
    margin: 14mm;
  }

  :root {
    --color-fondo: #ffffff;
    --color-superficie: #ffffff;
    --color-superficie-alta: #f5f5f7;
    --color-superficie-suave: #eeeef2;
    --color-panel-datos: #f5f7fa;
    --color-borde: #c8c8d0;
    --color-borde-suave: #dcdce2;
    --color-borde-acento: #a8a8b4;
    --color-texto: #101014;
    --color-texto-medio: #3c3c46;
    --color-texto-tenue: #62626e;
    --color-critico: #c0272d;
    --color-critico-fuerte: #c0272d;
    --color-critico-fondo: #fdeaea;
    --color-medio: #8a6100;
    --color-medio-fondo: #fdf3e0;
    --color-bajo: #1f5f8f;
    --color-bajo-fondo: #e8f1f8;
    --color-ok: #1c6b4e;
  }

  body {
    background-color: #fff;
    color: #101014;
    font-size: 1.15rem;
  }

  /* Fuerza el pintado de fondos y bordes de color en la impresión. */
  * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Cromo de la aplicación que no pertenece al documento impreso. */
  .sidebar,
  .topbar,
  .menu-movil,
  .velo-menu,
  .avisos,
  .modal,
  .decision,
  .volver,
  .grafico__ayuda,
  .no-imprimir {
    display: none !important;
  }

  .app {
    display: block;
  }

  .vista {
    padding: 0;
    gap: 1.6rem;
  }

  /* Encabezado propio del documento impreso. */
  .encabezado-impresion {
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    gap: 1.6rem;
    padding-bottom: 1.2rem;
    margin-bottom: 1.6rem;
    border-bottom: 0.2rem solid #101014;
  }

  .encabezado-impresion__marca {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 1.8rem;
    font-weight: 700;
  }

  .encabezado-impresion__logo {
    width: 3.2rem;
    height: 3.2rem;
    object-fit: contain;
  }

  .encabezado-impresion__meta {
    text-align: right;
    font-size: 1.1rem;
    color: #3c3c46;
    font-family: var(--fuente-mono);
  }

  /* Evita que una sección quede partida entre dos páginas. */
  .panel,
  .ficha,
  .grafico,
  .hallazgo,
  .relacionado {
    break-inside: avoid;
    page-break-inside: avoid;
    box-shadow: none;
  }

  .panel + .panel {
    margin-top: 1.6rem;
  }

  .seccion__doble {
    grid-template-columns: 1fr 1fr;
  }

  .ficha {
    grid-template-columns: 1fr auto;
  }

  /* Los listados del panel inicial se imprimen apilados. */
  .listados {
    grid-template-columns: 1fr;
  }

  .tabla-envoltura {
    overflow: visible;
  }

  .tabla-casos {
    min-width: 0;
  }

  /* Los gráficos conservan tamaño legible en papel. */
  .grafico__lienzo {
    max-height: 24rem;
  }

  .tooltip {
    display: none !important;
  }

  a {
    text-decoration: none;
  }
}

/* Fuera de impresión el encabezado del documento permanece oculto. */
.encabezado-impresion {
  display: none;
}

</style>

/* Toda imagen creada con una ruta conocida recibe su versión incrustada. */
const crearElementoOriginal = document.createElement.bind(document);
document.createElement = (etiqueta, opciones) => {
  const elemento = crearElementoOriginal(etiqueta, opciones);

  if (etiqueta.toLowerCase() === "img") {
    const asignarSrc = Object.getOwnPropertyDescriptor(
      HTMLImageElement.prototype,
      "src"
    );

    Object.defineProperty(elemento, "src", {
      get() {
        return asignarSrc.get.call(this);
      },
      set(valor) {
        asignarSrc.set.call(this, RECURSOS[valor] ?? valor);
      },
      configurable: true,
    });
  }

  return elemento;
};

/* setAttribute("src", …) sigue la misma sustitución. */
const ponerAtributoOriginal = Element.prototype.setAttribute;
Element.prototype.setAttribute = function (nombre, valor) {
  if (nombre === "src" && RECURSOS[valor]) {
    return ponerAtributoOriginal.call(this, nombre, RECURSOS[valor]);
  }
  return ponerAtributoOriginal.call(this, nombre, valor);
};

/* =========================================================================
   LISA vigIA — Utilidades de construcción de DOM.
   Todo el contenido se crea con createElement/appendChild: en el proyecto
   no se usa innerHTML en ningún punto.
   ========================================================================= */

const ESPACIO_SVG = "http://www.w3.org/2000/svg";

/**
 * Crea un elemento HTML aplicando clases, atributos, texto e hijos.
 * @param {string} etiqueta Nombre de la etiqueta a crear.
 * @param {object} [opciones]
 * @param {string|string[]} [opciones.clase] Clase o listado de clases.
 * @param {string} [opciones.texto] Contenido textual del elemento.
 * @param {object} [opciones.atributos] Pares atributo/valor.
 * @param {object} [opciones.datos] Pares que se vuelcan en dataset.
 * @param {Node[]} [opciones.hijos] Nodos que se anexan en orden.
 * @param {object} [opciones.eventos] Pares evento/manejador.
 * @returns {HTMLElement}
 */
function crear(etiqueta, opciones = {}) {
  const elemento = document.createElement(etiqueta);
  aplicarOpciones(elemento, opciones);
  return elemento;
}

/**
 * Equivalente a `crear` para elementos SVG, que exigen espacio de nombres.
 * @param {string} etiqueta
 * @param {object} [opciones]
 * @returns {SVGElement}
 */
function crearSVG(etiqueta, opciones = {}) {
  const elemento = document.createElementNS(ESPACIO_SVG, etiqueta);
  aplicarOpciones(elemento, opciones, true);
  return elemento;
}

/* Vuelca las opciones comunes sobre un elemento ya creado. */
function aplicarOpciones(elemento, opciones, esSVG = false) {
  const { clase, texto, atributos, datos, hijos, eventos } = opciones;

  if (clase) {
    const clases = Array.isArray(clase) ? clase : [clase];
    const limpias = clases.filter(Boolean);

    if (esSVG) {
      /* classList es de solo lectura en SVG antiguos: se usa el atributo. */
      elemento.setAttribute("class", limpias.join(" "));
    } else {
      elemento.classList.add(...limpias);
    }
  }

  if (texto !== undefined && texto !== null) {
    elemento.textContent = String(texto);
  }

  if (atributos) {
    Object.entries(atributos).forEach(([nombre, valor]) => {
      if (valor !== undefined && valor !== null && valor !== false) {
        elemento.setAttribute(nombre, String(valor));
      }
    });
  }

  if (datos) {
    Object.entries(datos).forEach(([nombre, valor]) => {
      elemento.dataset[nombre] = String(valor);
    });
  }

  if (hijos) {
    hijos.filter(Boolean).forEach((hijo) => elemento.appendChild(hijo));
  }

  if (eventos) {
    Object.entries(eventos).forEach(([nombre, manejador]) => {
      elemento.addEventListener(nombre, manejador);
    });
  }
}

/**
 * Vacía un contenedor sin recurrir a innerHTML.
 * @param {HTMLElement} contenedor
 */
function vaciar(contenedor) {
  while (contenedor.firstChild) {
    contenedor.removeChild(contenedor.firstChild);
  }
}

/**
 * Reemplaza el contenido de un contenedor por los nodos indicados.
 * @param {HTMLElement} contenedor
 * @param {...Node} nodos
 */
function reemplazar(contenedor, ...nodos) {
  vaciar(contenedor);
  nodos.filter(Boolean).forEach((nodo) => contenedor.appendChild(nodo));
}

/**
 * Crea un fragmento con varios nodos para insertarlos de una sola vez.
 * @param {Node[]} nodos
 * @returns {DocumentFragment}
 */
function fragmento(nodos) {
  const contenedor = document.createDocumentFragment();
  nodos.filter(Boolean).forEach((nodo) => contenedor.appendChild(nodo));
  return contenedor;
}

  Object.assign(REGISTRO, { crear, crearSVG, vaciar, reemplazar, fragmento });
})();

(() => {
/* =========================================================================
   LISA vigIA — Preferencia de tema.
   El tema se marca con un atributo en el elemento raíz; el CSS resuelve el
   resto redefiniendo sus variables. La elección se recuerda entre visitas y,
   si no hay ninguna guardada, se respeta la preferencia del sistema.
   ========================================================================= */

const CLAVE = "lisa-vigia-tema";
const OSCURO = "oscuro";
const CLARO = "claro";

/* Suscriptores que se avisan cuando el tema cambia. */
const oyentes = new Set();

/* Lee la preferencia guardada; el acceso puede fallar si el navegador
   bloquea el almacenamiento, en cuyo caso se ignora sin romper la app. */
function leerGuardado() {
  try {
    const valor = window.localStorage.getItem(CLAVE);
    return valor === CLARO || valor === OSCURO ? valor : null;
  } catch {
    return null;
  }
}

function guardar(tema) {
  try {
    window.localStorage.setItem(CLAVE, tema);
  } catch {
    /* Sin almacenamiento la elección dura lo que la sesión. */
  }
}

/* La aplicación abre en modo diurno; el nocturno queda a un clic para quien
   lo prefiera. Una elección guardada tiene prioridad sobre este valor. */
function temaInicial() {
  return leerGuardado() ?? CLARO;
}

let temaActual = temaInicial();

/** Aplica el tema al documento. */
function aplicar(tema) {
  temaActual = tema;

  if (tema === CLARO) {
    document.documentElement.setAttribute("data-tema", CLARO);
  } else {
    document.documentElement.removeAttribute("data-tema");
  }

  oyentes.forEach((oyente) => oyente(tema));
}

/** Devuelve el tema activo. */
function obtenerTema() {
  return temaActual;
}

/** Indica si el tema activo es el diurno. */
function esTemaClaro() {
  return temaActual === CLARO;
}

/**
 * Alterna entre el tema diurno y el nocturno.
 * @returns {string} El tema que queda activo.
 */
function alternarTema() {
  const siguiente = temaActual === CLARO ? OSCURO : CLARO;
  aplicar(siguiente);
  guardar(siguiente);
  return siguiente;
}

/**
 * Registra una función que se ejecuta con cada cambio de tema.
 * @param {Function} oyente Recibe el nombre del tema activo.
 * @returns {Function} Función para cancelar la suscripción.
 */
function alCambiarTema(oyente) {
  oyentes.add(oyente);
  return () => oyentes.delete(oyente);
}

/** Deja el documento en el tema que corresponde al arrancar. */
function iniciarTema() {
  aplicar(temaActual);
}

  Object.assign(REGISTRO, { obtenerTema, esTemaClaro, alternarTema, alCambiarTema, iniciarTema });
})();

/* =========================================================================
   LISA vigIA — Orientación de los gráficos.

   En pantallas estrechas el ancho es el recurso escaso y el alto sobra. Por
   eso los gráficos no encogen su composición de escritorio —eso apretaría
   los elementos hasta solaparlos— sino que adoptan una disposición vertical
   propia: el eje del tiempo baja, las series se leen de arriba abajo y cada
   dato dispone de una franja entera para su rótulo.
   ========================================================================= */

/* Ancho por debajo del cual los gráficos adoptan su disposición vertical. */
const ANCHO_ESTRECHO = 760;

/**
 * Indica si conviene dibujar la versión vertical del gráfico.
 * @returns {boolean}
 */
function esPantallaEstrecha() {
  return window.innerWidth <= ANCHO_ESTRECHO;
}

  Object.assign(REGISTRO, { ANCHO_ESTRECHO, esPantallaEstrecha });
})();

/* Deduce el semáforo a partir del puntaje, de modo que la ficha del caso
   resuelto concuerde con el riesgo que se le asignó en su momento. */
function semaforoSegunPuntaje(puntaje) {
  const nivel = (umbralAlto, umbralMedio) =>
    puntaje >= umbralAlto ? NIVEL.ALTO : puntaje >= umbralMedio ? NIVEL.MEDIO : NIVEL.BAJO;

  return {
    forense: nivel(80, 45),
    validacion: nivel(75, 40),
    patrones: nivel(70, 35),
  };
}

/**
 * Construye un icono SVG por su nombre.
 * @param {string} nombre Clave dentro del catálogo de trazos.
 * @param {object} [opciones]
 * @param {number} [opciones.tamano] Lado del icono en píxeles.
 * @param {string} [opciones.clase] Clase adicional para el SVG.
 * @returns {SVGElement}
 */
function icono(nombre, opciones = {}) {
  const { tamano = 20, clase } = opciones;
  const definicion = TRAZOS[nombre] ?? TRAZOS.aviso;

  const svg = crearSVG("svg", {
    clase: ["icono", clase],
    atributos: {
      width: tamano,
      height: tamano,
      viewBox: "0 0 24 24",
      fill: "none",
      stroke: "currentColor",
      "stroke-width": 1.7,
      "stroke-linecap": "round",
      "stroke-linejoin": "round",
      "aria-hidden": "true",
      focusable: "false",
    },
  });

  definicion.forEach(({ forma, atributos }) => {
    svg.appendChild(crearSVG(forma, { atributos }));
  });

  return svg;
}

  Object.assign(REGISTRO, { icono });
})();

(() => {
